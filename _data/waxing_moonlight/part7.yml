chapter1:
  rows:
  - text:
      - "Чёрная аура надвигалась на них со всех сторон."
      - "Как бы сильно Мусаси ни взмахивала клинком, даже острый блеск меча не мог рассечь эту тьму."
  - char: "nagato"
    side: "left"
    text:
      - "Да хранят нас боги, рассейся!.."
  - text:
      - "Посреди чёрной ауры лишь один клочок пространства оставался светлым."
      - "Однако этот единственный свет яростно мерцал, и хрупкое равновесие между светом и тьмой вот-вот должно было окончательно рухнуть..."
  - char: "nagato"
    side: "left"
    text:
      - "Как же так!.."
      - "......"
      - "Раз уж до этого дошло, у меня есть ещё один способ."
      - "Если я вложу всю свою силу в твой клинок, твой сокрушительный удар, возможно, даст нам шанс на спасение."
  - char: "musashi"
    side: "right"
    text:
      - "Ни в коем случае!"
      - "Если ты это сделаешь, что будет с тобой, госпожа Нагато?!"
  - char: "nagato"
    side: "left"
    text:
      - "Защита Империи Сакуры — мой долг как мико - Дитя Богов."
      - "Я уже давно дала клятву..."
      - "Да хранят нас боги!"
  - text:
      - "Нагато вложила ножны в руки Мусаси, а затем резко оттолкнула её от себя."
      - "В следующее мгновение чёрная мгла поглотила Нагато, оказавшуюся за пределами барьера."
  - char: "musashi"
    side: "right"
    text:
      - "Госпожа Нагато!"
  - text:
      - "Всё погрузилось в бесконечную тишину и тьму..."
      - "Обрывки воспоминаний беспорядочно сплетались воедино, хаотично сменяя друг друга."

chapter2:
  rows:
  - char: "nagato"
    side: "left"
    text:
      - "Священное древо... начало увядать... вера людей... иссякает..."
      - "Буквально на днях я получила приказ об отстранении от должности флагмана Объединённого флота."
      - "Нет, на самом деле это было моё собственное решение..."
  - char: "musashi"
    side: "right"
    text:
      - "Госпожа Нагато, твои раны слишком тяжелы, если так пойдёт и дальше, боюсь..."
  - char: "nagato"
    side: "left"
    text:
      - "Если удастся найти того, кому можно доверить будущее Империи Сакуры, то мой уход не оставит сожалений."
  - char: "musashi"
    side: "right"
    text:
      - "Священное древо! Госпожа Нагато, пока Священное древо живо, у тебя всё ещё есть надежда на спасение!"
  - char: "nagato"
    side: "left"
    text:
      - "Ты предлагаешь погрузиться в сон внутри Священного древа?.."
      - "...Но прежде чем я это сделаю, мне нужно кое с чем разобраться."
      - "Мусаси, скажи, сколько дней ещё продержится моё тело до того, как я усну?"
      - "......"
      - "........."
      - "...Этого достаточно. Передай мой приказ: немедленно начать подготовку к проведению учений."
      - "Во время учений я лично объявлю всем, что покидаю пост верховного флагмана Империи Сакуры..."

chapter3:
  rows:
  - text:
      - "*дзинь*"
      - "Раздался мелодичный звон колокольчика."
      - "Мусаси села в постели. За окном высоко висела яркая луна."
      - "Немного поразмыслив, она встала и оделась."
      - "Услышав шум, Сакава поспешила к дверям комнаты Мусаси."
  - char: "sakawa"
    side: "left"
    text:
      - "Госпожа Мусаси, ты уходишь?"
  - char: "musashi"
    side: "right"
    text:
      - "Тшш..."
      - "У меня важное дело к госпоже Нагато."
  - char: "sakawa"
    side: "left"
    text:
      - "Госпожа Мусаси, ты выглядишь неважно. Может, стоит подождать до рассвета, прежде чем что-то решать..."
  - char: "musashi"
    side: "right"
    text:
      - "Дело не терпит отлагательств. Нельзя терять ни минуты."
      - "И ещё... пожалуйста, позаботься о нашей «гостье»."
      - "Если у неё возникнут какие-либо вопросы, не стесняйся отвечать на них, расскажи всё, что в твоих силах."

chapter4:
  rows:
  - text:
      - "Дверь тихо закрылась, и она отправилась в путь в одиночестве, ступая по залитой лунным светом ночной мгле."
      - "Она оглянулась на мерцающее в свете свечей окно Тэнсюкаку."
      - "В эту долгую ночь никто не сомкнёт глаз."
