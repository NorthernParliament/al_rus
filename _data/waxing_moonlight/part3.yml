chapter1:
  rows:
  - text:
      - "Лёгкие облака скрыли лунный свет, и по поверхности озера вдали пробежала рябь."
      - "Во дворе неподалеку от резиденции две фигуры шли по каменным ступеням."
      - "Внезапно налетел лёгкий ветерок, поднимая в воздух опавшие листья."
      - "Хрупкая девушка прикрылась длинными рукавами и оглянулась назад."
      - "Лёгкие облака уже рассеялись, и лунный свет залил весь двор призрачно-синим сиянием."
  - char: "musashi"
    side: "left"
    text:
      - "Госпожа Нагато, ты в порядке?"
  - text:
      - "Посмотрев в направлении её взгляда, она увидела лишь пустынный, безмятежный берег озера."
  - char: "nagato"
    side: "right"
    text:
      - "Ты помнишь это место?"
      - "Много лет назад она передавала сообщения через Священное древо."
      - "И велела мне провести ритуал, чтобы призвать её сюда."
  - char: "musashi"
    side: "left"
    text:
      - "Человек, о котором ты говоришь... это «Великий Мудрец»?"
  - char: "nagato"
    side: "right"
    text:
      - "Именно."
  - text:
      - "После недолгого молчания Нагато направилась к озеру."
  - char: "nagato"
    side: "right"
    text:
      - "На самом деле, что касается всего этого... увидев ту сцену во сне, ты, должно быть, уже нашла ответ в своем сердце."
      - "Верно?"
      - "Мусаси, если хочешь что-то сказать, говори прямо."
      - "Здесь больше никого нет."
  - char: "musashi"
    side: "left"
    text:
      - "Госпожа Нагато..."
      - "Увядание Священного древа — это дурное предзнаменование, напрямую связанное с безопасностью «Великого Священного древа» Империи Сакуры."
      - "Если увядание затронуло и его, то это полностью объясняет причины всей череды недавних происшествий."
      - "Точно так же, как это было более десяти лет назад."
      - "Но обладаем ли мы сейчас достаточной силой, чтобы вступить в битву с этим?"
  - char: "nagato"
    side: "right"
    text:
      - "С тех пор, как я себя помню, Великое Священное древо Империи Сакуры находилось под защитой Великого Мудреца, изолированное от всего мира и в полной безопасности."
      - "И раз теперь вновь поднимаются волны, должно быть, в Святилище, где находится Великое Священное древо, произошло нечто непредвиденное."
  - char: "musashi"
    side: "left"
    text:
      - "Если твои суждения верны, и увядание Священного древа — это... отголосок того инцидента многолетней давности."
      - "Мы должны быть готовы к самому худшему."
  - char: "nagato"
    side: "right"
    text:
      - "Мы должны немедленно отправиться в путь и лично посетить Святилище."
