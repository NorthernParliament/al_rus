chapter1:
  rows:
  - text:
      - "Девушка стояла у окна и смотрела вдаль, этой ночью ей было не до сна."
      - "Её лицо скрывала белоснежная вуаль."
      - "*топ**топ**топ*"
  - char: "sakawa"
    side: "left"
    text:
      - "Прошу прощения! Я услышала какой-то шум и решила подняться проверить."
      - "Прости, что потревожила твой покой!"
  - char: "nop"
    side: "right"
    text:
      - "Не бери в голову, мне тоже не спалось, поэтому я пришла сюда."
  - char: "sakawa"
    side: "left"
    text:
      - "Ты ищешь госпожу Мусаси?"
      - "Кажется, госпожа Мусаси сегодня вечером куда-то ушла."
  - text:
      - "Она достала лежащую позади подушку для сидения, положила её рядом с собой и слегка похлопала по ней."
  - char: "nop"
    side: "right"
    text:
      - "Составишь мне компанию для беседы?"
  - char: "sakawa"
    side: "left"
    text:
      - "Конечно, конечно!"
      - "Чуть не забыла! Сначала я должна приготовить для тебя чай..."
  - char: "nop"
    side: "right"
    text:
      - "Не утруждай себя."
  - char: "sakawa"
    side: "left"
    text:
      - "Хм... О чём бы ты хотела поговорить?"
  - char: "nop"
    side: "right"
    text:
      - "Расскажи мне о прошлом этого места."
  - char: "sakawa"
    side: "left"
    text:
      - "О прошлом..."
      - "Госпожа Мусаси ранее велела мне отвечать на любые твои вопросы, так что я расскажу всё, что в моих силах."
      - "С чего бы ты хотела начать?"
  - char: "nop"
    side: "right"
    text:
      - "Например, с того, что было более десяти лет назад."
  - char: "sakawa"
    side: "left"
    text:
      - "Более десяти лет назад... Ты имеешь в виду то время, когда госпожа Нагато организовала учения и покинула пост верховного флагмана?"
      - "Хотя о тех временах я знаю лишь понаслышке..."
  - char: "nop"
    side: "right"
    text:
      - "Ничего страшного, если только понаслышке."
      - "Просто расскажи мне то, что знаешь."
  - text:
      - "Девушка сняла вуаль, позволив своим длинным волосам свободно рассыпаться по плечам."
      - "Она посмотрела на сидящую рядом Сакаву, и её тёмно-красные глаза словно обладали какой-то магической притягательностью."
      - "Сакава сделала глубокий вдох."
  - char: "sakawa"
    side: "left"
    text:
      - "Всё что я расскажу, я лишь слышала от других... А началась эта история одним ранним утром много лет назад..."
