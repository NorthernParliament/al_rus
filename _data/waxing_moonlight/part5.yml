chapter1:
  rows:
  - text:
      - "Утренний ветерок скользнул сквозь густые ветви деревьев, мягко стряхивая розовые лепестки."
  - char: "nagato"
    side: "left"
    text:
      - "Это..."
  - text:
      - "По обе стороны уходящей вдаль дороги цвела сакура, и опадающие лепестки устилали путь."
      - "Остановившись под одним из деревьев, она огляделась и слегка коснулась его рукой..."

chapter2:
  rows:
  - char: "yuudachi"
    side: "left"
    text:
      - "Мичисио!"
  - char: "michishio"
    side: "right"
    text:
      - "Юдати? Доброе утро."
  - char: "yuudachi"
    side: "left"
    text:
      - "Доброе утро, распустившаяся сакура и впрямь так прекрасна."
      - "Э-э? Разве в это время ты обычно не должна убираться во дворе?"
      - "Неужели тайком сбежала, чтобы полюбоваться сакурой?"
  - char: "michishio"
    side: "right"
    text:
      - "Я закончила уборку ещё рано утром."
      - "Госпожа Муцу сказала, что сегодня к нам прибудет важный гость, поэтому отпустила меня пораньше."
  - char: "yuudachi"
    side: "left"
    text:
      - "Важный гость госпожи Нагато?"
  - char: "michishio"
    side: "right"
    text:
      - "Ага, это большая редкость."
      - "Впрочем, раз уж госпожа Муцу ничего не рассказала, давай не будем гадать понапрасну."
      - "О, точно, вчера я приготовила сакура-моти..."
  - char: "yuudachi"
    side: "left"
    text:
      - "Правда?! Сакура-моти от Мичисио — самые вкусные! Давай скорее найдём местечко, чтобы передохнуть и перекусить!"
  - char: "michishio"
    side: "right"
    text:
      - "Юдати, ты слишком торопишься. Чтобы насладиться вкусной едой, прекрасный вид просто необходим."
      - "Уже придумала, куда пойдём?"
  - char: "yuudachi"
    side: "left"
    text:
      - "Может быть... тайком проберёмся во двор госпожи Нагато..."
  - char: "michishio"
    side: "right"
    text:
      - "Точно нет!"
  - char: "yuudachi"
    side: "left"
    text:
      - "Тогда давай на ту поляну впереди. Трава, сакура и вкусняшки — просто идеально!"
  - char: "michishio"
    side: "right"
    text:
      - "Тогда иди туда первой, а я сбегаю за корзинкой с едой..."
      - "Ой..."
  - text:
      - "Незнакомка подхватила резко обернувшуюся и врезавшуюся прямо в неё Мичисио. Протянув руку, она мягко смахнула лепестки, упавшие на голову девочки."
      - "Она была одета в белые одежды, а из-под манжет виднелась фиолетовая подкладка. Капюшон скрывал её лицо, не давая его разглядеть."
      - "Почувствовав себя виноватой, Мичисио лишь мельком взглянула на неё и поспешно опустила голову."
  - char: "michishio"
    side: "left"
    text:
      - "П-прости! Э-это... всё из-за того, что я зазевалась."
  - text:
      - "......"
      - "Однако ответа Мичисио так и не дождалась."
      - "Когда она нервно подняла голову, незнакомки, смахнувшей с неё лепестки, и след простыл."
      - "Вдалеке Юдачи махала рукой, зовя Мичисио к себе."
  - char: "michishio"
    side: "left"
    text:
      - "Х-хорошо, я... я уже иду."
      - "(Какая-то она очень странная... эта старшая сестрёнка...)"
