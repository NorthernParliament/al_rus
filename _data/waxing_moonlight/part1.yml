chapter1:
  rows:
  - text:
      - "Утренний ветерок скользнул сквозь густые ветви деревьев, мягко стряхивая розовые лепестки."
  - char: "nagato"
    side: "left"
    text:
      - "Это..."
  - text:
      - "По обе стороны уходящей вдаль дороги цвела сакура, и опадающие лепестки устилали путь."
      - "Остановившись под одним из деревьев, Нагато огляделась и слегка коснулась его рукой."

chapter2:
  rows:
  - text:
      - "В роскошной комнате танцевали тени от мерцающего света ламп."
  - char: "nagato"
    side: "left"
    text:
      - "Это сон..."
      - "Но почему я всё ещё чувствую эту острую боль."
  - text:
      - "Священное древо, разрушающееся под покровом скверного черного тумана, дрожащее во тьме, испускающее последний вздох."
      - "Всё вокруг увядает, жизни гибнут... Это картина разрушения, которую я не смогу забыть до конца своих дней."
      - "Тихий стук в дверь прервал воспоминания Нагато."
  - char: "nagato"
    side: "left"
    text:
      - "Кавакадзэ? Входи."
  - text:
      - "С шелестом раздвижной двери перед ней показалась фигура с белыми волосами и в белых одеждах."
  - char: "kawakaze"
    side: "left"
    text:
      - "Прости, госпожа Нагато, что потревожила тебя."
  - char: "nagato"
    side: "right"
    text:
      - "Всё в порядке. Как раз есть один неясный для меня вопрос."
      - "Недавние донесения об увядании Священных древ в разных уголках империи — это правда?"
  - char: "kawakaze"
    side: "left"
    text:
      - "Отвечаю, госпожа Нагато. Все донесения об увядании Священных древ были полностью проверены. Всё изложенное в них... чистая правда."
  - char: "nagato"
    side: "right"
    text:
      - "Выходит, это был не просто сон..."
      - "Увядание Священного древа распространяется всё дальше от столицы..."
  - text:
      - "Нагато принялась поправлять на себе одежду, а сидевшая у двери Кавакадзе поднялась и закрыла двери и окна."
      - "Раскрылась резная узорчатая ширма, и на её полупрозрачном шёлке отразился силуэт девушки."
      - "В мерцающем свете ламп на ширму легла тень распущенных длинных волос, оставляя размытый, изящный силуэт."
      - "С тихим журчанием зачерпнутая ковшом вода полилась по её шее..."
  - char: "nagato"
    side: "left"
    text:
      - "Кавакадзэ, отправь сообщение Мусаси. Сегодня на рассвете я нанесу ей визит."
  - char: "kawakaze"
    side: "right"
    text:
      - "Госпожа Нагато, вообще-то..."
      - "Госпожа Мусаси уже долгое время ждёт в вестибюле."
