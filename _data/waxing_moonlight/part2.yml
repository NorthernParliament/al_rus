chapter1:
  rows:
  - text:
      - "В усыпанном звёздами небе высоко висела полная луна."
      - "Кавакадзэ подала им наполовину наполненные чашки чая, а затем молча удалилась."
      - "На смотровой площадке высокого павильона они сидели бок о бок, обратив лица к лунному свету."
      - "Ветер шелестел в листве деревьев."
      - "В огромной резиденции было слегка пустынно."
  - char: "musashi"
    side: "left"
    text:
      - "Госпожа Нагато, что именно ты видела в своём сне?"
  - char: "nagato"
    side: "right"
    text:
      - "Я видела, как гуляю по аллее сакуры, а лепестки падают, словно снег."
      - "А затем... когда я дотронулась до этих цветов, они рассеялись прямо в моих ладонях."
      - "То же самое случилось и с ветвями деревьев... от одного лёгкого прикосновения они все увядали и, в конце концов, поглощались бесконечной тьмой."
      - "Осталась лишь мёртвая тишина, Мусаси."
  - char: "musashi"
    side: "left"
    text:
      - "Я видела нечто похожее."
      - "Та же цветущая сакура, но в моем сне она немного отличалась от твоей."
      - "Это было гигантское древо, устремляющееся в самые небеса, а его раскидистые ветви закрывали собой солнце."
      - "По размерам оно превосходило даже то Священное древо, в котором ты когда-то спала."
      - "А затем..."
      - "Я стала свидетельницей его гибели."
      - "Распустившиеся цветы в одно мгновение рассыпались в прах, оставив после себя лишь иссохшие ветви."
      - "А следом за этим пришла бескрайняя тьма."
  - char: "nagato"
    side: "right"
    text:
      - "Должно быть, тебе известно, что в последнее время из разных уголков Империи Сакуры поступают сообщения об увядании Священных древ."
  - char: "musashi"
    side: "left"
    text:
      - "Похоже, в этом увядании есть какая-то закономерность."
      - "Чем ближе Святилище к столице — то есть к месту твоего прежнего сна, — тем чаще поступают подобные донесения."
  - char: "nagato"
    side: "right"
    text:
      - "Именно это меня и беспокоит."
      - "Священные древа Империи Сакуры связаны между собой, и это главная причина столь быстрого распространения увядания."
      - "Увядание Священного древа подобно сигнальному огню, передающему миру одно послание:"
      - "Масштабное вражеское вторжение уже совсем близко."
  - text:
      - "Нагато поднялась, оставив рябь на поверхности чая в своей чашке."
  - char: "nagato"
    side: "right"
    text:
      - "Луна сегодня прекрасна, я хочу прогуляться."
  - char: "kawakaze"
    side: "left"
    text:
      - "Госпожа Нагато!.."
  - char: "nagato"
    side: "right"
    text:
      - "Кавакадзэ, ты останешься здесь. Если я не вернусь до завтрашнего рассвета, передашь этот мешочек Муцу."
  - char: "kawakaze"
    side: "left"
    text:
      - "Да, госпожа Нагато."
