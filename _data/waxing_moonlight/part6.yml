chapter1:
  rows:
  - text:
      - "Лёгкие облака скрыли лунный свет, и внутри помещения внезапно потемнело."
  - char: "sakawa"
    side: "left"
    text:
      - "Вскоре после этого госпожа Нагато объявила об уходе с поста верховного флагмана и одновременно о проведении учений."
  - char: "nop"
    side: "right"
    text:
      - "Хочешь сказать, что прибытие таинственной гостьи как-то связано с тем, что произошло потом?"
  - char: "sakawa"
    side: "left"
    text:
      - "Нет, нет, нет, это всё лишь наши догадки..."
      - "На самом деле, прежде чем госпожа Нагато публично сделала это объявление, она на какое-то время отправилась в поездку."
      - "Но странно то, что никто в других уголках Империи Сакуры её тогда так и не видел."
      - "Однако на самом деле..."
  - text:
      - "Сакава внезапно понизила голос и выпрямилась, приняв серьезный вид."
  - char: "sakawa"
    side: "left"
    text:
      - "На самом деле в то время госпожа Нагато отправилась в некое Святилище."
      - "Среди тех, кто тогда её сопровождал, была и госпожа Мусаси."
      - "А я была в числе свиты, сопровождавшей госпожу Мусаси в качестве её охраны..."
      - "Но я знаю лишь самую малость, ведь всем сопровождающим приказали оставаться снаружи Святилища и ждать."
      - "В Святилище вошли только госпожа Нагато, госпожа Мусаси и та загадочная гостья."
      - "...Вот и всё, что мне известно."
  - char: "nop"
    side: "right"
    text:
      - "Сегодня вечером госпожа Мусаси ушла, не попрощавшись. Она отправилась к госпоже Нагато?"
  - char: "sakawa"
    side: "left"
    text:
      - "Да..."
  - char: "nop"
    side: "right"
    text:
      - "Госпожа Мусаси не говорила с тобой в последнее время о сновидениях?"
  - char: "sakawa"
    side: "left"
    text:
      - "Нет, не говорила. Однако в последние дни госпожа Мусаси выглядела неважно..."
      - "Неужели тебе тоже не спится из-за ночных кошмаров?"
  - text:
      - "Лёгкие облака рассеялись, и в ясном ночном небе внезапно прозвучало несколько низких раскатов грома."
      - "Тонкая фиолетовая молния ударила в землю, и вскоре раскатистый гром стих."
  - char: "sakawa"
    side: "left"
    text:
      - "Это..."
  - char: "nop"
    side: "right"
    text:
      - "Это сигнал госпожи Мусаси. Мне пора отправляться."
      - "Ах да, это тебе."
      - "Давно со мной никто так не разговаривал, спасибо тебе."
  - text:
      - "Она вложила что-то в руку Сакавы, развернулась и ушла."
  - char: "sakawa"
    side: "left"
    text:
      - "Это... оригами?"
  - text:
      - "Разжав ладонь, она увидела, что сложенная из бумаги фигурка напоминает милое личико."
      - "Только вот на голове у неё было два выступа, похожих на рожки."
  - char: "sakawa"
    side: "left"
    text:
      - "Э-э? Это... неужели это я?"
      - "Хи-хи..."
  - text:
      - "Но её улыбка быстро угасла."
      - "Она сжала в руке оригами и устремила взгляд на яркую луну в ночном небе."
  - char: "sakawa"
    side: "left"
    text:
      - "Пусть боги хранят их."
      - "Пусть все обязательно вернутся в целости и сохранности..."
