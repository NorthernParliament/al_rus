chapter1:
  rows:
  - text:
      - "Банкет был в самом разгаре."
      - "Кругом царило беззаботное веселье с музыкой и танцами, но у меня на душе почему-то было неспокойно."
      - "Сославшись на усталость, я покинул приём раньше времени."

chapter2:
  rows:
  - text:
      - "Я шёл в одиночестве под луной."
      - "Лёгкий ветерок обдувал лицо приятной прохладой; я свернул на тёмную тропу."
      - "Освещаемый лишь лунным светом, я брёл куда глаза глядят."
      - "В этот миг я ощутил редкое умиротворение."
      - "Возможность сбежать ото всей этой суеты дарила ни с чем не сравнимое чувство свободы."
      - "Не знаю, сколько развилок я миновал."
      - "Не знаю, как долго я шёл."
      - "Пока перед моими глазами не открылась совсем иная картина."
      - "Похоже, это был сад, обустроенный с исключительной тонкостью и вкусом."
      - "На душе враз стало тихо и безмятежно."
      - "Сделав ещё несколько шагов, я увидел залитую лунным сиянием гладь озера."
      - "И там, у самой воды, казалось, кто-то стоял, словно кого-то ожидая."
