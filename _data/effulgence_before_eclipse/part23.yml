chapter1:
  rows:
  - text:
      - "В непроницаемом барьере возникли трещины."
      - "Многие годы чёрное марево непрестанно разъедало эту последнюю чистую землю в здешнем пространстве."
      - "Высоко висевшую в небе яркую луну постепенно заволакивала тень."
  - char: "hatsuzuki"
    side: "left"
    text:
      - "Лунное затмение?.."
  - text:
      - "Все отступили к берегу озера, выходившего в бездну."
  - char: "owari"
    side: "right"
    text:
      - "Трещины продолжают расти!"
  - text:
      - "Они открыли огонь по разлому в небе, но рассечённое орудийными залпами марево вмиг обратилось бесчисленной стаей воронов."
      - "Пожирающая всё тьма мало-помалу заполнила небосвод."
  - char: "owari"
    side: "right"
    text:
      - "Отойдите ко мне за спину."
  - char: "hatsuzuki"
    side: "left"
    text:
      - "Овари, у тебя ведь тоже почти не осталось снарядов."
  - char: "owari"
    side: "right"
    text:
      - "Не переживай, я ещё продержусь."
      - "Хацудзуки, драться ещё можешь?"
  - char: "hatsuzuki"
    side: "left"
    text:
      - "Конечно."
  - char: "asanagi"
    side: "right"
    text:
      - "И я с вами!"
  - char: "owari"
    side: "left"
    text:
      - "Тогда навалимся вместе. Залп!"
  - text:
      - "Орудия главного калибра взревели, подобно грому, разнося вокруг раскатистое эхо."
      - "Однако следом за ним ещё более мощный раскатистый грохот пришёл с недосягаемой высоты."
      - "Пурпурные молнии поползли по разлому ввысь, разгоняя всё марево на своём пути."
      - "Гром гремел не смолкая."
  - char: "owari"
    side: "left"
    text:
      - "Приготовиться к удару!"
  - text:
      - "Пурпурные молнии низверглись вниз, словно капли дождя на замедленной съёмке, вытянувшись в частые тонкие струны."
      - "Вспышки молний подняли настоящую бурю в этом и без того тесном пространстве."
      - "Разлом стал медленно затягиваться, а всё марево, пытавшееся прорваться внутрь, пурпурные молнии отсекли за пределами барьера."
      - "Когда буря утихла, перед изумлёнными девушками предстала Мусаси."
  - char: "owari"
    side: "left"
    text:
      - "Госпожа Мусаси!"
  - char: "musashi"
    side: "right"
    text:
      - "Овари, и вы все."
      - "..."
      - "Больше здесь никого нет?"
  - char: "owari"
    side: "left"
    text:
      - "Никого... Ох, точно!"
      - "Нас спасла одна сестрица в белых одеждах и с белыми волосами, а потом она куда-то исчезла!"
  - char: "musashi"
    side: "right"
    text:
      - "Как и думала... Великий Мудрец всё ещё держит оборону."
      - "Та, кого вы только что видели — хранительница Великого Древа Сакуры."
      - "Много лет назад я плечом к плечу сражалась вместе с госпожой Нагато и Великим Мудрецом, но..."
      - "Великий Мудрец, желая защитить нас с госпожой Нагато, вытолкнула нас за пределы барьера."
      - "Вот только барьер, возведённый Великим Мудрецом, оказался слишком могущественным, и даже госпожа Нагато не могла легко вмешаться в него."
      - "Госпожа Нагато была бессильна что-либо сделать, кроме как укрепить эту печать."
  - char: "owari"
    side: "left"
    text:
      - "Так вот почему госпожа Нагато велела построить аванпост..."
      - "На словах — чтобы оберегать покой Святилища, а на самом деле — чтобы следить за состоянием печати."
      - "...Если подумать, те странности, что случались раньше, вполне могли быть признаками того, что печать ослабла."
  - char: "hatsuzuki"
    side: "right"
    text:
      - "Госпожа Мусаси, мы же все видели, как тебя проглотило чудовище... Ты не пострадала?"
  - char: "musashi"
    side: "left"
    text:
      - "После той великой битвы мою оснастку специально укрепили, так что об этом можешь не тревожиться."
      - "Подойдите ко мне. Госпожа Нагато передала мне кое-что."
  - char: "hatsuzuki"
    side: "right"
    text:
      - "Это же!..."
  - char: "zuihou"
    side: "left"
    text:
      - "Талисман госпожи Нагато?!"
  - char: "musashi"
    side: "right"
    text:
      - "Скорее используй его."
  - text:
      - "Она протянула бумажный талисман Хацудзуки."
      - "Та зажала талисман между пальцами, и бумага внезапно вспыхнула пламенем."
  - char: "hatsuzuki"
    side: "left"
    text:
      - "..."
      - "Э?.."
      - "С этим талисманом что-то не так?"
      - "Госпожа Мусаси, что за технику ты мне дала?"
      - "Кажется, у меня ничего не получилось..."
  - char: "musashi"
    side: "right"
    text:
      - "Нет, техника уже активирована, и госпожа Нагато знает, где мы находимся."
  - text:
      - "Сияние становилось всё ярче, и в самый последний миг Мусаси отступила от девушек."
  - char: "musashi"
    side: "left"
    text:
      - "«Пусть даже это пустая оболочка, её достаточно, чтобы изменить будущее Сакуры»."
      - "Что ж, тогда эту «пустую оболочку» я заберу себе."
