chapter1:
  rows:
  - text:
      - "Пейзаж перед глазами медленно менялся, словно выцветающая, изъеденная временем киноплёнка."
      - "Великое Древо увядало — некогда пышные ветви стремительно сохли и покрывались трещинами, пока в них не угасли последние признаки жизни."
  - char: "unzen_s"
    side: "left"
    text:
      - "Прошу, разверни барьер, госпожа Нагато."
  - text:
      - "Едва различимый мерцающий барьер укрыл девушек."

chapter2:
  rows:
  - text:
      - "В следующее мгновение земля раскололась."
      - "Чёрное марево вырвалось наружу."
      - "Взрыв разорвал твердь, и обломки земли взмыли в воздух, зависнув подобно парящим островам."
      - "В самом центре замерцал сгусток света, а затем озарил всё вокруг ослепительным сиянием."
      - "Над сияющим центром мощные корни Великого Древа оказались безжалостно переломаны."
      - "Осколки кристаллов образовали сверкающее кольцо."
      - "Это были увядшие останки, но в то же время — величественный монумент."
  - char: "musashi"
    side: "left"
    text:
      - "Какая невероятная мощь..."
      - "Так вот оно какое — ядро Великого Древа..."
      - "Плохо... Нагато!..."
  - text:
      - "Не раздумывая ни секунды, Мусаси ринулась вперёд и прыгнула прямо в тёмную пустоту."
      - "Утешало лишь одно: в этой битве она была не одна."
  - text:
      - "Нагато закрыла глаза, изо всех сил стараясь ощутить силу, идущую от Ватацуми."
      - "Мерцающий в центре свет был подобен спасительной нити во тьме, указывая Нагато путь к первооснове."
      - "Она ухватилась за неё."
  - char: "nagato"
    side: "left"
    text:
      - "Техника запечатывания: Финал..."
  - char: "musashi"
    side: "right"
    text:
      - "Госпожа Нагато!"
  - text:
      - "Фиолетовый росчерк клинка рассёк чёрное марево."
  - char: "nagato"
    side: "left"
    text:
      - "Это было на волосок от гибели... Благодарю за спасение, госпожа Мусаси."
      - "Техника наконец-то подействовала."
  - text:
      - "Под воздействием техники из пустоты словно возникло невидимое течение."
  - char: "nagato"
    side: "left"
    text:
      - "Теперь мы можем скользить по нему, как обычно... Следуй за мной."
      - "Коррозия поражает Ватацуми. Мне нужно наложить на него защитный барьер, прикрой меня!"
  - text:
      - "Светящиеся линии медленно выводили вокруг Ватацуми замысловатые узоры."
      - "Они разрастались по спирали; процесс шёл мучительно медленно, но неуклонно смыкался вокруг ядра."
  - char: "nagato"
    side: "left"
    text:
      - "Двигайся за светом! Мусаси, что-то приближается!"
      - "Залп главного калибра!..."
  - text:
      - "Пусть артиллерийский огонь и не мог развеять чёрное марево, он не давал ему обрести форму."
  - char: "musashi"
    side: "right"
    text:
      - "Право на борт!"
  - char: "nagato"
    side: "left"
    text:
      - "Кх!..."
  - text:
      - "Исполинская пасть, сотканная из чёрного марева, ринулась прямо на них."
  - char: "musashi"
    side: "right"
    text:
      - "...!"
  - text:
      - "Мусаси призвала оснастку, и её наруч принял на себя удар острых клыков чудовища."
  - char: "musashi"
    side: "right"
    text:
      - "Залп!"
  - text:
      - "Орудия главного калибра Мусаси изрыгнули пламя. Снаряды веером разорвались в воздухе, в клочья разрывая чёрную дымку."
  - char: "musashi"
    side: "right"
    text:
      - "Госпожа Нагато!"
  - char: "nagato"
    side: "left"
    text:
      - "Поняла, зарядить снаряды Тип 3!"
      - "Залп главного калибра!..."
  - text:
      - "Плотный шквал снарядов накрыл цель, вновь обратив тварь в клубящийся туман..."
  - char: "nagato"
    side: "left"
    text:
      - "Осторожно! Это ловушка!!"
  - text:
      - "Огромные клыки смяли и разорвали наруч, вырвав кусок оснастки. Следом взметнулось ослепительное пламя и прогремела череда непрекращающихся взрывов."
  - char: "musashi"
    side: "right"
    text:
      - "Тц!..."
      - "Оно не стало материализовать всё тело целиком, а создало лишь одну пасть, чтобы вцепиться в нас!"
      - "Эта тварь учится на ходу и становится умнее!"
      - "Теперь остаётся только прорываться силой!"
      - "Приготовиться к удару!"
  - text:
      - "Вжух!"
      - "Порыв энергии клинка, сорвавшийся откуда-то из пустоты, рассёк чёрное марево пополам."
      - "Едва соприкоснувшись со светом меча, марево начало стремительно испаряться."
      - "Словно капли воды на раскалённом металле, оно бесследно исчезло под хриплый вой."
  - char: "musashi"
    side: "right"
    text:
      - "Великий Мудрец вступила в бой."
      - "Великий Мудрец отвлекла на себя большую часть чёрного марева. Она выигрывает для нас время."
  - text:
      - "Мусаси развеяла остатки повреждённой оснастки, оставив в руке лишь клинок."
      - "Она подняла меч вертикально, держа лезвие на уровне бровей."
  - char: "musashi"
    side: "right"
    text:
      - "Сокрушительный гром, внемли моему приказу..."
      - "Всполох пурпурной молнии!..."
  - text:
      - "Молнии, словно безудержно разрастающиеся лозы, дико метнулись во все стороны, удерживая брешь, которую чёрное марево ещё не успело сомкнуть."
  - char: "musashi"
    side: "right"
    text:
      - "Быстрее, проходим здесь!"
