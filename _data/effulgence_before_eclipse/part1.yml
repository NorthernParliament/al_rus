chapter1:
  rows:
  - text:
      - "Под покровом ночи девушки медленно продвигались вперёд сквозь лёгкий туман."
  - char: "musashi"
    side: "left"
    text:
      - "Похолодало."
      - "Мы всё ещё в водах островов Сакуры, но кажется, будто попали на ледяной север."
  - char: "nagato"
    side: "right"
    text:
      - "...Тепло, что должно было здесь быть, исчезло."
  - char: "musashi"
    side: "left"
    text:
      - "Выходит, Великое Древо действительно..."
  - text:
      - "Нагато остановилась и, наклонившись к воде, зачерпнула её ладонями."
  - char: "nagato"
    side: "right"
    text:
      - "Море плачет."
  - text:
      - "Ледяная вода ускользала сквозь пальцы Нагато."
  - char: "nagato"
    side: "right"
    text:
      - "Мусаси, теперь, оглядываясь назад... В том сне крылись и другие знамения."
  - char: "musashi"
    side: "left"
    text:
      - "Я понимаю..."
      - "Во всех сновидениях мы видели лишь один исход — разрушение."
      - "Но вот силуэта Великого Мудреца там не было."
  - char: "nagato"
    side: "right"
    text:
      - "Словно всё повторяется, совсем как тогда..."
      - "......"
  - char: "musashi"
    side: "left"
    text:
      - "Возможно, стоило отправить флот для охраны Святилища."
  - char: "nagato"
    side: "right"
    text:
      - "Я отдавала такие распоряжения, но сторожевой флот держится лишь на подступах к нему."
      - "Что же касается Великого Древа в самой глубине, то из-за защитного барьера к нему никому не подобраться."
  - text:
      - "Туман сгущался, тьма окутывала водный путь."
  - char: "nagato"
    side: "right"
    text:
      - "Мусаси, хоть со времён нашей последней совместной битвы и прошло немало времени, я до сих пор помню всё так, будто это было вчера."
  - char: "musashi"
    side: "left"
    text:
      - "Госпожа Нагато, твоя рана, полученная тогда..."
  - char: "nagato"
    side: "right"
    text:
      - "Она уже давно затянулась, но временами всё ещё ноет."
      - "Быть может, эта боль осталась в сердце."
  - text:
      - "Три кильватерных следа продолжали тянуться вдаль."
      - "Однако в какой-то миг мир внезапно погрузился в мёртвую тишину."
      - "Словно всё пространство вокруг превратилось в вакуум — любые звуки, что должны были здесь звучать, в это мгновение бесследно исчезли."
      - "Тягостное чувство тревоги сковало всех, но, к счастью, это продлилось недолго..."
  - char: "nagato"
    side: "right"
    text:
      - "Мы на месте."

chapter2:
  rows:
  - text:
      - "Тьма, окутывавшая водный путь, дала трещину, и наружу хлынул свет — ослепительно яркий, заставивший всех невольно заслониться руками."
      - "Но тепло, исходившее от этого сияния, было подобно приглашению, безмолвно манящему ступить в сокрытую за ним райскую обитель."
      - "Не успели они опомниться, как полог тьмы сомкнулся за их спинами, вновь отрезая внешний мир."

chapter3:
  rows:
  - char: "musashi"
    side: "left"
    text:
      - "...Святилище."
  - text:
      - "Мягкий свет струился сквозь пышную листву, отбрасывая причудливые тени на лица девушек."
      - "Они с надеждой посмотрели вдаль: под нежно-розовыми небесами с головокружительной высоты низвергался величественный водопад."
      - "А ледяной туман, окутывавший тёмные морские воды, здесь обратился в лёгкие облака, клубящиеся у самых ног."
  - char: "nagato"
    side: "right"
    text:
      - "Столько лет минуло, а здесь всё по-прежнему. Будто время остановилось..."
      - "Я до сих пор помню наш разговор с Великим Мудрецом..."
