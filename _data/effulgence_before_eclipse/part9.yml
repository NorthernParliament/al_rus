chapter1:
  rows:
  - text:
      - "Во тьме забрезжил луч света, и она протянула руку, пытаясь поймать его."
  - char: "owari"
    side: "left"
    text:
      - "М-гх..."
  - text:
      - "В голове гудело, словно её только что сильно огрели чем-то тяжёлым."
      - "Ощупав затылок, следов раны она не обнаружила."
      - "Тело непрерывно покачивалось."
      - "Вся тяжесть, казалось, пришлась на пояс, а руки и ноги странно свисали вниз."
  - char: "owari"
    side: "left"
    text:
      - "Меня что, держат на весу и куда-то тащат по воздуху?.."
      - "Странно... почему я не могу открыть глаза?"
      - "Э-это ведь то, что люди зовут «сонным параличом»?!"
      - "Ну же, вспоминай скорей, что вообще произошло до этого..."
  - text:
      - "Спутанные обрывки воспоминаний закружились в голове, и она попыталась нащупать верную нить среди бесчисленных смазанных картин."
  - char: "owari"
    side: "left"
    text:
      - "Ох, точно."
      - "В тот миг, сама не знаю почему, я увидела госпожу Нагато и госпожу Мусаси под священным древом."
      - "Они... будто с чем-то сражались? Показалось?.."
      - "Значит, госпожа Нагато и госпожа Мусаси ещё много лет назад вместе приходили в Великое Святилище?.."
      - "Если так, то зов, раздавшийся тогда в моей голове... что же это было?.."
  - text:
      - "Голова раскалывалась от невыносимой боли, и ей пришлось оборвать размышления."
      - "Ощущение невесомости пропало, а запах сырой земли и свежей зелени принёс долгожданное успокоение."
  - char: "owari"
    side: "left"
    text:
      - "Мы где-то опустились?.."

chapter2:
  rows:
  - text:
      - "Открыв глаза, она увидела струящийся неподалёку печной дымок над аванпостом."
      - "Обернувшись в сторону Великого Древа, она смотрела, как зелёный луг колышется волнами под порывами ветра."
  - char: "owari"
    side: "left"
    text:
      - "Я вернулась?.. Словно во сне..."
      - "Надо скорее показаться остальным. Чувствую... грядет что-то серьёзное."
