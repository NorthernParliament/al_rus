chapter1:
  rows:
  - char: "unzen_s"
    side: "right"
    text:
      - "Почему ты всё ещё здесь?"
  - char: "unzen_s"
    side: "left"
    text:
      - "Сколько бы раз я ни исчезала, я появлюсь вновь."
      - "Я — это ты."
      - "Прошу, доверь всё оставшееся мне."
  - char: "unzen_s"
    side: "right"
    text:
      - "Нет..."
      - "Это долг, предначертанный лишь мне одной. Только мне это под силу."
  - char: "unzen_s"
    side: "left"
    text:
      - "Ты ошибаешься."
  - char: "unzen_s"
    side: "right"
    text:
      - "Бесчисленные попытки заглянуть в будущее открыли мне истину, а гибель тысяч миров наконец заставила поверить."
      - "Любые старания в конечном счёте приносят лишь ещё больше несчастий."
      - "И чем тратить силы впустую, лучше пройти по единственному пути до самого конца."
  - char: "unzen_s"
    side: "left"
    text:
      - "Хах..."
      - "Вот как."
      - "Взвалить всё на свои плечи и принести великую жертву — это поистине благородно."
      - "Но... кем же ты сама себя возомнила?"
      - "Отрешившейся от мирской суеты, возвысившейся надо всем, божеством, что взирает на этот мир свысока?.."
      - "Ни ты, ни я никогда не были сторонними наблюдательницами. Мы обе — лишь песчинки в этом бренном мире."
      - "И даже если в конце пути нас ждёт лишь тщетность..."
      - "...взгляни назад на пройденные шаги."
      - "Они — лучшее доказательство борьбы с предначертанной судьбой."
  - text:
      - "Она протянула руку."
  - char: "unzen_s"
    side: "left"
    text:
      - "Пойдём, вместе со мной..."
      - "Впрочем, нет. Мы ведь и так единое целое."
      - "Давай сожжём это несущее гибель миру бедствие дотла."
  - text:
      - "Её взгляд ещё никогда не был столь решительным."
      - "Две переплетающиеся стайки бабочек слились воедино, кружась и смыкаясь вокруг них."
      - "Там наконец остался лишь один-единственный силуэт."

chapter2:
  rows:
  - text:
      - "Белоснежный исполинский дракон обвил её кольцами..."
      - "...словно свисающий кокон куколки."
      - "Сквозь витки свернувшегося дракона пробились лучи ослепительного света..."

chapter3:
  rows:
  - text:
      - "Посреди ослепительно белого пространства..."
      - "В то мгновение, когда оснастка соединилась с её телом..."
      - "Бесчисленные воспоминания хлынули в сознание, а упущенные эпохи пронеслись перед глазами."
      - "Холодный металл сейчас словно обрёл собственную жизнь."
  - char: "unzen"
    side: "left"
    text:
      - "Это и есть... «оснастка»."
      - "Моё имя... Ундзэн."
  - text:
      - "Эпоха «Великого Мудреца» завершилась здесь и сейчас."
      - "Скованная воля наконец обрела былую целостность."
  - char: "unzen"
    side: "left"
    text:
      - "..."
      - "Эта сила..."
  - text:
      - "Оглядевшись вокруг, она увидела, как дракон беззвучно уплывает прочь, а перед ней стоит незнакомая гостья."

chapter4:
  rows:
  - char: "shimanto"
    side: "left"
    text:
      - "Великий Мудрец."
      - "Я Симанто. По приказу госпожи Мусаси я доставила тебе эту оснастку."
      - "До нас дошли вести, что у Великого Мудреца никогда не было собственной оснастки."
      - "После прошлой неудачи госпожа Мусаси непрестанно исследовала доверенную тобой реликвию."
      - "Ей удалось не только облегчить состояние госпожи Синано, но и воплотить эту оснастку специально для тебя, взяв за основу концепт «Ундзэн»."
      - "С этой экипировкой концепт окончательно закрепится, и тебе больше не придётся оставаться заложницей барьера."
      - "С тех самых пор, как я последовала за госпожой Нагато и госпожой Мусаси в Великое Святилище, я всё искала удобный случай, чтобы связаться с тобой."
      - "По пути я наткнулась на упавшую без чувств Овари у подножия Великого Древа, но затем обстановка резко накалилась, и мне пришлось сменить тактику."
      - "Прости, что смогла добраться до тебя так поздно."
  - char: "unzen"
    side: "right"
    text:
      - "Симанто, верно?"
      - "В одном ты ошиблась: в той прошлой битве госпожа Мусаси и остальные вовсе не потерпели поражения."
      - "Ибо..."
      - "...битва ещё не окончена."
  - char: "shimanto"
    side: "left"
    text:
      - "Всё так, Великий Мудрец."
  - char: "unzen"
    side: "right"
    text:
      - "Ты только что сказала, что всё это создано на основе «Ундзэн»."
      - "В таком случае... можешь называть меня Ундзэн."
      - "В этой решающей битве... прошу, помоги мне."
  - char: "shimanto"
    side: "left"
    text:
      - "Конечно! Приказывай!"
