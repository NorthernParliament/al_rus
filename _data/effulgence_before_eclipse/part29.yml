chapter1:
  rows:
  - text:
      - "Всполохи клинка рассекли воздух, и преграждавшее путь марево разом разлетелось в клочья."
  - char: "ibuki"
    side: "left"
    text:
      - "Ибуки явилась на подмогу."
  - char: "shimanto"
    side: "right"
    text:
      - "Ибуки?.."
  - char: "ibuki"
    side: "left"
    text:
      - "Я странствовала по свету и, следуя за этим зловещим маревом, пришла сюда, но не могла сделать больше ни шагу вперёд."
      - "Но вдруг содрогнулась земля, и над пустынной гладью моря возник остров, объятый зловещими знамениями."
      - "Увидев это, я поспешила сюда со всех ног."
      - "Лишние слова ни к чему."
      - "Госпожа Ундзэн, твои фланги мы берём на себя!"

chapter2:
  rows:
  - text:
      - "Она опустила ладонь к поясу."
      - "Бесчисленные искры света сложились в очертания клинка."
      - "Сломанный меч словно вновь вернулся в руку Ундзэн."

chapter3:
  rows:
  - text:
      - "Сияющие частицы продолжали сгущаться."
      - "Они собирались во всё новые светящиеся лезвия, точно возводя вокруг Ундзэн неприступную стену стали."
  - char: "unzen"
    side: "left"
    text:
      - "Ещё ближе."
      - "Ещё хоть немного ближе..."
  - text:
      - "Шептала она про себя, уворачиваясь от выпадов марева."
      - "Какими бы свирепыми ни были атаки врага..."
      - "...Симанто и Ибуки неотступно держались рядом по обе стороны."
      - "Блеск стали непрестанно переплетался со вспышками орудийных выстрелов."
  - char: "shimanto"
    side: "left"
    text:
      - "Госпожа Ундзэн!"
      - "Мы на пределе, долго нам не продержаться!"
  - char: "ibuki"
    side: "right"
    text:
      - "Госпожа Ундзэн!"
      - "Дальше тебе, боюсь, придётся пробиваться одной!"
  - text:
      - "Бумажный дракон уже занялся огнём, но всё ещё из последних сил прикрывал их собою."
  - char: "ibuki"
    side: "right"
    text:
      - "Клинок уже повреждён..."
  - text:
      - "Ибуки бросила взгляд на зазубрину на лезвии и без тени сомнений ринулась вперёд."
  - char: "unzen"
    side: "left"
    text:
      - "Уже близко."
      - "Уже почти..."

chapter4:
  rows:
  - char: "ibuki"
    side: "left"
    text:
      - "Великий Мудрец."
      - "На этом прощай..."
  - text:
      - "Чёрное марево поглотило Ибуки."
      - "Подле Ундзэн больше никого не осталось."

chapter5:
  rows:
  - text:
      - "Сотканное из марева чудовище с истинно божественным презрением взирало на приближающуюся снизу крошечную точку света."
      - "«Всё тщетно...»"
  - char: "unzen"
    side: "left"
    text:
      - "Эти слова я слышала уже сотни, тысячи раз."
  - text:
      - "«Всё тщетно...»"
  - char: "unzen"
    side: "left"
    text:
      - "Что значит «тщетно»?"
      - "Я видела гибель тысяч миров."
      - "В каждом повороте судьбы «я» делала один и тот же выбор."
      - "Сгинуть вместе с тобой в небытие аннигиляции — в этом ли моё предназначение?.."
      - "Ради чего... я вообще появилась на свет?"
      - "Неужели лишь ради этого?.."
  - text:
      - "«Всё тщетно...»"
  - char: "unzen"
    side: "left"
    text:
      - "В том ударе аннигиляции я попыталась отсечь все мирские чувства."
      - "Но я ошибалась!"
      - "Привязанность и щемящая тоска."
      - "Смятение и сомнения."
      - "Всё это..."
      - "...и есть доказательство моей человечности."
      - "Я..."
      - "...вовсе не божество."
      - "..."
      - "И ты тоже!"

chapter6:
  rows:
  - text:
      - "Взметнувшаяся сила клинка устремилась прямо к небесам."
      - "Подобно божественному чуду, она расколола небосвод надвое."
      - "Исполинский зверь корчился и истошно выл."
      - "Чёрное марево сгущалось в единую точку."
      - "Но, в отличие от прежнего, бушующая тьма собиралась вовсе не для новой атаки — она отчаянно пыталась сбежать."
  - char: "shimanto"
    side: "left"
    text:
      - "Госпожа Ундзэн!"
  - char: "ibuki"
    side: "right"
    text:
      - "Симанто!"
  - char: "shimanto"
    side: "left"
    text:
      - "Я цела..."
  - char: "unzen"
    side: "right"
    text:
      - "Осторожно, нельзя дать ему уйти."
  - text:
      - "Сгусток марева вырвался на свободу и пронёсся прямо над их головами."
  - char: "ibuki"
    side: "left"
    text:
      - "Плохо!..."
  - char: "unzen"
    side: "right"
    text:
      - "Уже не догнать..."
  - text:
      - "Облака рассеялись, и сквозь плотную пелену пробились лучи света."
      - "Взору наконец открылись окрестности Великого Святилища."
      - "Под защитой барьера область взрыва очертила чёткую границу."
  - char: "unzen"
    side: "right"
    text:
      - "Огонь!"

chapter7:
  rows:
  - text:
      - "Призвав оснастку, она открыла огонь вслед уходящему мареву, но ни один выстрел не достиг цели."
      - "До его окончательного побега оставались считанные доли секунды..."
  - char: "nagato"
    side: "left"
    text:
      - "Ха-а!..."
  - text:
      - "Сияющие узоры техники наглухо перекрыли ему путь к спасению."
      - "Пробуждённые письмена барьера разошлись во все стороны, точно круги по воде."
      - "Затем барьер внезапно сжался внутрь; время в зоне взрыва словно обратилось вспять, и расколотая земля вновь собралась воедино."
      - "Всё чёрное марево в этом пространстве оказалось сжато в одну точку..."
      - "...прямо в сгусток света у подножия Великого Древа."
  - char: "ibuki"
    side: "left"
    text:
      - "Госпожа Нагато!"
  - char: "nagato"
    side: "right"
    text:
      - "У... успела..."
      - "Великий Мудрец, барьер полностью восстановлен..."
  - text:
      - "Едва сорвались с губ эти слова, как Нагато без чувств рухнула на глазах у всех."
      - "Марево, которому негде было больше укрыться, вновь оказалось сковано этой силой и вмиг втянуто обратно в самый центр."
  - char: "ibuki"
    side: "left"
    text:
      - "Госпожа Нагато!"
  - text:
      - "Ибуки поспешно подхватила её."
  - char: "ibuki"
    side: "left"
    text:
      - "Кажется, она просто без сил от перенапряжения."
  - char: "shimanto"
    side: "right"
    text:
      - "Применять технику такого уровня — это же чистое безумие..."
      - "Так вот на что способна священная дева Сакуры..."
      - "М-да... мне до неё ещё расти и расти..."
  - text:
      - "Обессиленная Симанто без чувств опустилась на землю."
  - char: "unzen"
    side: "left"
    text:
      - "Сражаться плечом к плечу с вами было великой честью."
  - text:
      - "Ундзэн вонзила клинок в землю; лезвие вспыхнуло мягким светом и вскоре рассыпалось искрами, растаяв в воздухе."
  - char: "unzen"
    side: "left"
    text:
      - "Время пришло..."
  - text:
      - "Голубая бабочка опустилась на кончик пальца Ундзэн, а следом за ней — сотни, тысячи других."
      - "Они сплелись в сияющую ленту, устремляясь к точке света под Великим Древом."
      - "Издалека донеслись встревоженные крики девушек."
      - "Но там, где мгновение назад стояла Ундзэн, уже некому было ответить."
      - "Под кружащимся в небе вихрем лепестков сакуры Великое Древо тоже растаяло без следа."
      - "Опавшие лепестки слились в сияющую реку, уносясь в неведомую даль."
