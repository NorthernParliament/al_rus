chapter1:
  rows:
  - text:
      - "Стараясь не шуметь, я подошёл ближе."
  - char: "unzen???"
    side: "right"
    text:
      - "Пришлись ли тебе по вкусу угощения Сакуры, гость?"
  - char: "commander"
    side: "left"
    text:
      - "Прости, я не хотел мешать... Просто бродил без цели и набрёл на это место."
  - char: "unzen???"
    side: "right"
    text:
      - "В этом поместье тропы весьма запутаны. Ты не только преодолел барьер..."
      - "...но и прошёл сквозь все вероятности, оказавшись здесь."
      - "Должно быть, такова судьба?"
  - text:
      - "Я украдкой разглядывал стоящую передо мной девушку."
  - char: "unzen???"
    side: "right"
    text:
      - "Ты думаешь о том, такая ли я, как и остальные?"
  - char: "commander"
    side: "left"
    text:
      - "И это ты заметила..."
  - char: "unzen???"
    side: "right"
    text:
      - "Я чувствую исходящую от тебя необычную ауру."
  - char: "commander"
    side: "left"
    text:
      - "Я тоже."
  - char: "unzen???"
    side: "right"
    text:
      - "Ты тоже можешь её чувствовать?.."
  - text:
      - "На её лице промелькнуло искреннее удивление."
      - "Она обернулась, и наши взгляды встретились."
      - "Её взгляд был кротким и чистым, словно тихая гладь воды."
  - char: "commander"
    side: "left"
    text:
      - "..."
  - text:
      - "Я отвёл глаза."
      - "Не ожидал, что сдамся первым..."
  - char: "commander"
    side: "left"
    text:
      - "Кхм..."
      - "Уже так поздно, ты ждёшь здесь кого-то?"
  - text:
      - "Пытаясь скрыть неловкость, я поспешил сменить тему."
  - char: "unzen???"
    side: "right"
    text:
      - "Нет. Я просто размышляю."
  - char: "commander"
    side: "left"
    text:
      - "Тебя что-то тревожит?"
      - "Любуешься пейзажем, чтобы развеять печаль?"
  - text:
      - "Осознав, что сыпать вопросами один за другим не слишком вежливо, я осёкся."
      - "С окончанием сегодняшнего банкета визит в Сакуру подойдёт к концу."
      - "Ещё пара дней отдыха — и мне снова придётся отправляться в путь, к следующему пункту назначения."
      - "В жизни встречается бесчисленное множество случайных прохожих, и порой расставание становится прощанием навсегда."
  - char: "commander"
    side: "left"
    text:
      - "Вот бы нам встретиться снова."
  - char: "unzen???"
    side: "right"
    text:
      - "Что ты сказал?.."
  - char: "commander"
    side: "left"
    text:
      - "Было бы славно, если бы мы однажды снова где-нибудь встретились."
  - char: "unzen???"
    side: "right"
    text:
      - "Жизнь непостоянна. Порой мимолётное мгновение и есть вечность."
  - char: "commander"
    side: "left"
    text:
      - "Но всё же я встретил тебя, разве нет?"
      - "На исходе всех вероятностей я отыскал тебя."
  - text:
      - "Она отвела взгляд и больше ничего не сказала."
      - "Мы стояли, купаясь в лунном свете, и время текло неспешно."
      - "Как бы мне хотелось, чтобы оно шло ещё медленнее."
      - "Я повернулся, собираясь уйти, но она мягко перехватила мою руку."
      - "Она взглянула на меня и направила мой взор ввысь, к сияющей в ночном небе луне."
  - char: "unzen???"
    side: "right"
    text:
      - "Луна сегодня очень красива."
  - text:
      - "Её улыбка навсегда запечатлелась в моей памяти."

