chapter1:
  rows:
  - text:
      - "Отразив клинком натиск тьмы, она взмыла в воздух."
      - "Всполох холодного блеска вонзился в самую её гущу, разрывая и рассеивая тьму."
      - "Чёрное марево сгустилось, и из него медленно поднялся искажённый человеческий силуэт."
      - "То была чёрная тень, в точности повторявшая её собственный облик."
  - char: "unzen_s"
    side: "left"
    text:
      - "..."
  - text:
      - "Они одновременно сорвались вперёд; от скрежета столкнувшихся клинков брызнули снопы искр."
      - "Пригнувшись и уйдя в сторону, она убрала клинок в ножны и отступила на полшага, разрывая дистанцию."
      - "Тень же опоздала на долю секунды."
  - char: "unzen_s"
    side: "left"
    text:
      - "Рассечение!"
  - text:
      - "Клинок молниеносно покинул ножны, очертив перед ней дугу в форме полумесяца."
      - "Из рассеивающейся тени донёсся глумливый смех."
      - "«Всё тщетно...»"
      - "Марево обратилось бесчисленными человеческими фигурами, ринувшимися в атаку на неё, стоявшую в самом центре."
      - "..."
      - "Оттолкнувшись в обманном выпаде и взмыв вверх, она заставила мчащиеся тени врезаться друг в друга, породив мощнейшую взрывную волну."
      - "Мечущиеся тени накатывали одна за другой, но не могли даже коснуться её."
      - "«Всё тщетно...»"
      - "Сквозь бреши между снующими тенями она заметила вдалеке крошечный алый огонёк."
  - char: "unzen_s"
    side: "left"
    text:
      - "Нашла."
  - text:
      - "Резкое ускорение — и та особая тень выставила остриё клинка перед собой."
  - char: "unzen_s"
    side: "left"
    text:
      - "Аннигиляция..."
  - text:
      - "Она изо всех сил нанесла колющий удар прямо в эту алую точку, но неведомая мощь заблокировала движение острия."
  - char: "unzen_s"
    side: "left"
    text:
      - "Это... и есть..."
  - text:
      - "Яростное марево хлынуло из раны тени."
      - "Тень обеими руками вцепилась в лезвие, испуская жуткий рёв."
  - char: "unzen_s"
    side: "left"
    text:
      - "Мой конец..."
  - text:
      - "Из тени выросли новые руки; они намертво сдавили клинок, пытаясь вырвать его."
      - "«Нет!...»"
      - "Лезвие переломилось, и чёрная ударная волна сотрясла всё пространство."
      - "Словно кукла с оборванными нитями, она кубарем рухнула на один из парящих островков."
      - "Алый огонёк вновь заволокло маревом; оно сгустилось в исполинское чудовище, с рёвом распахнувшее свою пасть."
  - char: "unzen_s"
    side: "left"
    text:
      - "..."
