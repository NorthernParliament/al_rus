chapter1:
  rows:
  - text:
      - "Троица крепко вцепилась друг в друга, пытаясь совладать со свирепствующей бурей."
      - "Отголоски недавнего удара отбросили их к самой окраине."
      - "С трудом выровняв положение тела, они ощутили, как носки коснулись какой-то мягкой поверхности."
  - char: "natori"
    side: "left"
    text:
      - "Под ногами будто что-то есть!"
  - text:
      - "Взглянув вниз, они увидели лишь бездонный провал, мерцающий космическими туманностями."
      - "Но если приглядеться, от каждого движения стоп по нему расходилась едва заметная рябь."
      - "Они плавно опустились на поверхность этой, казалось бы, абсолютной пустоты."
  - char: "asanagi"
    side: "left"
    text:
      - "Под ногами такое странное чувство..."
  - char: "natori"
    side: "right"
    text:
      - "Будто на мягкий матрас встали."
  - char: "asanagi"
    side: "left"
    text:
      - "Того и гляди провалишься."
  - char: "hatsuzuki"
    side: "right"
    text:
      - "Давайте выстроимся в ряд и попробуем идти ходом."
      - "Понемногу ускоряемся..."
  - char: "natori"
    side: "left"
    text:
      - "И по какому принципу это вообще работает?.."
  - char: "hatsuzuki"
    side: "right"
    text:
      - "Сейчас точно не время забивать себе этим голову."
      - "Сперва нужно найти Дзуйхо, а ещё..."
  - char: "asanagi"
    side: "left"
    text:
      - "Госпожа Мусаси..."
      - "Да быть такого не может! Эта тварь не способна даже поцарапать госпожу Мусаси!"
      - "Госпожа Мусаси наверняка уже давно разрубила чудовище на куски!"
  - char: "hatsuzuki"
    side: "right"
    text:
      - "Угу..."
      - "Коммуникатор отвечает?"
      - "Попробуй связаться с кем-нибудь."
  - text:
      - "Ответом им был лишь глухой треск помех."
      - "БАБАХ!!!"
      - "Чёрное марево подступало всё ближе."
      - "У него не было постоянного облика: то оно напоминало серийные модели Сирен, то собственные тени девушек."
      - "Казалось, его очертания непрестанно менялись ежесекундно."
      - "Обнажив оружие, они встали в боевую стойку."
  - char: "hatsuzuki"
    side: "right"
    text:
      - "Теперь остаётся рассчитывать только на себя."
      - "В бой!"
