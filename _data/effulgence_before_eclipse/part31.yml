chapter1:
  rows:
  - text:
      - "Тонкий аромат чая коснулся обоняния."
      - "Ласковые солнечные лучи согревали лицо."
  - char: "unzen"
    side: "left"
    text:
      - "?.."
  - text:
      - "Сознание всё ещё путалось, а свет перед глазами казался чересчур ярким."
  - char: "ibuki_newyear"
    side: "right"
    text:
      - "Госпожа Ундзэн, ты очнулась?"
  - text:
      - "Ибуки бережно придержала Ундзэн за спину, помогая ей приподняться."
      - "Ундзэн растерянно огляделась: это была изысканно обставленная комната в традиционном стиле."
  - char: "ibuki_newyear"
    side: "right"
    text:
      - "Ты хочешь пить?"
  - text:
      - "Девушка вложила в ладони Ундзэн тёплую пиалу."
  - char: "ibuki_newyear"
    side: "right"
    text:
      - "Я Ибуки. С тех пор как тебя перенесли сюда, я неотлучно забочусь о тебе."
  - text:
      - "Воспоминания нахлынули волной."
      - "В последних отголосках памяти она обращалась в стайку бабочек и таяла без следа."
  - char: "ibuki_newyear"
    side: "right"
    text:
      - "Какое счастье, госпожа Ундзэн."
  - text:
      - "Девушка сжала её руку, и тепло чужих пальцев подтверждало:"
      - "всё вокруг — не сон."
  - char: "unzen"
    side: "left"
    text:
      - "Кстати, а Ватацуми..."
  - text:
      - "Ибуки поднялась и распахнула окно."
      - "Звонкое щебетание птиц и свежий аромат в тот же миг наполнили комнату."

chapter2:
  rows:
  - text:
      - "За окном открывался знакомый пейзаж Великого Святилища."
      - "Посреди озера, окружённого кристаллами цвета цветущей сакуры, под красным зонтом безмолвно стояла одинокая фигура."
  - char: "ibuki_newyear"
    side: "right"
    text:
      - "Ах да..."
      - "С тех пор как в самом сердце озера нашли тебя, там неожиданно начали прорастать свежие ветви Великого Древа."
      - "Госпожа Амаги наведывается туда каждый день."
  - char: "unzen"
    side: "left"
    text:
      - "Но разве тело Амаги уже не..."
  - char: "ibuki_newyear"
    side: "right"
    text:
      - "Об этом лучше спросить у самой госпожи Амаги, когда увидишься с ней лично."
      - "К тому же твои силы только начали восстанавливаться, нельзя пренебрегать осторожностью."
      - "Если хочешь немного размяться, мне приготовить для тебя одежду для прогулки?"
  - char: "unzen"
    side: "left"
    text:
      - "Да, пожалуйста. Проводи меня, я хочу осмотреться."
  - char: "ibuki_newyear"
    side: "right"
    text:
      - "Без проблем, госпожа Ундзэн."
