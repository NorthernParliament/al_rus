chapter1:
  rows:
  - text:
      - "Визит Всемирной военно-морской академии продолжался полным ходом."
      - "Странствия по свету и посещение разных стран ради знакомства с их обычаями и нравами действительно стали редким и ценным опытом."
      - "Как будущий командир на полях грядущих сражений, я всё отчётливее ощущал, сколь долгий и тернистый путь предстоит пройти."
      - "Я перелистнул лежавшее передо мной расписание поездки."
      - "От бесконечных пометок и плотного графика голова шла кругом."
      - "Поспешно захлопнув брошюру, я потёр переносицу."
      - "До следующего пункта программы ещё оставалось немного времени."
      - "Стоит воспользоваться этой передышкой и перевести дух."
      - "Все эти дни под присмотром сопровождающего из Сакуры я осматривал разнообразные столичные достопримечательности и исторические памятники."
      - "Эта часть визита была весьма приятной."
      - "Ровно до тех пор, пока не началась череда бесконечных и утомительных заседаний..."
      - "Мне же как главному докладчику приходилось всё время сохранять предельную сосредоточенность."
      - "И я не успел оглянуться, как большая часть времени на отдых уже пролетела."
      - "Оправив одежду, я толкнул дверь и направился туда, где должен был состояться вечерний банкет."
