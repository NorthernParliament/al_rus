chapter1:
  rows:
  - text:
      - "Небо потемнело в одно мгновение, и густые тучи вмиг заволокли всё Великое Святилище."
  - char: "hatsuzuki"
    side: "left"
    text:
      - "Великое Древо, оно!..."
  - text:
      - "Прежде чем девушки успели опомниться, Мусаси уже заслонила их собой."
  - char: "musashi"
    side: "right"
    text:
      - "Пурпурная молния, грянь..."
  - text:
      - "В небесах громыхнул гром, и рядом с Мусаси ударила молния."
      - "Вслед за ослепительной вспышкой исполинская оснастка Мусаси развернулась в защитную стойку, укрыв всех надёжным щитом."
  - char: "hatsuzuki"
    side: "left"
    text:
      - "Нехорошо! Госпожа Мусаси, госпожа Нагато всё ещё на аванпосту!"
  - char: "musashi"
    side: "right"
    text:
      - "Не беспокойся о госпоже Нагато, у неё есть способ справиться."
      - "Первостепенная задача — восстановить барьер."
      - "Нельзя допустить, чтобы Тень Коррозии вырвалась за пределы Великого Святилища!"
  - char: "hatsuzuki"
    side: "left"
    text:
      - "«Тень Коррозии»?.."
  - text:
      - "Чёрное цунами надвигалось издалека."
      - "Гигантские волны из чёрного марева застилали небо и солнце; перед лицом такой угрозы любые попытки уклониться теряли всякий смысл."
  - char: "musashi"
    side: "right"
    text:
      - "Что бы ни случилось, не отходите от меня далеко, помните..."
  - char: "hatsuzuki"
    side: "left"
    text:
      - "Госпожа Мусаси!"
  - text:
      - "Чёрный исполинский дракон вынырнул из гигантской волны."
      - "На скорости, способной разорвать всё сущее, он распахнул пасть и проглотил Мусаси."
      - "Мощная ударная волна отбросила девушек назад, и в тот же миг неведомая сила словно потянула их куда-то в сторону."
  - char: "hatsuzuki"
    side: "left"
    text:
      - "Всем сгруппироваться!"
  - char: "asanagi"
    side: "right"
    text:
      - "Ч-что происходит, нас куда-то затягивает?!"
  - char: "hatsuzuki"
    side: "left"
    text:
      - "Хватайтесь за меня, не разделяйтесь!"
  - text:
      - "Они отчаянно пытались удержаться в воздухе, но всё было тщетно."
  - char: "zuihou"
    side: "left"
    text:
      - "Н-не получается!"
  - char: "hatsuzuki"
    side: "right"
    text:
      - "Дзуйхо!"
  - text:
      - "Бушующий поток отбросил Дзуйхо в сторону, и она скрылась из виду."
  - char: "asanagi"
    side: "left"
    text:
      - "Ч-что же нам делать?!"
  - char: "hatsuzuki"
    side: "right"
    text:
      - "Главное — больше не разделяться!"
  - text:
      - "Хацудзуки ухватила Натори за воротник, а другой рукой изо всех сил вцепилась в лодыжку Асанаги."
      - "Напрягая все мышцы, она подтянула обеих к себе."
  - char: "hatsuzuki"
    side: "right"
    text:
      - "Держитесь крепче!"
  - char: "natori"
    side: "left"
    text:
      - "А? Да!"
  - text:
      - "Но уже в следующую секунду неведомая жуткая сила швырнула их прямиком в самое сердце Великого Святилища."
  - char: "zuihou"
    side: "left"
    text:
      - "..."
  - char: "asanagi"
    side: "right"
    text:
      - "......"
  - char: "hatsuzuki"
    side: "left"
    text:
      - "Великое Древо... окончательно засохло..."
