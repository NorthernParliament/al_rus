chapter1:
  rows:
  - text:
      - "У подножия Великого Древа гладь озера была неподвижной, словно зеркало."
      - "Великий Мудрец Империи Сакуры приложила руку к стволу Великого Древа и ощутила, как тёплая волна медленно растекается по всему её телу."
      - "Стоило коснуться священного древа, как то же тепло передалось ладоням."
      - "Но вскоре его оборвал внезапный укол острой боли."
      - "Обе девушки разом отдёрнули руки, и остаточная боль рассеялась, словно пена в мимолётном сне."
  - char: "musashi"
    side: "left"
    text:
      - "Великий Мудрец, то чувство только что..."
  - char: "unzen_s"
    side: "right"
    text:
      - "Когда-то..."
      - "Когда-то люди стали свидетелями падения сияющей звезды."
      - "И когда звезда пала, из тени явилась тьма, заставив моря и земли проливать полные страха и тревоги слёзы."
      - "Павшая звезда опечалилась слезам бренного мира и сожгла себя, обрекая тьму на вечное изгнание..."
  - char: "nagato"
    side: "left"
    text:
      - "......"
  - char: "musashi"
    side: "right"
    text:
      - "Великий Мудрец, это ведь предание из «Хроник Ватацуми»?"
      - "«Хроникам Ватацуми» уже сотни лет..."
      - "И то, что ты внезапно вспомнила о них... Не связано ли это со странным ощущением, возникшим от прикосновения к Великому Древу?"
  - char: "unzen_s"
    side: "left"
    text:
      - "Госпожа Мусаси."
      - "Ты когда-то спросила меня, почему я обратилась именно к вам двоим."
      - "Падение звезды было лишь предзнаменованием."
      - "Срок изгнания подошёл к концу, и древняя тень уже точит свои клыки."
      - "Внутри Великого Древа та угасшая звезда безмолвно защищала Империю Сакуры сотни лет."
      - "Чтобы сдерживать это небывалое бедствие, Великое Древо отдало почти все свои силы."
      - "Клетка обветшала, и бедствие вот-вот нагрянет вновь — точно так же, как сотни лет назад."
  - char: "musashi"
    side: "right"
    text:
      - "Но, Великий Мудрец, что же на самом деле представляет собой это бедствие?"
      - "Хватит ли у нынешней Империи Сакуры сил, чтобы изгнать его снова?"
  - char: "nagato"
    side: "left"
    text:
      - "Сейчас, когда великая битва с Сиренами только завершилась, у Сакуры, пусть и есть воля сражаться, боюсь, сил не хватит..."
      - "К тому же... будь это бедствие тем, что можно сокрушить орудийными залпами, Великий Мудрец наверняка давно разрешила бы кризис без чьей-либо помощи."
  - char: "unzen_s"
    side: "right"
    text:
      - "Всё именно так."
      - "Я призвала вас обеих лишь с одной целью."
      - "Раз и навсегда положить конец этому губительному бедствию, предав его вечному небытию."
  - char: "nagato"
    side: "left"
    text:
      - "Небытию..."
      - "Но если так, что же станет с тобой, Великий Мудрец?.."
  - text:
      - "Вместо ответа она лишь слегка улыбнулась и тихо запела, а по небу разлилось мягкое сияние цвета лепестков сакуры."
      - "Световые нити прорастали из этого сияния, сплетаясь в сложную мерцающую завесу."
      - "Это был барьер — настолько огромный, что укрывал собой всю гладь озера."
      - "Когда начертание барьера завершилось, сияние полностью слилось с ним."
  - char: "unzen_s"
    side: "left"
    text:
      - "Похоже, госпожа Нагато уже заметила, чем так необычен этот барьер."
  - char: "nagato"
    side: "right"
    text:
      - "Об искусстве столь могущественных барьеров мне доводилось читать в книгах, но тогда я не постигла их сути."
      - "И лишь теперь, увидев, как Великий Мудрец возводит его воочию, я ощутила всю сложность этой техники, ускользающую даже от моего понимания..."
  - char: "unzen_s"
    side: "left"
    text:
      - "И всё же почти наверняка, мы умрём в процессе этого дела. Вы обе хорошо всё взвесили?"
  - char: "musashi"
    side: "right"
    text:
      - "Великий Мудрец, мы приняли это решение ещё до того, как отправились в путь к Святилищу."
  - text:
      - "Окутанный искрами молний, в руке Мусаси возник меч."
      - "Крепко сжав ножны, она замерла в ожидании."
  - char: "unzen_s"
    side: "left"
    text:
      - "...Что ж, тем лучше."
      - "Госпожа Нагато, направляющий барьер готов. Бедствие может разорвать свои оковы в любую секунду."
      - "Тогда ядро Великого Древа обнажится."
      - "Ядро — исток всех моих сил, и окутывающее его силовое поле не позволит никому просто так приблизиться."
      - "Но от собственной тени ему не укрыться..."
  - char: "musashi"
    side: "right"
    text:
      - "Ты хочешь сказать, что с того самого мига, как ядро обнажится, бедствие начнёт поражать его?"
  - char: "unzen_s"
    side: "left"
    text:
      - "Да, госпожа Мусаси."
      - "А для тебя, госпожа Нагато, титул «Божественного Дитя» послужит ключом: ты способна войти в глубокий резонанс с Ватацуми."
      - "Это позволит тебе преодолеть силовое поле и напрямую принять благословение Ватацуми."
      - "Никто другой на такое не способен."
      - "Иными словами, ты временно обретёшь всю силу Ватацуми... пусть сейчас она и почти иссякла."
      - "Приняв благословение Ватацуми, ты сможешь передать силу защиты госпоже Мусаси."
      - "Безопасность ядра теперь полностью в твоих руках, госпожа Нагато."
      - "Госпожа Мусаси, пока я не достигну эпицентра бедствия, прошу: защити госпожу Нагато любой ценой."
      - "Когда я и бедствие обратимся в небытие, если всё пройдёт благополучно, барьер развеется сам собой."
      - "К тому моменту энергия Ватацуми окончательно истощится, но даже если от него останется лишь пустая оболочка..."
      - "...её всё равно хватит, чтобы изменить будущее Империи Сакуры."
      - "Прошу вас, продолжайте вместо меня оберегать Сакуру... оберегать этот мир."
      - "Ах да..."
      - "Я чуть не забыла о данном тебе обещании."
  - text:
      - "Она достала из рукава небольшую шкатулку и бережно вложила её в ладонь Мусаси."
  - char: "unzen_s"
    side: "left"
    text:
      - "Способ исцелить первооснову — внутри."
  - text:
      - "Лица Нагато и Мусаси помрачнели от нахлынувшей тяжести."
      - "Тысячи невысказанных слов растворились в их безмолвном взгляде друг на друга."
