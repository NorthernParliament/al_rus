chapter1:
  rows:
  - text:
      - "Весь мир кружился перед глазами, Мусаси окончательно потеряла ориентиры во тьме."
  - char: "musashi"
    side: "left"
    text:
      - "..."
  - text:
      - "Пока рядом с ней не вспыхнул знакомый свет, и во тьме не пролегла трещина."
      - "Из сияния к ней протянулась рука."
  - char: "musashi"
    side: "left"
    text:
      - "Госпожа Нагато?.."

chapter2:
  rows:
  - char: "nagato"
    side: "left"
    text:
      - "Я опоздала."
      - "Можешь определить, где остальные?"
  - char: "musashi"
    side: "right"
    text:
      - "Определить не удаётся, но если Великий Мудрец всё ещё здесь..."
      - "...то есть лишь одно место, куда они могли отправиться."
  - char: "nagato"
    side: "left"
    text:
      - "Великое Древо..."
  - char: "musashi"
    side: "right"
    text:
      - "Я пойду туда, найду их и попытаюсь отыскать следы Великого Мудреца."
  - char: "nagato"
    side: "left"
    text:
      - "Ритуал вот-вот начнётся, я не могу отлучиться."
      - "Заботу о них... я вверяю тебе."
      - "Возьми этот талисман."
      - "Как только найдёшь их, сожги его. Ощутив отклик, я активирую ритуал."
      - "Чтобы окончательно преградить Тени Коррозии путь наружу, остаётся лишь прибегнуть к Технике Мудреца."
      - "Но даже мне не под силу поддерживать столь сложную технику долго."
      - "Поэтому момент должен быть выверен идеально."
  - char: "musashi"
    side: "right"
    text:
      - "Госпожа Нагато, что ты имеешь в виду?"
  - char: "nagato"
    side: "left"
    text:
      - "С помощью Техники Мудреца я смогу перенести вас за пределы этой зоны."
      - "Как только перемещение завершится, я вновь наложу барьер."
      - "Вот только... прошу, обязательно отыщи Великого Мудреца прежде, чем у меня иссякнут силы."
      - "Ибо, боюсь, её сил тоже почти не осталось."
