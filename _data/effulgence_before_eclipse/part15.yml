chapter1:
  rows:
  - char: "hatsuzuki"
    side: "left"
    text:
      - "Рассечение!.."
  - text:
      - "Всполох клинка рассёк бесформенное марево, заставив его ненадолго отступить."
      - "Но вскоре жуткие твари ринулись в новую атаку."
  - char: "asanagi"
    side: "left"
    text:
      - "Да что это вообще за дрянь такая?!"
  - text:
      - "Орудия открыли огонь во все стороны, заволакивая всё пороховым дымом."
  - char: "hatsuzuki"
    side: "left"
    text:
      - "Руби!..."
  - text:
      - "Она вновь обрушила клинок, но этот удар внезапно встретил преграду."
  - char: "hatsuzuki"
    side: "left"
    text:
      - "Что?!"
  - text:
      - "В точке соприкосновения марево словно в мгновение ока изменило свои свойства."
      - "*Дзынь!*"
      - "Будто рубанув по гладкой и сверхпрочной поверхности, лезвие со звоном отскочило назад."
  - char: "hatsuzuki"
    side: "left"
    text:
      - "Как же так!..."
  - char: "natori"
    side: "right"
    text:
      - "Хацудзуки, мы окружены!"
  - char: "asanagi"
    side: "left"
    text:
      - "Ах вы, паразиты!"
      - "Торпеды! Главный калибр! Залпом по ним!"
  - char: "hatsuzuki"
    side: "right"
    text:
      - "Асанаги, успокойся..."
      - "Боезапас почти на исходе. Раз здесь не пробиться, нужно искать другую брешь для прорыва."
  - char: "asanagi"
    side: "left"
    text:
      - "Да где тут ещё брешь найдёшь?!"
      - "Сигнальные ракеты! Скорее выпускай сигнальную ракету!"
      - "Если остальные заметят её, быть может, сумеют пробиться к нам!"
  - char: "natori"
    side: "right"
    text:
      - "Я сделаю!"
  - text:
      - "Задрав орудийные стволы вертикально вверх, она выстрелила, и снаряд разорвался прямо над головами девушек."
      - "Мерцающая вспышка стала единственной звездой среди этой беспросветной пустоты."
  - char: "asanagi"
    side: "left"
    text:
      - "Боекомплект пуст..."
  - char: "hatsuzuki"
    side: "right"
    text:
      - "Да защитят нас боги."
      - "Будем драться до конца!"
