chapter1:
  rows:
  - text:
      - "Из-за тонкого полупрозрачного полога доносилось тихое, мерное дыхание."
      - "Бумажная дверь слегка приоткрылась на узкую щёлку, но вскоре её так же тихо притворили."
  - char: "unzen_s"
    side: "left"
    text:
      - "..."
  - char: "musashi"
    side: "right"
    text:
      - "Великий Мудрец, ты пришла сюда лично... Неужели Синано тоже как-то связана с этими событиями?"
  - char: "unzen_s"
    side: "left"
    text:
      - "Это связано с «первоосновой», из которой мы сотканы."
      - "Случай Синано вряд ли единичен: повреждения первоосновы почти невозможно исцелить обычными средствами."
  - char: "musashi"
    side: "right"
    text:
      - "Если исходить из твоих слов, то и госпожа Амаги тоже?.."
  - char: "unzen_s"
    side: "left"
    text:
      - "Однако..."
      - "Даже для таких повреждений выход всё же может найтись."
  - text:
      - "Она подошла к перилам и на мгновение замерла."
  - char: "unzen_s"
    side: "left"
    text:
      - "...Приходи в Великое Святилище."
      - "Приходи вместе с госпожой Нагато в Великое Святилище."
      - "Моё истинное тело не может покинуть пределы барьера."
      - "Именно поэтому о многом здесь говорить не стоит."
      - "Под сенью Великого Древа я открою вам обеим истину."
  - char: "musashi"
    side: "right"
    text:
      - "Великий Мудрец, прости за прямоту..."
      - "Но почему ты выбрала именно нас двоих?"
  - char: "unzen_s"
    side: "left"
    text:
      - "Госпожа Нагато унаследовала титул «Божественного Дитя» и обладает уникальным даром."
      - "Ты же — наша сильнейшая воительница; находясь рядом, ты сможешь сберечь её от любой беды."
      - "Божественное Дитя защитит Сакуру, а ты..."
      - "(Если однажды настанет день, когда мне суждено будет уйти... сможете ли вы вместо меня оберегать эту чистую обитель?)"
