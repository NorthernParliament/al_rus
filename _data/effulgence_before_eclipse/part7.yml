chapter1:
  rows:
  - char: "zuihou"
    side: "left"
    text:
      - "Куда же запропастилась Хацудзуки?.."
  - text:
      - "Девушка со скучающим видом подметала дворик, то и дело поглядывая в сторону Великого Древа."
  - char: "asanagi"
    side: "right"
    text:
      - "Сказала, что пошла искать Овари, но на самом деле ей просто было скучно и захотелось прогуляться."
  - char: "zuihou"
    side: "left"
    text:
      - "Но... когда Овари уходила, на ней лица не было."
  - char: "asanagi"
    side: "right"
    text:
      - "Лица не было, ха-ха!"
      - "Когда просыпаешься посреди ночи в холодном поту от кошмара, кто угодно будет сам не свой!"
  - char: "zuihou"
    side: "left"
    text:
      - "И всё равно могла бы хоть словом с нами обмолвиться."
      - "Она ведь впервые вот так внезапно исчезает..."
  - char: "asanagi"
    side: "right"
    text:
      - "Дзуйхо, ты слишком много переживаешь."
      - "На таком крошечном аванпосту, как наш, просто не может произойти ничего серьёзного."
      - "Ты только подумай, где мы находимся — в Великом Святилище Сакуры!"
      - "Под защитой барьера, возведённого самой госпожой Нагато."
      - "Разве тут может грозить хоть какая-то опасность?!"
      - "Когда ничего не происходит — это лучший расклад."
  - char: "zuihou"
    side: "left"
    text:
      - "Тс-с!..."
      - "Асанаги! Нельзя, чтобы Овари такое услышала!"
      - "Хоть она и не говорит об этом вслух, но очень дорожит службой по охране Великого Святилища."
      - "«Ты погляди: кругом одна природа, на мили вокруг ни души, только зверушки, цветы да деревья»."
      - "«Прямо как в деревне»."
      - "«Так что здесь чувствуешь себя совсем как дома!»"
      - "...Она ведь именно так и говорила."
  - char: "asanagi"
    side: "right"
    text:
      - "Хм, вот оно что."
      - "Хотя... это вовсе не значит, что она дорожит службой — ей просто по душе здешние места!"
  - char: "zuihou"
    side: "left"
    text:
      - "В-в общем!"
      - "Раз уж мы стражи аванпоста Святилища, то обязаны исполнять свой долг добросовестно!"
      - "Если тебе так нечем заняться, лучше подумай, куда подевались Овари и ушедшая за ней Хацудзуки."
      - "А вдруг что-то случилось..."
  - text:
      - "Протяжный крик прервал их разговор."
      - "Из-за поворота вдалеке выскочила девушка и на предельной скорости понеслась прямо к аванпосту."
  - char: "zuihou"
    side: "left"
    text:
      - "Что за крик?"
  - char: "asanagi"
    side: "right"
    text:
      - "Смотри! Это же Хацудзуки."
  - char: "zuihou"
    side: "left"
    text:
      - "За ней кто-то гонится?.. Чего она так несётся..."
  - text:
      - "*Бип**Бип**Бип*"
  - char: "zuihou"
    side: "left"
    text:
      - "Коммуникатор пищит?"
  - text:
      - "Дзуйхо нажала кнопку приёма, и Асанаги тоже подошла послушать."
      - "После нескольких секунд треска и помех..."
  - char: "hatsuzuki_rad"
    side: "right"
    text:
      - "...Бы... быстрее приготовьтесь!..."
  - text:
      - "Свист встречного ветра мешал разобрать слова, а сбивчивое дыхание делало связь ещё хуже."
  - char: "zuihou"
    side: "left"
    text:
      - "Хацудзуки, ты только не торопись, отдышись и скажи толком, что стряслось."
  - char: "hatsuzuki_rad"
    side: "right"
    text:
      - "Не... некогда уже..."
      - "Эй! Вы меня вообще слушаете?!"
  - text:
      - "Но внимание обеих уже целиком поглотило открывшееся перед ними зрелище, и они совсем перестали обращать внимание на крики из коммуникатора."
      - "Вздымаемые стремительным бегом буруны взлетали в человеческий рост, напоминая грандиозное открытие какого-то сценического представления."
  - char: "zuihou"
    side: "left"
    text:
      - "Хацудзуки... оказывается, способна так быстро мчаться..."
  - char: "asanagi"
    side: "right"
    text:
      - "Т-тут все узлов тридцать пять, не меньше!"
  - char: "zuihou"
    side: "left"
    text:
      - "Может, даже больше... Не-не-не! Сейчас не до этого!"
      - "Хацудзуки, да что произошло-то?! К чему мы не успеваем?!"
  - text:
      - "Водяной шлейф наконец осел. Хацудзуки резко затормозила, но по инерции проскользила по морской глади ещё несколько метров вперёд."
  - char: "hatsuzuki"
    side: "right"
    text:
      - "Фу-ух... фу-ух... фу-ух..."
  - text:
      - "Дзуйхо отложила метлу и поспешила к небольшому пирсу навстречу подруге."
      - "Тяжело дыша, Хацудзуки выставила вперёд ладонь в жесте «погоди»."
  - char: "hatsuzuki"
    side: "right"
    text:
      - "Не успеем..."
  - text:
      - "Она подняла голову — взгляд её был совершенно потерянным."
  - char: "hatsuzuki"
    side: "right"
    text:
      - "Мы ничего не успеваем!"
      - "Госпожа Нагато, госпожа Мусаси и ещё одна незнакомая госпожа... прямо сейчас, прямо сейчас..."
      - "...они уже вошли в Святилище!"
  - char: "asanagi"
    side: "left"
    text:
      - "Госпожа Нагато, госпожа Мусаси?.. Ха-ха-ха-ха!"
      - "Да быть такого не может!"
  - char: "zuihou"
    side: "right"
    text:
      - "Обе госпожи прибыли одновременно?! Ч-что вообще происходит?!"
  - char: "hatsuzuki"
    side: "left"
    text:
      - "Я... я не шучу, я видела всё собственными глазами!"
      - "Я как раз шла искать Овари и случайно заметила идущую по морю эскадру."
      - "Госпожу Нагато и госпожу Мусаси я бы ни за что не спутала!"
  - char: "asanagi"
    side: "right"
    text:
      - "...Хацудзуки, ты ведь не шутишь?.."
  - char: "hatsuzuki"
    side: "left"
    text:
      - "Я бы и сама хотела, чтобы мне это просто померещилось..."
  - char: "zuihou"
    side: "right"
    text:
      - "Ч-что же теперь делать?!"
      - "Так, для начала надо поднять самолёты и разведать, куда они направляются!"
      - "Хацудзуки, ты присядь и переведи дух. Асанаги, будь добра, разбуди Натори и приберись в комнатах!"
      - "А ещё, ещё надо заварить чай..."
      - "Пока они не добрались сюда, мы должны успеть!"
      - "Чего застыли, мы же ничего не успеем!"
  - char: "asanagi"
    side: "left"
    text:
      - "А?! Да, уже бегу!"
  - text:
      - "Обычно тихий и умиротворённый аванпост вмиг наполнился суматохой."
  - char: "zuihou"
    side: "left"
    text:
      - "(Обе госпожи прибыли вместе... Неужели это как-то связано с Овари?.. Что же тут вообще стряслось...)"
