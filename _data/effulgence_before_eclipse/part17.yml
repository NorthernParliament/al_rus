chapter1:
  rows:
  - text:
      - "Посреди сада в традиционном стиле Сакуры троица несколько неловко переглядывалась."
  - char: "hatsuzuki"
    side: "left"
    text:
      - "..."
  - char: "asanagi"
    side: "right"
    text:
      - "..."
  - char: "natori"
    side: "left"
    text:
      - "..."
      - "Мы ещё живы?.."
  - text:
      - "Хацудзуки от души ущипнула Асанаги за руку."
  - char: "asanagi"
    side: "left"
    text:
      - "Ты чего творишь?!"
  - char: "hatsuzuki"
    side: "right"
    text:
      - "Значит, не сон!"
  - char: "asanagi"
    side: "left"
    text:
      - "В следующий раз щипай себя!"
  - char: "hatsuzuki"
    side: "right"
    text:
      - "Ха-ха... просто под руку подвернулась."
  - char: "asanagi"
    side: "left"
    text:
      - "Это ещё что за отмазка?!"
  - char: "natori"
    side: "right"
    text:
      - "Да хватит вам спорить."
  - text:
      - "Натори вытянула шею, оглядываясь по сторонам."
  - char: "natori"
    side: "right"
    text:
      - "Где мы вообще оказались?"
      - "Не могли же нас и правда перенести прямо на главный остров Сакуры?"
  - char: "hatsuzuki"
    side: "left"
    text:
      - "Сад и впрямь оформлен в нашем стиле, но мне он кажется смутно знакомым."
      - "Такое чувство... будто это сад госпожи Нагато?"
  - char: "natori"
    side: "right"
    text:
      - "Значит, нас действительно спасла госпожа Нагато..."
  - char: "asanagi"
    side: "left"
    text:
      - "Давайте лучше осмотримся, стоя на месте мы ничего не выясним."
  - text:
      - "Потирая ушибленную руку, Асанаги размашистым шагом отправилась осматривать окрестности."
  - char: "nop"
    side: "right"
    text:
      - "Стойте..."
  - text:
      - "Откуда-то из глубины сада раздался голос."
      - "Все обернулись."
      - "В спокойной глади озера отражался прекрасный силуэт: на ней были белоснежные одежды, а из-под широких рукавов виднелась бледно-сиреневая подкладка."
  - char: "unzen_s"
    side: "right"
    text:
      - "Сделай ты ещё полшага вперёд — и сорвёшься в бездну."
  - text:
      - "Асанаги опустила взгляд и увидела, что прямо перед носками её обуви очертания земли размываются."
      - "И хотя она ещё не переступила границу сада, из-за незримой черты уже повеяло леденящим ознобом."
      - "Она торопливо отдёрнула ногу и замахала руками, пытаясь удержать равновесие."
  - char: "asanagi"
    side: "left"
    text:
      - "?.."
  - char: "natori"
    side: "right"
    text:
      - "Какая же она красивая..."
      - "Неужели богиня?.."
  - text:
      - "Девушка подошла ближе под их любопытными взглядами."
  - char: "unzen_s"
    side: "left"
    text:
      - "Раз, два, три... Вот как. Похоже, остальные ваши спутницы остались в ловушке."
  - text:
      - "Она подвела девушек к берегу, и спокойная гладь озера вдруг превратилась в то самое пространство, где бушевало чёрное марево."
      - "Казалось, будто они стоят на краю высокого утёса и смотрят вниз."
      - "Она указала на бездну под их ногами."
  - char: "unzen_s"
    side: "left"
    text:
      - "Ваши подруги нашлись. Не тревожьтесь, с ними всё в порядке."
  - text:
      - "Словно в ответ на её слова, где-то вдалеке посреди бездны мелькнул мерцающий огонёк."
      - "Но этот свет быстро угас."
