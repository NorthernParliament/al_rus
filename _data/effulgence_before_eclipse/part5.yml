chapter1:
  rows:
  - text:
      - "Белоснежные пиалы наполнились прозрачным чаем."
      - "Кавакадзэ осторожно придвинула пиалы гостям."
      - "Она вышла из комнаты и тихо притворила за собой дверь."
  - char: "musashi"
    side: "left"
    text:
      - "Великий Мудрец, ты только что сказала, что Великое Древо начало увядать."
      - "Но мы получили донесение лишь об одном священном древе, начавшем сохнуть."
      - "Неужели это действительно связано с Великим Древом?.."
  - char: "unzen_s"
    side: "right"
    text:
      - "Вы обе кое-чего не знаете."
      - "Священные древа во всех уголках Сакуры неразрывно связаны с Великим Древом."
      - "Когда корни обрываются, поражённые коррозией..."
      - "...связанные с ними священные древа лишаются питания и вскоре погибают."
      - "Вот в чём истинная причина их увядания."
  - text:
      - "Подул лёгкий ветерок, поднимая в воздух цветочные лепестки."
      - "Один из них плавно опустился прямо в её чашу с чаем."
  - char: "unzen_s"
    side: "right"
    text:
      - "Опадающие цветы приносят вести."
      - "Хм... Увядание священных древ уже охватило всю Империю Сакуры."
      - "И в конце концов... Великое Древо постигнет та же участь."
  - char: "nagato"
    side: "left"
    text:
      - "Неужели всё это нельзя предотвратить?.. Нет..."
      - "Великий Мудрец. Если мы найдём источник коррозии, разве нельзя будет..."
  - char: "unzen_s"
    side: "right"
    text:
      - "Госпожа Нагато, ты полагаешь, что источник сокрыт в том увядшем древе?"
  - text:
      - "Встретившись взглядом с Великим Мудрецом, Мусаси прочла отрицательный ответ в её глазах."
  - char: "unzen_s"
    side: "right"
    text:
      - "Источник коррозии — само Великое Древо."
  - char: "nagato"
    side: "left"
    text:
      - "Как такое возможно..."
  - text:
      - "Она смотрела на плавающий в чаше лепесток, ничего не отвечая."
      - "Кавакадзэ, ожидавшая за дверью, тихо постучала."
  - char: "nagato"
    side: "left"
    text:
      - "Что случилось?"
  - char: "kawakaze"
    side: "right"
    text:
      - "Докладываю, госпожа Нагато: банкет уже накрыт, все ждут тебя."
  - char: "nagato"
    side: "left"
    text:
      - "Великий Мудрец, в это же время как раз проходит визит представителей Всемирной военно-морской академии, и я буквально разрываюсь на части."
      - "Прошу тебя, задержись у нас на несколько дней. Когда визит завершится, мы сможем всё обстоятельно обсудить."
  - text:
      - "Положив руки на колени, Великий Мудрец слегка склонила голову и прикрыла глаза в раздумьях."
      - "Повеял ветерок, тихо зазвенели колокольчики на ветру."
  - char: "unzen_s"
    side: "right"
    text:
      - "Госпожа Нагато, тогда побеспокою тебя своим присутствием в эти дни."
  - text:
      - "Напряжённая атмосфера немного разрядилась."
      - "Нагато попрощалась с обеими, в её жестах сквозила лёгкая спешка."
      - "Когда шаги стихли вдали..."
  - char: "unzen_s"
    side: "right"
    text:
      - "Госпожа Мусаси."
      - "Как поживает твоя младшая сестра?"
  - char: "musashi"
    side: "left"
    text:
      - "Великий Мудрец, Синано..."
  - char: "unzen_s"
    side: "right"
    text:
      - "Я знаю, но... могу ли я увидеться с ней?"
  - char: "musashi"
    side: "left"
    text:
      - "Раз такова твоя просьба, мне нечего возразить."
      - "Только сегодня уже стемнело. Ты не будешь против, если мы навестим её завтра?"
  - char: "unzen_s"
    side: "right"
    text:
      - "Поступай так, как сочтёшь нужным."
  - char: "musashi"
    side: "left"
    text:
      - "В таком случае я откланяюсь и пойду займусь приготовлениями."
  - text:
      - "Мусаси покинула комнату, оставив Великого Мудреца в одиночестве."
      - "Она взглянула в сад, любуясь его красотой; неподалёку гладь озера мерцала бликами."
      - "Наступала ночь."
      - "Она поднялась и подошла к воде, но мысли её уже витали далеко отсюда."
