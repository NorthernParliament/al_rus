chapter1:
  rows:
  - text:
      - "Светящиеся руны сдерживали натиск чёрного марева."
  - char: "nagato"
    side: "left"
    text:
      - "Мы ещё продержимся..."
      - "Пока Великий Мудрец не завершит свою миссию, мы обязаны стоять до конца."
      - "Нужно во что бы то ни стало защитить Ватацуми, иначе все усилия пойдут прахом."
  - char: "musashi"
    side: "right"
    text:
      - "Сказать проще, чем сделать..."
  - text:
      - "Прямо над ними..."
      - "В кроне уже увядшего Великого Древа исполинское око, сотканное из чёрного марева, с неистовой яростью взирало на происходящее."
      - "Там и находилось ядро бедствия."
      - "А ещё выше мерцал слабый звёздный свет, стремительно ускоряя своё падение..."
  - char: "musashi"
    side: "right"
    text:
      - "Падающая звезда!..."
      - "Точь-в-точь как описано в легенде!..."
      - "Великий Мудрец направляется к ядру бедствия!"
  - char: "nagato"
    side: "left"
    text:
      - "Та падающая звезда... неужели это сама Великий Мудрец?.."
  - char: "musashi"
    side: "right"
    text:
      - "Внимание на Ватацуми!..."
  - text:
      - "Яркая вспышка, вырвавшаяся из самого центра Ватацуми, застилала взор."
      - "Словно взмывший ввысь фейерверк, озаривший всё ослепительным сиянием в миг взрыва."

chapter2:
  rows:
  - char: "nagato"
    side: "left"
    text:
      - "...?!"
  - text:
      - "Чёрную морскую гладь затянули грозовые тучи."
      - "Скрывавшиеся в облаках твари с глухим рыком пожирали всё на своём пути."

chapter3:
  rows:
  - text:
      - "Священное древо было объято пламенем."
      - "Чёрный исполинский дракон терзал его ствол."

chapter4:
  rows:
  - char: "distories_noise"
    side: "left"
    text:
      - "Спасайтесь, бегите!..."
  - char: "musashi"
    side: "right"
    text:
      - "Это же... улицы Империи Сакуры?"
      - "Госпожа Нагато, посмотри туда."
  - text:
      - "Поднялся неистовый ветер, а грань между небом и землёй размылась, будто всё вокруг залило тушью."
      - "Ущербная луна сочилась багрянцем."
      - "В самом сердце города Сакуры, на крыше замка тэнсю..."
      - "...одинокая фигура противостояла чёрному мареву над облаками."
  - char: "nagato"
    side: "left"
    text:
      - "Это?.. Великий Мудрец?.."
  - text:
      - "Не успели затихнуть её слова, как силуэт взмыл ввысь, и холодный росчерк клинка вонзился в облака."
      - "Сияние пронзило плотные чёрные тучи, и следом за ним грянула колоссальная ударная волна..."

chapter5:
  rows:
  - text:
      - "Вокруг внезапно всё стихло."
      - "Небо стало чистым и лазурным, на траве заблестели капли росы, в воздухе мягко зашелестел ветерок."
      - "На невысоком холме неподалёку стоял силуэт."
  - char: "nagato"
    side: "left"
    text:
      - "Великий Мудрец!..."
      - "Что же это были за видения?"
  - char: "unzen_s"
    side: "right"
    text:
      - "Госпожа Нагато, госпожа Мусаси."
      - "Снятся ли вам сны?"
      - "Одни говорят, что сны — это продолжение яви, другие — что они предвещают грядущее."
      - "Но мои сны совсем иные."
      - "В них я бесчисленное множество раз видела гибель."
      - "День за днём, год за годом."
      - "Во снах я испробовала все мыслимые способы спасти этот мир."
      - "Но в конце концов... Быть может, я с самого начала знала ответ."
      - "«Тень Коррозии» — так я зову его."
      - "Пусть даже между его появлениями проходят века, оно неизменно крадётся следом за падением звезды и нисходит в мир."
      - "Ватацуми и «Тень Коррозии» подобны двум сторонам одной монеты — эта связь нерушима."
  - char: "musashi"
    side: "left"
    text:
      - "Неужели действительно нет другого выхода?"
  - char: "unzen_s"
    side: "right"
    text:
      - "А как вообще можно избавиться от собственной тени?"
      - "Где есть свет, там неизбежно есть и тьма. Убывая и прибывая, они образуют хрупкое равновесие."
  - char: "musashi"
    side: "left"
    text:
      - "Великий Мудрец, чем же на самом деле является Ватацуми?"
  - char: "unzen_s"
    side: "right"
    text:
      - "В нём нет ничего особенного. Можно даже сказать, что по своей сути он ничем не отличается от того, что вы зовёте Кубом Мудрости."
      - "Куб Мудрости и Ватацуми — разные пути, ведущие к одному и тому же началу."
  - char: "musashi"
    side: "left"
    text:
      - "Великий Мудрец, я не понимаю..."
      - "Ты хочешь сказать, что Ватацуми... на самом деле тоже своего рода Куб Мудрости?"
  - char: "unzen_s"
    side: "right"
    text:
      - "«Куб Мудрости» — лишь человеческое название. Ватацуми существовал задолго до того, как зародилось само это понятие."
      - "Смертные ликуют от собственных творений, но величайший созидатель — сама природа."
      - "Если непременно нужно дать ему определение, полагаю, его можно назвать... «первоосновой»."
      - "И подобные первоосновы в космических масштабах — вовсе не единичный случай."
  - char: "musashi"
    side: "left"
    text:
      - "Первооснова... Куб Мудрости..."
  - char: "unzen_s"
    side: "right"
    text:
      - "Это краеугольный камень, заложенный природой, и истинное чудо, сотканное из бесчисленных непостижимых совпадений."
      - "Оно — это я."
  - text:
      - "На фоне звёздного неба одна из звёзд отвесно падала вниз."
      - "Небосвод осыпался по обе стороны от её следа, обнажая зияющую за ним чёрную бездну."
      - "БАБАХ!!!"

chapter6:
  rows:
  - text:
      - "С оглушительным треском звезда врезалась в твердь. Тектонические плиты содрогнулись, и разрушительная волна разошлась кругами во все стороны от точки удара."
      - "В обжигающем сиянии исполинские кристаллы стремительно прорастали из земли прямо к небесам."
  - char: "nagato"
    side: "left"
    text:
      - "Так вот каким... было падение звезды, описанное в преданиях «Хроник Ватацуми»?.."
      - "И истоком зарождения Великого Святилища..."

chapter7:
  rows:
  - text:
      - "Свет Ватацуми угасал всё сильнее."
      - "Перед лицом сокрушительного удара Великого Мудреца чудовище, именуемое «Тенью Коррозии», в безумии отчаянно сопротивлялось."
      - "Чёрное марево подступало к ним со всех сторон."
      - "Она изо всех сил взмахнула клинком, но даже острейший росчерк лезвия не мог рассечь эту тьму."
  - char: "nagato"
    side: "right"
    text:
      - "Боги, даруйте защиту! Прочь!..."
  - text:
      - "Среди всепоглощающего чёрного марева лишь крошечный клочок пространства всё ещё хранил свет."
      - "Однако это единственное сияние трепетало, точно пламя свечи на ветру, и хрупкое равновесие между светом и тьмой вот-вот готово было рухнуть."
  - char: "nagato"
    side: "left"
    text:
      - "Как же так!..."
  - text:
      - "..."

chapter8:
  rows:
  - char: "nagato"
    side: "left"
    text:
      - "Раз уж всё дошло до этого, у меня остался лишь один выход."
      - "Если я вложу все свои силы в твой клинок, твой сокрушительный удар, быть может, подарит нам призрачный шанс на спасение."
  - char: "musashi"
    side: "right"
    text:
      - "Ни в коем случае!"
      - "Но если так, что станет с тобой, госпожа Нагато?!"
  - char: "nagato"
    side: "left"
    text:
      - "Защищать Сакуру — мой долг как Мико - Божественного Дитя."
      - "Я давно принесла эту клятву..."
      - "Да защитят меня боги!"
  - text:
      - "Нагато вложила ножны в руки Мусаси и изо всех сил оттолкнула её назад."
      - "В следующее мгновение чёрное марево поглотило Нагато, оказавшуюся за пределами барьера."

chapter9:
  rows:
  - char: "musashi"
    side: "left"
    text:
      - "Госпожа Нагато!"
  - text:
      - "Следом накатила сокрушительная ударная волна."
  - char: "owari"
    side: "left"
    text:
      - "Великий Мудрец?.."
  - text:
      - "Воспоминание оборвалось, и сознание вновь поглотила тьма."
