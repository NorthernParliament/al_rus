chapter1:
  rows:
  - char: "zuihou"
    side: "left"
    text:
      - "Если госпожам что-нибудь понадобится, прошу, зовите в любую минуту."
  - text:
      - "После недолгого молчания..."
  - char: "nagato"
    side: "left"
    text:
      - "Мусаси, мне всё не даёт покоя один вопрос."
      - "После того сокрушительного удара нас выбросило из того пространства."
      - "А когда сознание вернулось, мы снова оказались у подножия Великого Древа."
      - "Но ведь Великое Древо должно было увянуть?.."
  - char: "musashi"
    side: "right"
    text:
      - "Госпожа Нагато, помнишь ли ты, что тогда сказала Великий Мудрец?"

chapter2:
  rows:
  - char: "unzen_s"
    side: "left"
    text:
      - "«Когда я и бедствие обратимся в небытие, если всё пройдёт благополучно, барьер развеется сам собой»."

chapter3:
  rows:
  - char: "musashi"
    side: "right"
    text:
      - "Барьер, возведённый тогда Великим Мудрецом, не исчез и по сей день..."
      - "Должно быть, именно он всё это время скрывал истинные изменения."
      - "А сейчас барьер уже на грани разрушения, и истинное состояние Великого Древа вот-вот обнажится."
  - char: "nagato"
    side: "left"
    text:
      - "На аванпосту, что я велела возвести после тех событий, за все эти годы ни разу не докладывали ни о чём странном."
      - "Когда я погрузилась в сон внутри священного древа, я тоже пыталась отыскать следы Великого Мудреца."
      - "Но в итоге так ничего и не нашла."
  - char: "musashi"
    side: "right"
    text:
      - "Те увядшие священные древа так и не дали новых побегов."
      - "Прежде мы не могли подойти к Великому Древу именно из-за преграждавшего путь барьера."
      - "Но если барьер рассеется, мы сможем вновь войти внутрь."
      - "Вот только, госпожа Нагато, меня кое-что тревожит."
      - "Если барьер исчезнет окончательно, заточённая в нём Тень Коррозии вырвется наружу."
  - char: "nagato"
    side: "left"
    text:
      - "Именно поэтому я должна немедленно начать приготовления к Технике Мудреца."
  - char: "musashi"
    side: "right"
    text:
      - "Технике Мудреца?"
  - char: "nagato"
    side: "left"
    text:
      - "Да... Эта техника записана в «Хрониках Ватацуми», но её названия там нет."
      - "Я лишь подумала, что прежде ею пользовалась Великий Мудрец, потому и назвала её так."
      - "Госпожа Мусаси, не придавай этому значения..."
      - "Предвидя такой исход, я сделала приготовления ещё до нашего отправления, однако некоторые материалы для ритуала придётся собрать прямо здесь."
  - char: "musashi"
    side: "right"
    text:
      - "Госпожа Нагато, ты можешь назвать мне всё необходимое, и я приготовлю это для тебя."
  - char: "nagato"
    side: "left"
    text:
      - "С такими пустяками вполне справятся Овари с остальными..."
  - text:
      - "Словно вспомнив о чём-то, Нагато окинула взглядом комнату."
      - "Этот аванпост был выстроен в традиционном стиле Империи Сакуры."
      - "Если бы не Великое Древо за окном, по одному лишь убранству комнат его запросто можно было принять за самый обычный жилой дом."
  - char: "nagato"
    side: "left"
    text:
      - "Кстати говоря, что-то я совсем не вижу Овари..."
  - text:
      - "Так никого и не высмотрев, Нагато взяла со стола пиалу с чаем и сделала небольшой глоток."
  - char: "musashi"
    side: "right"
    text:
      - "Ничего страшного. Раз уж Овари сейчас нет, госпожа Нагато, просто скажи мне."
  - text:
      - "Взяв с полки поблизости тушь и бумагу..."
      - "Нагато принялась растирать тушь, а Мусаси аккуратным, каллиграфическим почерком стала записывать названия нужных для ритуала материалов."
      - "В воздухе разлился тонкий аромат свежей туши."
      - "*бу-бух*"
      - "Словно что-то упало на пол."
  - char: "natori"
    side: "left"
    text:
      - "М-м-м..."
      - "Хацудзуки... Дзуйхо... Где вы?"
  - text:
      - "В тихом шёпоте, донёсшемся из внутренних комнат, сквозила сонная леность."
      - "Миниатюрная девушка, сонно потирая глаза, босиком прошлёпала в гостиную."
  - char: "natori"
    side: "left"
    text:
      - "О! Это же цветочный чай, который Дзуйхо заварила!"
  - text:
      - "Сонная Натори семенящими шажками подошла к столику, наугад смахнула стоящую пиалу и протянула её прямо Нагато."
  - char: "natori"
    side: "left"
    text:
      - "Налей мне тоже чашечку."
      - "М-м~! Я так пить хочу~!"
  - text:
      - "Нагато, слегка опешив, наполнила её чашу до краёв."
  - char: "natori"
    side: "left"
    text:
      - "Как вкусно пахнет!"
  - text:
      - "Натори осушила пиалу одним махом, и остатки дремоты окончательно с неё слетели."
      - "Поставив пиалу обратно на стол, Натори наконец заметила неладное."
  - char: "natori"
    side: "left"
    text:
      - "Э?.. Хацудзуки, почему ты сегодня совсем не похожа на себя?.."
      - "И Овари тоже... словно посветлела?.."
  - text:
      - "Мусаси отложила кисть в сторону и с мягкой улыбкой посмотрела на неё."
  - char: "musashi"
    side: "right"
    text:
      - "Госпожа Нагато, это ведь Натори?"
  - char: "natori"
    side: "left"
    text:
      - "Э? Гос... госпожа Нагато?.."
  - text:
      - "Снова протерев глаза, Натори принялась растерянно переводить взгляд с одной на другую."
  - char: "natori"
    side: "left"
    text:
      - "Госпожа Мусаси, госпожа Нагато... Э-э?!"
  - text:
      - "Натори вмиг плюхнулась прямо на пол."
  - char: "natori"
    side: "left"
    text:
      - "П-п-простите, простите, простите меня-я-я!"
  - char: "musashi"
    side: "right"
    text:
      - "Ничего страшного. Подними голову. Как раз сейчас у госпожи Нагато есть важное дело, которое нужно поручить Овари и остальным."
      - "Поможешь им?"
  - char: "natori"
    side: "left"
    text:
      - "Б-б-без проблем, всё сделаю!"
  - text:
      - "Нагато тихо вздохнула."
  - char: "nagato"
    side: "left"
    text:
      - "Мы явились сюда без предупреждения, твоей вины в этом нет, так что не нужно извиняться."
      - "Госпожа Мусаси, время не ждёт, давай поскорее займёмся подготовкой к ритуалу."
  - text:
      - "Дописав последние строки в списке, Мусаси слегка подула на сырую тушь, чтобы та подсохла. Затем аккуратно свернула листок и убрала его в рукав."
      - "Она ободряюще взглянула на сжавшуюся в углу Натори, и та послушно засеменила следом за ней."
      - "Подойдя к раздвижной двери, Мусаси услышала доносящиеся снаружи взволнованные голоса."
  - char: "zuihou"
    side: "left"
    text:
      - "Вот теперь совсем нехорошо... Я ведь так и не успела доложить госпожам об исчезновении Овари."
      - "А если они спросят, что же нам делать..."
  - text:
      - "Их негромкую беседу прервала Мусаси, внезапно отодвинув створку."
  - char: "musashi"
    side: "right"
    text:
      - "Можете не тревожиться, с Овари всё в порядке."
      - "С минуты на минуту её приведут назад."
