chapter1:
  rows:
  - char: "asanagi"
    side: "left"
    text:
      - "Кх..."
      - "Проклятье..."
  - char: "hatsuzuki"
    side: "right"
    text:
      - "Асанаги, у тебя тоже снаряды кончились?.."
  - char: "asanagi"
    side: "left"
    text:
      - "Осталось только оружие в руках. Даже если придётся прорубаться врукопашную, мы выберемся отсюда!"
  - char: "hatsuzuki"
    side: "right"
    text:
      - "Натори, спрячься за нашими спинами."
      - "Если появится хоть малейший шанс, сразу беги отсюда..."
  - char: "natori"
    side: "left"
    text:
      - "Да о чём ты говоришь?! Я тоже буду всех защищать!"
  - char: "hatsuzuki"
    side: "right"
    text:
      - "Ну право же! Не время геройствовать! В такой-то момент!"
  - char: "asanagi"
    side: "left"
    text:
      - "Опять лезут!"
  - text:
      - "Едва успев заблокировать удар оснасткой, троица встала спина к спине — отступать было некуда."
  - char: "hatsuzuki"
    side: "left"
    text:
      - "Похоже, это конец..."
  - text:
      - "Направив острия клинков на чёрное марево, девушки не сводили с него горящих решимостью глаз."
      - "Марево внезапно ускорилось и ринулось прямо на них..."

chapter2:
  rows:
  - char: "hatsuzuki"
    side: "left"
    text:
      - "..."
      - "......"
  - text:
      - "Кожу вдруг обдало мягким теплом."
  - char: "asanagi"
    side: "right"
    text:
      - "Что происходит?.."
  - char: "natori"
    side: "left"
    text:
      - "Смотрите, эти твари в страхе разбегаются!"
  - text:
      - "С небес пролился луч света. Там, куда касалось его сияние, марево корчилось и растворялось с жалобным шипением."
  - char: "natori"
    side: "left"
    text:
      - "Так тепло..."
      - "Это техника госпожи Нагато?.."
  - text:
      - "Столп света постепенно расширялся, пока не накрыл девушек целиком."
      - "И в этом сиянии их взору открылась совершенно иная картина."
  - char: "natori"
    side: "left"
    text:
      - "Н-нас сейчас телепортирует наружу?.."
  - text:
      - "Свет становился всё ярче, и даже сквозь плотно закрытые веки ощущалась его ослепительная белизна."
