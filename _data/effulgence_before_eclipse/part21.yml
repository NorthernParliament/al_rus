chapter1:
  rows:
  - text:
      - "Земля содрогнулась."
  - char: "asanagi"
    side: "left"
    text:
      - "Землетрясение?"
  - char: "hatsuzuki"
    side: "right"
    text:
      - "Это не землетрясение, посмотрите наверх!"
  - text:
      - "В прежде чистом ночном небе внезапно пролегла чёрная трещина."
      - "Оттуда хлынуло чёрное марево, отравляя небосвод."
  - char: "unzen_s"
    side: "left"
    text:
      - "Время пришло..."
  - text:
      - "Она стояла на берегу озера, пейзаж вокруг которого давно переменился; стайки мерцающих призрачно-голубым светом бабочек постепенно окружили её..."
      - "...пока окончательно не скрыли из виду."
  - char: "natori"
    side: "right"
    text:
      - "Сестрица?!"
  - char: "hatsuzuki"
    side: "left"
    text:
      - "Натори, берегись!"
  - char: "asanagi"
    side: "right"
    text:
      - "Да откуда они опять лезут!"
  - text:
      - "Разлом неумолимо ширился, и девушкам, давно израсходовавшим весь боекомплект, оставалось лишь отступать всё глубже."
  - char: "natori"
    side: "left"
    text:
      - "Куда подевалась сестрица?"
  - text:
      - "А на том самом месте, где она только что стояла, с небес ударил столп света."
  - char: "asanagi"
    side: "right"
    text:
      - "Сюда опять кого-то забросило!"
  - text:
      - "Ответом стал оглушительный бортовой залп."
  - char: "owari"
    side: "left"
    text:
      - "Да сколько же их тут, они отовсюду прут!"
  - char: "asanagi"
    side: "right"
    text:
      - "Осторожнее, это же опасно! Разуй глаза, прежде чем палить!"
  - text:
      - "Столп света растаял, и взгляду девушек наконец предстали двое прибывших."
  - char: "asanagi"
    side: "right"
    text:
      - "Овари!"
      - "Вечно ты заставляешь всех за тебя переживать!"
  - char: "owari"
    side: "left"
    text:
      - "Погодите, стойте... А вы-то как здесь оказались?! Нет, стоп, а где мы вообще?"
  - char: "hatsuzuki"
    side: "right"
    text:
      - "Э-это «безопасный сад»... по крайней мере, был им, пока вы не свалились..."
      - "Ладно, некогда объяснять, сначала нужно перебить врагов!"
  - char: "asanagi"
    side: "left"
    text:
      - "Главная беда в том, что они попросту бесконечные! А та сестрица, что перенесла нас сюда, кажется, отлично умела с ними справляться."
      - "Жаль только, сейчас её нигде не найти."
  - char: "owari"
    side: "right"
    text:
      - "Та сестрица, про которую ты говоришь, — это та же, кого встретили мы?.."
  - char: "asanagi"
    side: "left"
    text:
      - "В белых одеждах и с белыми волосами?.."
  - char: "owari"
    side: "right"
    text:
      - "Точно она."
      - "...Погоди, ты сказала, что это она отправила вас сюда?"
      - "Но ведь только что эта сестрица была прямо с нами!"
  - char: "asanagi"
    side: "left"
    text:
      - "В смысле? Хочешь сказать, этих сестриц на самом деле две?"
  - char: "owari"
    side: "right"
    text:
      - "Да как такое вообще возможно! Я ведь случайно пальнула в неё из главного калибра, а она отбила снаряд!"
      - "Так что мне точно не пригрезилось!"
  - char: "hatsuzuki"
    side: "left"
    text:
      - "Получается... это нам всё лишь привиделось?.."
  - char: "asanagi"
    side: "right"
    text:
      - "Да не бывает таких массовых видений сразу у всех!"
  - char: "natori"
    side: "left"
    text:
      - "Но вы вспомните, как эта сестрица растворилась у нас на глазах, разве это не похоже на сон?"
      - "Она же ну чистая богиня!"
      - "А раз она богиня, создавать двойников для неё в порядке вещей, разве нет?"
  - char: "hatsuzuki"
    side: "right"
    text:
      - "Давайте лучше пока закроем эту тему..."
      - "Сперва надо придумать, как разобраться с бедой над нашими головами."
