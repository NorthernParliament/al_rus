chapter1:
  rows:
  - char: "shimanto"
    side: "left"
    text:
      - "Да пребудет с нами божественная защита..."
  - text:
      - "Она бросилась в атаку на чёрного дракона."
      - "Бумажный дракон проворно порхал вокруг, но поразительнее всего было другое..."
      - "Хотя он и выглядел хрупким, словно тончайший лист бумаги, натиск марева не наносил ему ни малейшего вреда."
  - char: "shimanto"
    side: "left"
    text:
      - "Госпожа Ундзэн, он открылся!"
  - char: "unzen"
    side: "right"
    text:
      - "Залп!..."
  - text:
      - "Шквал яростного артиллерийского огня обрушился ливнем, нанеся дракону сокрушительный удар."
  - char: "shimanto"
    side: "left"
    text:
      - "Они все стягиваются сюда!"
  - text:
      - "Всё марево в этот миг сливалось воедино."
      - "Голова чёрного дракона неумолимо разрасталась, пока не заслонила собой почти весь обзор."
  - char: "shimanto"
    side: "left"
    text:
      - "Огонь!"
  - text:
      - "Мощь орудийных выстрелов казалась слишком ничтожной — она не могла вызвать даже лёгкой ряби на сгустившемся чёрном мареве."
      - "В следующий миг голова другого дракона, точно вынырнувший из морской пучины кит, со всей тяжестью обрушилась прямо на них."
      - "Уклониться было уже невозможно."
  - char: "shimanto"
    side: "left"
    text:
      - "!..."
  - text:
      - "Парящие бумажные талисманы развеялись в прах в то же мгновение, едва коснулись марева."
      - "«Всё тщетно...»"

chapter2:
  rows:
  - char: "nop"
    side: "left"
    text:
      - "..."
      - "Сгиньте, злые духи!..."
  - text:
      - "Прямо перед девушками длинный клинок намертво принял на себя удар обрушившегося исполинского зверя."
  - char: "ibuki"
    side: "left"
    text:
      - "!..."
      - "Госпожи, отступайте!"
  - text:
      - "Набрав скорость, они поспешили вырваться из-под накрывшей всё циклопической тени."
  - char: "shimanto"
    side: "right"
    text:
      - "Кто это вообще такая?"
  - text:
      - "Парящий остров переломился пополам под тяжестью чудовища, и Ибуки скрылась под лавиной каменных обломков и пыли."
      - "Чудом избежав гибели, обе девушки потрясённо переглянулись."
  - char: "shimanto"
    side: "right"
    text:
      - "Госпожа Ундзэн, как нам совладать с ним в таком обличье?"
  - text:
      - "Ундзэн коснулась скрытого механизма на оснастке..."
      - "...и её вооружение в единый миг обратилось стайкой разлетающихся бабочек, бесследно растаяв в воздухе."
  - char: "unzen"
    side: "left"
    text:
      - "Симанто, у меня есть просьба."
  - char: "shimanto"
    side: "right"
    text:
      - "Только прикажи."
  - char: "unzen"
    side: "left"
    text:
      - "Этот удар... решит судьбу Сакуры, если не всего этого мира."
      - "Чтобы поразить цель наверняка, я должна подобраться как можно ближе к самому средоточию Тени Коррозии."
      - "Но прежде..."
  - char: "shimanto"
    side: "right"
    text:
      - "Госпожа Ундзэн, не нужно лишних слов."
      - "Я сама доставлю тебя туда!"
