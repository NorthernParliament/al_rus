chapter1:
  rows:
  - text:
      - "Тем временем..."
      - "Близился рассвет. Следуя наказу, Муцу достала из складок одежд парчовый мешочек."
      - "Внутри лежал крошечный свиток."
      - "На нём виднелось лишь несколько наспех начертанных строк."
  - char: "mutsu"
    side: "left"
    text:
      - "?!..."
  - char: "kawakaze"
    side: "right"
    text:
      - "Госпожа Муцу, куда ты так спешишь?"
  - char: "mutsu"
    side: "left"
    text:
      - "Скорее, приготовь всё!"
      - "Мы должны немедленно запустить небесный фонарь!"
  - text:
      - "Вскоре исполинский фонарь с колышущимся внутри пламенем свечи медленно поднялся в воздух."
      - "Опередив рассвет, он засиял самой яркой звездой на ночном небосклоне."

chapter2:
  rows:
  - text:
      - "Не сомкнувшая за ночь глаз Сакава заметила внезапно вспыхнувшую в небе точку."
      - "Она кубарем бросилась вниз по лестнице."
  - char: "sakawa"
    side: "left"
    text:
      - "В столице зажгли небесный фонарь!"
  - text:
      - "Вскрикнув, Сакава налетела в дверях на Кии."
  - char: "sakawa"
    side: "left"
    text:
      - "В столице зажгли небесный фонарь!!"
      - "Нагато взывает о помощи!"
  - char: "kii"
    side: "right"
    text:
      - "..."
      - "Что ж... тогда мы откликнемся."
      - "Зажечь небесный фонарь!"
  - text:
      - "Ещё один фонарь взмыл ввысь над поместьем Мусаси."
      - "В небесах вспыхивало всё больше огней, цепочкой протянувшихся к самому горизонту."
      - "Они словно слились в сияющего длинного дракона."
      - "Подобно сигнальным кострам, фонари разнесли срочную весть во все уголки Сакуры."

chapter3:
  rows:
  - char: "mutsu"
    side: "left"
    text:
      - "Сестра..."
  - text:
      - "Стоя под увядшим священным древом столицы, Муцу безмолвно возносила молитву."
      - "Бурный поток веры устремился к священным древам по всей империи."
      - "Невидимые корни принялись стремительно разрастаться."
      - "Словно ласковые ладони, они коснулись ветвей иссохшего Великого Древа на другом конце, вновь наполняя его жизненной силой."
  - char: "mutsu"
    side: "left"
    text:
      - "Сестра..."
      - "Пусть эта река веры..."
      - "...поможет вам выстоять в этой беде."
