chapter1:
  rows:
  - char: "nop"
    side: "right"
    text:
      - "Ува-а-а!..."
      - "Ува-а-а-а!..."
  - text:
      - "Странные вопли эхом отдавались в ушах Овари."
  - char: "owari"
    side: "left"
    text:
      - "Этот голос... Дзуйхо?"
      - "Да нет, не может быть, я точно головой приложилась."
      - "Звучит так, будто Дзуйхо летит по небу..."
  - char: "zuihou"
    side: "right"
    text:
      - "Ува-а-а!..."
      - "Овари-и-и!..."
  - char: "owari"
    side: "left"
    text:
      - "..."
      - "......"
      - "Э-э-э?! И правда Дзуйхо?!"
  - char: "zuihou"
    side: "right"
    text:
      - "По... моги... мне-е-е!..."
  - char: "owari"
    side: "left"
    text:
      - "Ты что, реально летишь по небу?!"
  - char: "zuihou"
    side: "right"
    text:
      - "Поймай меня!"
  - text:
      - "Оглядевшись по сторонам в поисках чего-нибудь подходящего, Овари случайно зацепилась взглядом за цепи на своей оснастке."
  - char: "owari"
    side: "left"
    text:
      - "Ха-а! Оснастка разве столь бесполезная штука?!"
  - text:
      - "Голыми руками сорвав цепь..."
      - "...она связала звенья, прикрепила якорь в качестве груза и метнула его прямиком к Дзуйхо, которую уносило бушующим вихрем."
  - char: "owari"
    side: "left"
    text:
      - "Хватайся крепче!"
  - text:
      - "Изо всех сил выдернув Дзуйхо из опасной зоны, Овари не совладала с мощной инерцией, и они с размаху врезались друг в друга."
  - char: "owari"
    side: "left"
    text:
      - "Ай-ой!"
  - char: "zuihou"
    side: "right"
    text:
      - "..."
      - "Ы-ы..."
      - "Ы-ы-ы-ы-ы-ы..."
  - text:
      - "Поднявшись с Овари, Дзуйхо опустилась рядом и горько расплакалась."
  - char: "zuihou"
    side: "right"
    text:
      - "Как же страшно, ы-ы-ы-ы-ы..."
      - "Госпожа Мусаси... Госпожа Мусаси, она..."
  - text:
      - "Земля содрогнулась. Место, где они находились, оказалось парящим в воздухе островком, который медленно вращался вокруг общего центра."
  - char: "owari"
    side: "left"
    text:
      - "Госпожа Мусаси? Она тоже здесь?"
  - text:
      - "Всегда спокойная и рассудительная Дзуйхо сейчас рыдала навзрыд."
      - "Хоть у Овари и накопилась уйма вопросов, было предельно ясно, что сейчас совсем не время для расспросов."
  - char: "owari"
    side: "left"
    text:
      - "В общем..."
      - "Сперва найдём безопасное место..."
      - "А со всем остальным разберёмся потом!"
  - text:
      - "Не слушая возражений, Овари взвалила Дзуйхо на плечо и со всех ног бросилась прочь от центра."
