chapter1:
  rows:
  - text:
      - "Обнаружив, что они могут перемещаться по невидимой плоскости, Овари увела Дзуйхо и спряталась с ней за полуразрушенным холмом."
      - "Глаза Дзуйхо всё ещё были красными от слёз."
  - char: "zuihou"
    side: "left"
    text:
      - "Овари, ты заставила всех так волноваться!"
      - "Даже если тебе приснилось что-то жуткое или послышался странный голос, нужно было разбудить нас и всё обсудить вместе!"
  - char: "owari"
    side: "right"
    text:
      - "Да-да, виновата, в следующий раз так делать не буду."
  - char: "zuihou"
    side: "left"
    text:
      - "Ты хоть какой-то урок из этого извлекла?"
  - char: "owari"
    side: "right"
    text:
      - "Честное слово, я уже всё осознала~"
  - char: "zuihou"
    side: "left"
    text:
      - "Эх... ладно уж."
  - char: "owari"
    side: "right"
    text:
      - "Ты сказала, госпожа Нагато и госпожа Мусаси прибыли сюда."
      - "И где же они сейчас?"
  - char: "zuihou"
    side: "left"
    text:
      - "Госпожа Нагато оставалась на аванпосту, чтобы приготовиться к ритуалу."
      - "А госпожа Мусаси помогала нам собирать материалы для него, но кто же мог подумать..."
      - "Великое Древо почему-то внезапно увяло."
  - char: "owari"
    side: "right"
    text:
      - "Материалы для ритуала, увядание..."
      - "А я собственными глазами видела, как запечатывающий барьер Великого Древа окончательно рассеялся!"
      - "И как раз из-за его падения то, что было запечатано внутри, вырвалось наружу."
      - "Скорее уж, именно потому, что барьер скрывал правду, мы всё это время и не замечали ничего странного..."
      - "Госпожа Нагато, когда отправляла нас нести стражу здесь, провела ритуал по укреплению барьера..."
      - "Но теперь видно, что того укрепления оказалось мало — капля в море..."
      - "А госпожа Мусаси? По идее, разве она не должна была оставаться с вами?"
  - char: "zuihou"
    side: "left"
    text:
      - "Когда барьер рухнул, госпожа Мусаси попыталась защитить нас, но её поглотило чёрное марево..."
  - char: "owari"
    side: "right"
    text:
      - "Тц, по зашифрованному каналу тоже тишина."
  - char: "zuihou"
    side: "left"
    text:
      - "По какому ещё зашифрованному?"
  - char: "owari"
    side: "right"
    text:
      - "Ну... Кии как-то помогла мне наладить связь с госпожой Мусаси."
      - "Так что обо всём, что здесь происходило, я порой сообщала госпоже Мусаси..."
  - char: "zuihou"
    side: "left"
    text:
      - "Хм..."
  - char: "owari"
    side: "right"
    text:
      - "Мы ведь все служим Империи Сакуры, так что в этом нет ничего дурного, верно?.."
      - "Л-ладно, сейчас не об этом."
      - "Ну и морока..."
      - "Кто бы мог подумать, что стоило лишь на миг отвлечься, как Великое Святилище превратится в такое..."
      - "Кстати, Дзуйхо."
      - "У тебя ещё остались самолёты? Может, отправишь их поискать остальных?"
  - char: "zuihou"
    side: "left"
    text:
      - "Без проблем, сейчас же подниму в воздух."
  - char: "owari"
    side: "right"
    text:
      - "А затем..."
  - text:
      - "Она осторожно выглянула из-за холма."
  - char: "owari"
    side: "right"
    text:
      - "Бесполезно, совершенно невозможно сориентироваться на местности."
  - char: "zuihou"
    side: "left"
    text:
      - "Я расширю радиус поиска!"
