chapter1:
  rows:
  - text:
      - "На открытой площадке внешнего аванпоста Асанаги, что бывало крайне редко, взялась за метлу."
      - "И хотя она делала вид, что убирается, подражая Дзуйхо..."
      - "...все её мысли были заняты тем, что сейчас происходило в доме."
  - char: "asanagi"
    side: "left"
    text:
      - "Эй... эй!..."
  - text:
      - "Понизив голос, она на цыпочках подошла к отдыхавшей на веранде Хацудзуки."
  - char: "asanagi"
    side: "left"
    text:
      - "Ты же говорила, что гостей трое, почему пришли только госпожа Нагато и госпожа Мусаси?"
  - char: "hatsuzuki"
    side: "right"
    text:
      - "Тогда мне точно показалось, что их трое... хотя, возможно, в глазах зарябило."
  - char: "asanagi"
    side: "left"
    text:
      - "Как думаешь, зачем обе госпожи вдруг явились сюда?.."
  - char: "hatsuzuki"
    side: "right"
    text:
      - "Подслушивать нельзя!"
  - text:
      - "Хацудзуки остановила Асанаги, уже собравшуюся прижать ухо к двери, но как раз в этот миг створка скользнула в сторону."
      - "Хацудзуки ухватила Асанаги за воротник, помогая удержать равновесие, и подняла взгляд: открывшей дверь оказалась Дзуйхо, прижимавшая поднос к груди. Затем Дзуйхо отвесила в комнату лёгкий поклон."
  - char: "zuihou"
    side: "left"
    text:
      - "Если госпожам что-нибудь понадобится, прошу, зовите в любую минуту."
  - text:
      - "Раздвижная дверь тихо закрылась."
  - char: "zuihou"
    side: "left"
    text:
      - "Фу-ух..."
  - char: "asanagi"
    side: "right"
    text:
      - "Садись скорее, садись!"
      - "Расскажи нам, что там вообще происходит?"
  - char: "hatsuzuki"
    side: "left"
    text:
      - "Дай Дзуйхо сперва дух перевести."
  - text:
      - "Опустившись рядом с ними, Дзуйхо отставила поднос в сторону."
  - char: "zuihou"
    side: "left"
    text:
      - "У-у-у... я так перенервничала!"
      - "Я ведь впервые оказалась так близко к обеим госпожам..."
      - "Да ещё и совсем не успела подготовиться — когда наливала чай, чуть всё не испортила!"
      - "Но, к счастью, обошлось..."
      - "Госпожа Нагато выглядела очень серьёзной, а вот госпожа Мусаси, заметив, как я паникую, наоборот, сразу смягчилась в лице."
      - "Эти несколько минут были словно во сне..."
  - char: "asanagi"
    side: "right"
    text:
      - "Ну так что, ну так что? Неужели они и правда явились из-за Овари?.."
  - char: "zuihou"
    side: "left"
    text:
      - "Госпожа Нагато сказала, что они направляются к подножию Великого Древа..."
  - char: "asanagi"
    side: "right"
    text:
      - "А? К подножию Великого Древа? Ты про вон то?"
  - text:
      - "Асанаги указала рукой на исполинскую крону, вздымающуюся над горизонтом."
  - char: "zuihou"
    side: "left"
    text:
      - "Да, именно..."
  - char: "asanagi"
    side: "right"
    text:
      - "Здорово! Я так давно мечтала там побывать!"
  - char: "hatsuzuki"
    side: "left"
    text:
      - "Надо же, к самому подножию Великого Древа..."
  - char: "zuihou"
    side: "right"
    text:
      - "Вот теперь совсем нехорошо... Я ведь так и не успела доложить госпожам об исчезновении Овари."
      - "А если они спросят, что же нам делать..."
  - text:
      - "Их негромкую беседу прервала Мусаси, внезапно отодвинув дверь."
  - char: "musashi"
    side: "left"
    text:
      - "Можете не тревожиться, с Овари всё в порядке."
      - "С минуты на минуту её приведут назад."
  - char: "hatsuzuki"
    side: "right"
    text:
      - "Госпожа Мусаси..."
  - char: "musashi"
    side: "left"
    text:
      - "Оставьте церемонии. У госпожи Нагато есть для вас важное поручение."
      - "Вот список всего, что потребуется для ритуала. Поручаю приготовления вам."
  - text:
      - "Мусаси достала из рукава записку и передала её Дзуйхо."
      - "Прятавшиеся за спиной Дзуйхо подруги не смели проронить ни звука."
  - char: "musashi"
    side: "left"
    text:
      - "Тебя, помнится, зовут... Хацудзуки?"
  - char: "hatsuzuki"
    side: "right"
    text:
      - "Д-да, госпожа Мусаси!"
  - char: "musashi"
    side: "left"
    text:
      - "Значит, тогда вдалеке я видела именно тебя."
  - char: "hatsuzuki"
    side: "right"
    text:
      - "Прошу меня простить! Увидев вас, я так растерялась, что с перепугу сразу..."
  - text:
      - "В этот миг из-за спины Мусаси украдкой выглянула миниатюрная фигурка — с виноватым лицом, точь-в-точь напроказивший ребёнок."
  - char: "asanagi"
    side: "left"
    text:
      - "Натори?.."
      - "Ой-ой, я же совсем забыла её разбудить..."
      - "Госпожа Мусаси, искренне прошу прощения!"
  - char: "musashi"
    side: "right"
    text:
      - "Тебе незачем извиняться."
  - text:
      - "Мусаси слегка посторонилась, позволив Натори юркнуть к подругам."
  - char: "musashi"
    side: "right"
    text:
      - "А пока готовятся принадлежности для ритуала, побеседуйте со мной."
      - "Расскажите мне о себе и об этом месте."
