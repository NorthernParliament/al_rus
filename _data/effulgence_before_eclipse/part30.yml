chapter1:
  rows:
  - char: "musashi"
    side: "left"
    text:
      - "Как состояние госпожи Нагато?"
  - char: "kii"
    side: "right"
    text:
      - "Кажется, она погрузилась в сон внутри Великого Древа, прямой опасности нет."
      - "Госпожа Мусаси, неужели Священное Древо способно и на такое?.."
  - char: "musashi"
    side: "left"
    text:
      - "Это тайна, не стоит больше вспоминать об этом."
  - char: "kii"
    side: "right"
    text:
      - "Поняла."
      - "Вот только, госпожа Мусаси..."
      - "Госпожа Нагато внезапно объявила об отречении... как следует запечатлеть это в хрониках?"
  - char: "musashi"
    side: "left"
    text:
      - "Госпожа Нагато наставляла..."
      - "...нельзя допустить, чтобы правда о её ранении разнеслась по свету."
      - "Поступай так, как она велела."
  - text:
      - "Кии покинула покои."
      - "Перед шёлковым пологом сидела, чинно выпрямив спину, миниатюрная фигурка."
  - char: "minazuki"
    side: "left"
    text:
      - "«Как продвигаются исследования того, что вверил тебе Великий Мудрец?»"
  - char: "musashi"
    side: "right"
    text:
      - "Мне удалось создать копию священного камня Ватацуми. Хоть она и несовершенна..."
      - "...но свойства, которые она явила, превзошли все мои ожидания."
  - char: "minazuki"
    side: "left"
    text:
      - "«А что с Синано?»"
  - char: "musashi"
    side: "right"
    text:
      - "Есть успехи. Синано... кажется, унаследовала часть силы Великого Мудреца."
      - "Она способна блуждать по сновидениям, но из-за этого погрузилась в беспробудный сон."
  - char: "minazuki"
    side: "left"
    text:
      - "«Перевези Синано на Диадему Света. Она далёка от главных островов и далёк от эпицентра водоворота.»"
      - "«Когда же она пробудится... передай ей благословение от моего имени.»"
  - char: "musashi"
    side: "right"
    text:
      - "Я поняла."
  - char: "minazuki"
    side: "left"
    text:
      - "...Госпожа Мусаси, всё закончилось?"
      - "Тогда я пойду..."
  - char: "musashi"
    side: "right"
    text:
      - "Да, ступай отдохни в гостевых покоях."
      - "Ты славно потрудилась, Минадзуки."

chapter2:
  rows:
  - char: "musashi"
    side: "right"
    text:
      - "Что же ты планируешь..."
      - "...Ямато."
