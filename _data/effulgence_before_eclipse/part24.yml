chapter1:
  rows:
  - text:
      - "Посреди ослепительно белого пространства стояли двое..."
  - char: "unzen_s"
    side: "left"
    text:
      - "Так называемая аннигиляция — это возвращение всего сущего в небытие."
      - "Столкновение плюса и минуса, не оставляющее после себя ни следа."
      - "Будто бы ничего никогда и не существовало."
      - "Таков наш с тобой конец."
      - "Нет... Никогда не было никаких «ты» и «я». Ты — это я."
      - "Я лишь тень привязанности, вобравшая в себя всю тоску и горечь сожалений."
      - "Чего же я жду?.."
  - char: "unzen_s"
    side: "right"
    text:
      - "..."
  - char: "unzen_s"
    side: "left"
    text:
      - "Я всё ещё не могу забыть того, кого встретила тогда в том саду."
  - char: "unzen_s"
    side: "right"
    text:
      - "Я видела, как бесчисленные миры обращались в прах перед моими глазами."
      - "И наконец постигла ту единственную возможность."
      - "Кроме аннигиляции, иного пути нет."
      - "Я всегда это понимала."
  - char: "unzen_s"
    side: "left"
    text:
      - "Я понимаю."
  - char: "unzen_s"
    side: "right"
    text:
      - "Это мой конец, предрешённый давным-давно."
      - "Я — непоколебимая решимость встретить свою судьбу лицом к лицу."
  - char: "unzen_s"
    side: "left"
    text:
      - "Если бы эта решимость не дрогнула, меня бы не существовало."
      - "В этом мире, который я так люблю, мне хотелось бы купаться в ласковых лучах солнца и вдыхать дыхание времён года."
      - "Мне хотелось видеть улыбки людей."
      - "Под дождём из лепестков сакуры наслаждаться всем прекрасным, что есть на свете."
      - "Под луной вновь встретиться с тем, кто так дорог моему сердцу."
      - "Именно поэтому я ждала здесь."
      - "Застыв во времени, тщетно уповая на невозможное чудо."
      - "Лишь одну встречу... пусть даже всего одну..."
      - "Я хочу..."
  - char: "unzen_s"
    side: "right"
    text:
      - "Довольно."
      - "Дети, угодившие сюда, уже в безопасности?.."
      - "..."
      - "Вот и славно."
      - "Моё решение принято."
