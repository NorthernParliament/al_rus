chapter1:
  rows:
  - char: "unzen_s"
    side: "left"
    text:
      - "Прикройте огнём."
  - char: "zuihou"
    side: "right"
    text:
      - "Поняла!"
      - "У меня ещё остались самолёты-разведчики для сопровождения!"
  - char: "unzen_s"
    side: "left"
    text:
      - "Не отставайте."
  - text:
      - "Девушки следовали прямо за ней, подбираясь всё ближе к сгустку света над засохшим древом."
  - char: "owari"
    side: "right"
    text:
      - "Мне кажется, или свет там становится всё более тусклым?.."
  - char: "zuihou"
    side: "left"
    text:
      - "Осторожно!"
  - text:
      - "Уворачиваясь от вражеской атаки, они едва не потеряли равновесие."
  - char: "owari"
    side: "right"
    text:
      - "И-их же просто не перебить!"
  - char: "zuihou"
    side: "left"
    text:
      - "Снаружи их ещё больше, они окружают нас со всех сторон!"
  - char: "unzen_s"
    side: "right"
    text:
      - "Они идут за мной."
  - text:
      - "Она внезапно остановилась."
      - "Клинок с лязгом покинул ножны, и холодный блеск стали рассёк окружившее их марево, выиграв девушкам драгоценные мгновения."
  - char: "unzen_s"
    side: "right"
    text:
      - "С этого расстояния должно получиться."
  - char: "zuihou"
    side: "left"
    text:
      - "Сестрица, что ты задумала?.."
  - text:
      - "Над головой вновь опустился столп света, но разворачивался он будто с явным усилием."
      - "Когда сияние целиком накрыло обеих девушек..."
      - "...Великий Мудрец подошла ближе, остановившись по ту сторону световой завесы."
      - "Она мягко улыбнулась на прощание, развернулась и вновь шагнула в чёрную бездну."
