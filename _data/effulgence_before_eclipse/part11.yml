chapter1:
  rows:
  - char: "nop"
    side: "right"
    text:
      - "«...Приходи в Великое Святилище»."
      - "«Под сенью Великого Древа я открою вам истину»."
  - char: "owari"
    side: "left"
    text:
      - "Кто же это звал?.."

chapter2:
  rows:
  - char: "owari"
    side: "left"
    text:
      - "Великий Мудрец?.."
  - text:
      - "Незнакомое имя всплыло в голове."
  - char: "owari"
    side: "left"
    text:
      - "Великое Древо — священнейшее место. Божественное Дитя возвела здесь барьер, и чужакам не подобраться к нему ни на шаг."
      - "Но как же так..."
  - text:
      - "Овари посмотрела на свои ладони, словно вспомнив о чём-то."
  - char: "owari"
    side: "left"
    text:
      - "Мне приснилось?.. Кажется, прошлой ночью я коснулась Великого Древа своими руками, а после провалилась в кошмар..."
  - text:
      - "Овари оглянулась: Великое Древо всё так же возвышалось вдалеке, всё казалось привычным."
  - char: "owari"
    side: "left"
    text:
      - "Кх!..."
  - text:
      - "Стоило ей пристальнее вглядеться в Великое Древо, как в глазах закололо от острой боли, а очертания перед взором замерцали и задрожали."
      - "Разорванные светящиеся узоры слабо проступили на Великом Древе и окончательно угасли."
      - "Глухой рокот дрожью отозвался под ногами."

chapter3:
  rows:
  - text:
      - "Барьер рухнул."
