chapter1:
  rows:
  - text:
      - "Тьма и холод. Посреди бушующей Тени Коррозии эхом разносились жалобные стенания."
      - "Она лавировала среди расколотых парящих островков, высматривая тех, кто мог уцелеть."
  - char: "unzen_s"
    side: "left"
    text:
      - "..."
  - text:
      - "Ввысь взмыл яркий огонёк. Направившись в сторону вспышки, она отыскала отчаянно сражавшихся девушек."
      - "Столп света окутал их, а вдалеке сияние, пробивающееся сквозь увядшее священное древо, мигнуло несколько раз."
  - char: "unzen_s"
    side: "left"
    text:
      - "Выжившие успешно перемещены."
      - "Теперь..."
  - text:
      - "Но не успела она облегчённо вздохнуть, как знакомый гул моторов вновь заставил её насторожиться."
  - char: "unzen_s"
    side: "left"
    text:
      - "Самолёты?"
  - text:
      - "Палубные машины с трудом удерживали равновесие в воздухе, но вскоре потеряли управление и рухнули вниз."
  - char: "unzen_s"
    side: "left"
    text:
      - "Прилетели с той стороны?.."
  - text:
      - "Ступив на чёрную «морскую гладь», она на полной скорости устремилась вперёд."

chapter2:
  rows:
  - char: "zuihou"
    side: "left"
    text:
      - "Связь с самолётами потеряна!"
      - "Боевых машин в запасе больше не осталось..."
  - char: "owari"
    side: "right"
    text:
      - "Отсиживаться здесь тоже не дело, похоже, придётся искать выход самим."
      - "Но сперва нужно разобраться с сиюминутной бедой."
  - char: "zuihou"
    side: "left"
    text:
      - "Что-то приближается!"
  - char: "owari"
    side: "right"
    text:
      - "Направление?"
  - char: "zuihou"
    side: "left"
    text:
      - "На шесть часов!"
  - char: "owari"
    side: "right"
    text:
      - "Что, прямо за спиной?!"
  - text:
      - "Башни главного калибра развернулись."
  - char: "owari"
    side: "right"
    text:
      - "Залп!"
  - text:
      - "Дзынь!..."
      - "Снаряд отскочил рикошетом, пороховой дым рассеялся."
  - char: "nop"
    side: "left"
    text:
      - "Кх-кх..."
  - char: "owari"
    side: "right"
    text:
      - "Что, там кто-то есть?!"
  - char: "nop"
    side: "left"
    text:
      - "Не слишком ли пышное приветствие?"
  - text:
      - "Она убрала клинок в ножны, на лезвии которых всё ещё виднелся неглубокий след от попадания."
  - char: "zuihou"
    side: "right"
    text:
      - "Ой, искренне прошу прощения!"
  - char: "owari"
    side: "left"
    text:
      - "...Прости, а кто ты?.."
  - text:
      - "В памяти вновь всплыли смутные картины."
  - char: "owari"
    side: "left"
    text:
      - "Великий... Мудрец?.."
  - char: "unzen_s"
    side: "right"
    text:
      - "Ваших подруг я уже перенесла в безопасное место. Вам тоже нужно поскорее присоединиться к ним."
      - "То место — последняя чистая земля в этом пространстве, и остатков моих сил должно хватить, чтобы защитить вас."
  - text:
      - "Прямо над головами девушек опустился столп света."
      - "Но, в отличие от прошлого раза, луч лишь дёрнулся несколько раз и тут же погас."
  - char: "zuihou"
    side: "left"
    text:
      - "...Световой сигнал?.."
  - char: "unzen_s"
    side: "right"
    text:
      - "Слишком много сил ушло за раз?.. Или всё же расстояние слишком велико..."
      - "Нет времени объяснять, я лично проведу вас."
      - "Идите за мной."
