chapter1:
  rows:
  - text:
      - "Когда синий поток накрыл их, разум девушек прояснился, и они вспомнили всё."
      - "Скользя по этому потоку, словно по водному пути, они оставили Астральную Башню позади."
  - char: "bennington"
    side: "left"
    text:
      - "Что вообще здесь происходит?!"
  - text:
      - "Астрариум изменился."
      - "Разрозненные районы беспорядочно перемешались, словно перепутанные кусочки пазла."
      - "Небоскрёбы пронзали водные каналы, а на верхушках деревьев громоздились валуны. Возвышающиеся здания соседствовали с руинами."
      - "Чёрная вязкая жидкость, похожая на сырую нефть, сочилась из всех швов и трещин, разливаясь по улицам города тёмным океаном."
      - "Орды бесформенных чёрных теней блуждали повсюду, словно выискивая добычу."
  - char: "john_rodgers"
    side: "left"
    text:
      - "Ого... Что стряслось с городом?!"
  - char: "bennington"
    side: "right"
    text:
      - "Астрариум всегда был городом аномалий... Возможно, именно так выглядит его истинный облик."
  - char: "harrison"
    side: "left"
    text:
      - "Кажется, будто я спала... Я была просто обычной девушкой — не самой собой."
      - "Мы ведь девушки-корабли. Как мы могли забыть нечто настолько важное?"
  - char: "john_rodgers"
    side: "right"
    text:
      - "А Ричард стоит за всем этим... Хуже того, у неё есть сила уничтожить весь город."
      - "Мы обязаны остановить её... Давайте выполним это задание и вернёмся домой в целости и сохранности!"
  - char: "harrison"
    side: "left"
    text:
      - "Именно это я и собираюсь сделать! Что до трёх поставщиков, кого из них мы поищем первым?"
  - char: "bennington"
    side: "right"
    text:
      - "Начнём с гениального механика Сообразительный. В конце концов, именно она одолжила нам тех роботов!"
      - "Какое прикрытие может быть лучше целой армии роботов?"

chapter2:
  rows:
  - text:
      - "БАБАХ!!!"
  - char: "soobrazitelny_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Ха-ха-ха-а-а! Слабо! Слишком слабо! Трепещите перед моим легионом машин!"
  - text:
      - "Посреди хаотичного океана оставался один маленький островок порядка."
      - "Как бы гротескная орда ни пыталась атаковать, всех их ждало лишь одно — уничтожение."
  - char: "soobrazitelny_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Так значит, Астрариум наконец докатился до такого..."
      - "Полагаю, в конечном счёте это было неизбежно."
      - "Поверить не могу, что даже я угодила в эту ловушку под названием «комфорт»..."
      - "И впрямь жутко."
  - text:
      - "БАБАХ!!!"
      - "Гениальный механик взглянула вверх и заметила три приближающиеся издалека фигуры."
      - "Они уверенно и без колебаний двигались прямо к ней."
  - char: "bennington_rad"
    side: "left"
    text:
      - "Говорит Беннингтон, авианосец типа «Эссекс», на общем канале связи!"
      - "Алло? Гениальный механик Сообразительный, ты меня слышишь? Город в реальной опасности, и ему нужна твоя помощь!"

chapter3:
  rows:
  - char: "soobrazitelny_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "Хм-м... Маскировка должна была рухнуть вместе с городом."
      - "Какие занятные девчонки."
  - char: "communicator"
    side: "right"
    text:
      - "ПИК-ПИК!"
  - char: "soobrazitelny_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "Сообразительный на связи. Приятно видеть нормальных людей посреди всего этого хаоса!"
      - "Я с вами. Если у вас есть план — ведите!"

chapter4:
  rows:
  - text:
      - "Здесь, под лунным светом, царила тишина."
      - "Хаос города ещё не добрался до этого района, оставляя магазинчик мирным уголком... пока что."
      - "Очаровательная хозяйка лавки, вооружённая до зубов, тихо сидела у входа и смотрела на луну."
  - char: "saratoga_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Сегодня — повторение вчерашнего..."
      - "И завтра будет то же самое."
      - "Если всё это сон..."
  - text:
      - "БАБАХ!!!"
      - "Звуки боя подобрались ближе."
  - char: "saratoga_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Я — Саратога."
      - "Саратога из Первой оперативной группы сил Совета. Та, кого ты ждала."
      - "Значит, мне пора вступить в бой."
      - "Прощай, Ричард..."
  - text:
      - "Она заперла дверь на маленький навесной замок."
      - "Витрина лавки опустела, пока сражение вдалеке набирало обороты."

chapter5:
  rows:
  - text:
      - "Благодаря разведке палубной авиации отряду удалось продвинуться вперёд сквозь перемешавшееся пространство."
      - "В конце концов они добрались до места, где должна была находиться «PM Плаза»."
      - "Однако площадка пустовала, а хозяйки магазина нигде не было видно."
  - char: "harrison"
    side: "left"
    text:
      - "Памяти Меркурия так никто и не видел с того самого дня..."
  - char: "bennington"
    side: "right"
    text:
      - "Раз мы не можем её найти, то ничего не поделаешь. Нам нужно возвращаться к Астральной Башне."
      - "Кто знает, насколько плохо там идут дела?!"
  - text:
      - "Искажённое пространство вновь принялось перестраиваться."
      - "По чьему-то умыслу или по чистой случайности, перед ними открылся прямой проход к Астральной Башне."
  - char: "john_rodgers"
    side: "left"
    text:
      - "А? Неужели Память создала этот проход для нас?!"
  - char: "harrison"
    side: "right"
    text:
      - "Спасибо, Память Меркурия!"
  - text:
      - "Ответа не последовало."
      - "Лишь чей-то пристальный взгляд молча наблюдал издалека, пока флот скрывался вдали."
