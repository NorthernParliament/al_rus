chapter1:
  rows:
  - char: "bennington"
    side: "left"
    text:
      - "Йа-а-а-ХУ-У-У! Полный вперёд!"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Хе-хе! На прямых всё решает чистая мощность машины, так что пока я уступлю тебе лидерство!"

chapter2:
  rows:
  - char: "bennington"
    side: "left"
    text:
      - "Почему на городской кольцевой столько поворотов?!"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Может, её специально так спроектировали, чтобы было сложнее и веселее? Зацени эту череду дрифтов!"
  - char: "bennington"
    side: "left"
    text:
      - "Она обошла меня с такой лёгкостью?! Ч-чёрт, ну и скорость!"

chapter3:
  rows:
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Финишный спурт, мисс видеоблогер~"
      - "Ой... Она уже скрылась из виду."
      - "Похоже, лёгкая победа за мной!"

chapter4:
  rows:
  - text:
      - "Так эта оживлённая гонка подошла к концу."
      - "Ричард на какое-то время отстала из-за более низкой максимальной скорости её машины."
      - "Однако её безупречное вождение позволило ей вырваться далеко вперёд после череды крутых поворотов."
      - "И хотя Беннингтон какое-то время удерживала лидерство, её ошибки на тех же поворотах сбили темп, из-за чего в итоге она финишировала лишь девятой."
  - char: "bennington"
    side: "left"
    text:
      - "А-а-аргх, я продула!"
      - "Ричард, ты водишь даже лучше профессионалов..."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Хе-хе~ Это всего лишь хобби."
      - "Профессор, как там Жёлтый? Ему хватило опасности на сегодня?"
  - char: "commander"
    side: "left"
    text:
      - "Ну..."
  - char: "administrator_yellow"
    side: "right"
    text:
      - "Ывапролдж..."
  - char: "commander"
    side: "left"
    text:
      - "Он упал в обморок на середине заезда."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Э-э-эй, очнись!"
  - char: "administrator_yellow"
    side: "left"
    text:
      - "Угх... Где я... А-а-а-а, вы сейчас врежетесь! Хватит... Мы все умрё-ё-ём!"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Эй-эй, ты в безопасности! Гонка уже давно закончилась."
      - "Удалось хоть раз почувствовать опасность?"
  - char: "administrator_yellow"
    side: "left"
    text:
      - "К-к-конечно! *всхлипывает*... Было так страшно, я думал, что умру!"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Но ты ведь не умер."
      - "За время гонки не случилось вообще ничего плохого. Чувствуешь, как накатывает облегчение?"
  - char: "administrator_yellow"
    side: "left"
    text:
      - "Так вот что это такое... облегчение? Вот каково это — чувствовать себя в безопасности... Я ДЕЙСТВИТЕЛЬНО это чувствую."
      - "Но сможет ли ваша служба безопасности..."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Служба безопасности и так отлично справляется. В конце концов, мы наймём ту же самую команду, которая охраняла эту гонку~"
  - char: "bennington"
    side: "left"
    text:
      - "А? Правда?!"
  - char: "vicksburg"
    side: "right"
    text:
      - "Понятно... Неудивительно, что все эти патрульные роботы показались мне знакомыми."
  - char: "commander"
    side: "left"
    text:
      - "Разве мы не вчера только решили участвовать в гонке?"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Я договорилась обо всём за ночь! Сила денег решает множество проблем."
  - char: "administrator_yellow"
    side: "left"
    text:
      - "Та же самая служба безопасности... В таком случае вы сдали!"

chapter5:
  rows:
  - text:
      - "Таким образом, мы заполучили последнее необходимое нам разрешение."
      - "Теперь у нас были разрешение на выступление, разрешение на сценическое оборудование, разрешение на костюмы, разрешение на рекламу И разрешение на службу безопасности."
      - "Больше ничто не стояло между нами и концертом."
  - char: "bennington"
    side: "left"
    text:
      - "Ох, слава небесам..."
  - char: "john_rodgers"
    side: "right"
    text:
      - "Ну и морока же это была. Я просто рада, что всё закончилось!"
  - char: "vicksburg"
    side: "left"
    text:
      - "Теперь нам остаётся только официально подать заявку на проведение концерта и дождаться одобрения Астральной Башни."
      - "И... провести нашу генеральную репетицию, разумеется!"
  - char: "collett_rad"
    side: "right"
    text:
      - "Нам также понадобится составить чёткий план действий."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Всё это может подождать до завтра."
      - "Давайте проведём остаток дня, отрываясь на полную катушку!"
      - "В какой ресторан пойдём? Есть пожелания?"
  - char: "harrison"
    side: "right"
    text:
      - "Если хотите отпраздновать, то что если мы вместо этого отправимся в убежище?"
      - "В последнее время ты потратила на нас кучу денег... Почему бы нам с Роджерс не приготовить ужин для тебя?"
  - char: "john_rodgers"
    side: "left"
    text:
      - "Вот именно! Предоставьте всю готовку мне! Э-э... То есть мне и сестрёнке!"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "О-о-о! Тогда мы с Профессором будем ждать, затаив дыхание~"
      - "Профессор, пойдём за продуктами!"
      - "Вечеринка~ Вечеринка~"
  - text:
      - "Глядя на девушек, идущих по озарённой закатом золотой дорожке, я ловлю себя на одной мысли."
  - char: "commander"
    side: "left"
    text:
      - "Все приготовления прошли гладко. Надеюсь лишь, что это приблизит нас к возвращению утраченной записи."
      - "Закончится ли всё это тогда?.."
