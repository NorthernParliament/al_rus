chapter1:
  rows:
  - text:
      - "Когда на следующий день мы пришли в «PM Плазу», Памяти нигде не было видно."
      - "На прилавке лежали разрешение на костюмы и двадцать сценических нарядов."
      - "Рядом с ними была оставлена записка."
  - char: "pamiat_merkuria_pick_rad"
    side: "right"
    text:
      - "Обо всём позаботилась! И костюмы теперь полностью ваши. Удачи на шоу! Буду болеть за вас."
  - char: "john_rodgers"
    side: "left"
    text:
      - "А? Всё оказалось настолько просто?.."
  - char: "bennington"
    side: "right"
    text:
      - "Как-то даже не верится... Прошлой ночью явно должно было произойти что-то такое, что заставило эту администраторшу передумать!"
  - char: "collett_rad"
    side: "left"
    text:
      - "Экстренные новости. Зацените."
  - text:
      - "Робот-кот проецирует в воздух выпуск новостей."
  - char: "vicksburg"
    side: "left"
    text:
      - "Сегодня рано утром в Метрополисе произошёл взрыв газа, серьёзно повредивший офисное здание."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "А! Разве это не то самое здание, куда мы ходили буквально вчера?!"
  - char: "bennington"
    side: "left"
    text:
      - "Ночью взрывается газ, а на следующий день мы за просто так получаем разрешение... Не думаю, что это совпадение."
      - "Неужели... А-а-ах! Народ, посмотрите вокруг! Магазин исчез!"
  - char: "john_rodgers"
    side: "right"
    text:
      - "А? «PM Плаза» пропала?!"
  - text:
      - "Вся плаза растворилась в воздухе, словно её здесь никогда и не было."
  - char: "bennington"
    side: "left"
    text:
      - "Без сомнений... Это точно новая аномалия!"
      - "Эх, чёрт! Жаль, что я не включила камеру!"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Какая досада. Упустили такие первоклассные кадры!"
  - char: "bennington"
    side: "left"
    text:
      - "Ничего страшного. Пока мы в Астрариуме, скоро наверняка подвернутся новые возможности."
  - char: "vicksburg"
    side: "right"
    text:
      - "Кстати говоря, в последнее время аномалии в этом городе происходят всё чаще..."
      - "Эссекс каждый день по уши в делах. Мы почти не видимся с ней, если только не поздней ночью."
  - char: "harrison"
    side: "left"
    text:
      - "Отличная работа, девочки."
      - "Если отбросить всё это безумие, мы наконец-то заполучили разрешение на костюмы."
      - "Остались только разрешение на рекламу и разрешение на службу безопасности."
  - char: "john_rodgers"
    side: "right"
    text:
      - "Осталось два... Кажется, будто этому конца и края нет!"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Но ведь в днях, полных приготовлений, есть своя прелесть, разве не так?"
      - "Подумайте об этом так: ещё два поручения — и мы готовы!"
  - char: "bennington"
    side: "right"
    text:
      - "Останется только сам концерт и грандиозное расследование в Астральной Башне. Жду не дождусь!"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Я тоже~"
      - "А теперь, думаю, самое время отпраздновать. Мисс детектива мы, разумеется, тоже позовём!"
