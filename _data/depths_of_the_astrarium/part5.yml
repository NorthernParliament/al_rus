chapter1:
  rows:
  - text:
      - "Убежище наполняется задорным смехом."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Пф-ф-ха-ха... «Шокирующие подробности! Вся правда о ночной жизни мегаполиса»..."
      - "Да уж, ничего не скажешь! Вот это сенсация!"
      - "Для детектива ты пишешь точь-в-точь как автор жёлтой прессы!"
  - text:
      - "Ричард заливается смехом, читая отчёт о расследовании на столе Эссекс."
  - char: "essex_detective"
    side: "left"
    text:
      - "Э-это не я писала! Это просто справочный материал!"
      - "..Кстати, Ричард, разве ты не говорила что-то про официальный договор о неразглашении?"
      - "Уже поздно. Почему бы нам не составить его и не пойти отдыхать?"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "А? Сколько сейчас времени... Ой! Профессор, посмотри!"
  - text:
      - "Она обращает моё внимание на аномалию со временем."
      - "Когда мы покинули переулок, должен был наступить уже час ночи, но с тех пор стрелки так и не сдвинулись."
  - char: "essex_detective"
    side: "left"
    text:
      - "Без специального разрешения время не перейдёт к следующему часу, пока не будут выполнены определённые действия."
      - "В нашей ситуации, без «ночного» разрешения, продвинуть время вперёд сможет только сон."
  - char: "commander"
    side: "right"
    text:
      - "Вот как это устроено... Звучит до жути удобно для тех, кому нужно закончить работу, а?"
      - "Любые 24-часовые сутки можно было бы растянуть на целых 240 часов..."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Фу-у... Ты хоть о чём-нибудь, кроме работы, думаешь?"
  - char: "essex_detective"
    side: "right"
    text:
      - "Хе-хе... В теории это сработало бы, но за явные злоупотребления системой предусмотрены штрафы."
      - "Чем дольше ты остаёшься в одном временном промежутке, тем больше аномалий начинает возникать вокруг. Тот переулок — это ещё цветочки, всё может стать куда хуже."
  - char: "commander"
    side: "left"
    text:
      - "Значит, нарушить правила — всё равно что нажить врага в лице самого города?"
  - char: "essex_detective"
    side: "right"
    text:
      - "В сущности, да."
  - char: "commander"
    side: "left"
    text:
      - "И местным жителям приходится соблюдать эти правила каждый день?"
  - char: "essex_detective"
    side: "right"
    text:
      - "Можно сказать и так... но не совсем. Хоть правил и предписаний великое множество, почти никто из горожан даже не замечает их существования."
      - "Они едят, когда хотят, работают, когда хотят, и спят, когда хотят. Вот и вся их жизнь."
  - char: "commander"
    side: "left"
    text:
      - "Хм... Значит, правила влияют на людей, даже если те этого не осознают. Но постой, почему же они не подействовали на нас?"
  - char: "essex_detective"
    side: "right"
    text:
      - "Может, потому что вы двое первоклассный детектив и ассистент, совсем как я."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Жуть какая... Поверить не могу, что это место рекламировали как город грёз."
  - char: "essex_detective"
    side: "right"
    text:
      - "Если не считать этого, по-моему, город не так уж плох."
      - "Осмотритесь здесь завтра днём, и вы, возможно, измените своё мнение."
      - "А пока... я бы посоветовала готовиться ко сну."
      - "*зевает* Я сейчас слишком хочу спать."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Мне вдруг тоже жутко захотелось спать... *зевает*... Почему?"
  - char: "essex_detective"
    side: "right"
    text:
      - "Должно быть, это последнее предупреждение от города — знак, что мы слишком засиделись в одном временном отрезке."
      - "Если мы и дальше будем противиться его воле, он нашлёт на нас аномалии."
  - char: "commander"
    side: "left"
    text:
      - "Последнее предупреждение, значит?"
  - text:
      - "Как ни странно, мне спать не хочется так сильно, как им. На душе настолько неспокойно, что я чувствую лишь нарастающую тревогу."
      - "Будто что-то затаилось поблизости и готово напасть в любую секунду."
  - char: "commander"
    side: "left"
    text:
      - "Пожалуй, лучше не идти наперекор сценарию."
      - "Ладно... Пойдём спать."
