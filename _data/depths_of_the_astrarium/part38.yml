chapter1:
  rows:
  - text:
      - "Грёза под неоновыми огнями рассыпалась в прах."
      - "Когда Мисс D пробила окно, она также сорвала фальшивые иллюзии, окутывавшие Астральную Башню, обнажив тем самым истинный облик Астрариума."
  - char: "commander"
    side: "left"
    text:
      - "Обветшалый и опустошённый..."
      - "Аномалии здесь никогда не были аномалиями... сквозь них просто просачивалась истинная суть города."
      - "Его процветание было лишь иллюзией. Вот он — настоящий Астрариум."
  - text:
      - "Магический круг под городом загорается и поднимается в небо."
      - "Все, кто сражался в городе, поднимаются вместе с ним на высоту кабинета генерального директора."
      - "Мисс D цепляется за меня, как коала. Беннингтон, Виксберг, Харрисон и Джон Роджерс тоже здесь."
      - "А вместе с ними — Сообразительный META, Саратога META и Эссекс META."
      - "Однако Памяти, Бристоль и Коллетт нигде нет."
  - char: "commander"
    side: "left"
    text:
      - "Значит, вы все всё-таки META... Вы хорошо маскировались."
  - char: "essex_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Давненько не виделись, Командир. В прошлый раз мы встречались в горах Анкориджа."
  - char: "commander"
    side: "left"
    text:
      - "Ты помнишь всё это? Если так... кто же ты на самом деле?"
  - text:
      - "Неужели она действительно та самая Эссекс, которая сотрудничала с «Пеплом»?"
      - "Это первый раз, когда я вижу её бодрствующей с тех пор, как она впала в кому во время инцидента «идеального будущего»."
      - "Ну, если, конечно, не считать всех тех случаев за последние дни, когда я видел её в роли детектива."
  - char: "essex_meta"
    side: "right"
    status: "is-meta"
    text:
      - "В моей голове всё ещё полная каша..."
      - "Но думаю, мне и впрямь удалось пережить то событие."
      - "Как я не знаю, как попала в этот город, так и не представляю, что произошло после того, как меня поглотила векторная зона..."
  - char: "commander"
    side: "left"
    text:
      - "Понятно... Что ж, главное, что с тобой всё в порядке. С остальным мы со временем разберёмся."
      - "А что насчёт Бристоль и Коллетт?"
  - char: "essex_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Полагаю, легендарный следователь залегла на дно. Что же до Коллетт, то... мне жаль это говорить."
  - char: "commander"
    side: "left"
    text:
      - "Я понимаю. Ты знаешь что-нибудь о двух других поставщиках?"
  - char: "essex_meta"
    side: "right"
    status: "is-meta"
    text:
      - "У обеих, так уж вышло, хватает собственных проблем."
      - "Одна утверждает, что состоит в Первой оперативной группе Совета, но не узнаёт ни меня, ни Энтерпрайз."
      - "Другая говорит, что она из организации под названием «Рассвет», но я никогда о такой не слышала..."
  - char: "commander"
    side: "left"
    text:
      - "(«Рассвет»?!..)"
  - char: "essex_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Не думаю, что сейчас подходящее время зацикливаться на этом."
      - "К тому же посреди такого хаоса толком и не поразмыслишь."
  - text:
      - "Эссекс смотрит на Ричард, парящую вдалеке."
  - char: "bon_omm_richard1"
    side: "right"
    status: "is-yellow"
    text:
      - "Мне нужно ещё немного времени, чтобы приготовиться, так что чувствуйте себя как дома!"
  - text:
      - "Она улыбается и машет рукой."
  - char: "commander"
    side: "left"
    text:
      - "Ричард сейчас под действием каких-то ограничений... похоже, она не сможет использовать свою истинную силу, пока кто-нибудь добровольно не отдаст ей мастер-запись."
  - char: "essex_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Где она сейчас?"
  - char: "commander"
    side: "left"
    text:
      - "Она у меня. Но... у неё есть способность подчинять людей своими словами."
      - "Лучше одолеть её как можно скорее."
  - char: "essex_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Согласна."
  - char: "commander"
    side: "left"
    text:
      - "И ещё кое-что: ты можешь связаться с Энтерпрайз?"
      - "Если бы мы только могли заручиться её помощью..."
  - char: "essex_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Прости, но это невозможно."
  - char: "commander"
    side: "left"
    text:
      - "Я так и думал, что ты это скажешь."

chapter2:
  rows:
  - text:
      - "Решив сразиться с Ричард прямо сейчас, каждая из девушек начинает атаковать противника."
      - "БАБАХ!!!"
  - char: "bennington"
    side: "left"
    text:
      - "Бабах! Ты окружена, Ричард!"
  - char: "vicksburg"
    side: "right"
    text:
      - "Пожалуйста, просто сдайся, Ричард!"
  - text:
      - "Армия тёмных теней хрупка, как и прежде: каждая рассыпается от одного-единственного удара."
      - "Её неспособность призвать более сильных врагов лишь подтверждает её нынешнюю слабость."
  - char: "john_rodgers"
    side: "left"
    text:
      - "Ты правда... так долго водила нас за нос!"
      - "*шмыгает носом*... Ты зашла слишком далеко!"
  - char: "harrison"
    side: "right"
    text:
      - "Видишь, что ты натворила, Ричард?"
  - char: "bon_omm_richard1"
    side: "left"
    status: "is-yellow"
    text:
      - "Хе-хе... Простите. У меня есть свои причины."
      - "Но если вы просто отдадите мне диск, обещаю, все вернутся домой целыми и невредимыми. Что скажете?"
  - char: "bennington"
    side: "right"
    text:
      - "Ха-ха! С чего бы нам это делать, если преимущество на нашей стороне?"
  - char: "bon_omm_richard1"
    side: "left"
    status: "is-yellow"
    text:
      - "Верно. Я не могу вернуть силу без этого диска, и именно поэтому вы пытаетесь одолеть меня прямо сейчас. Разве не так, Профессор?"
      - "Но взгляните повнимательнее. Похоже ли, что я получила хоть какой-то урон?"
  - char: "commander"
    side: "right"
    text:
      - "......"
  - text:
      - "Несмотря на непрерывные атаки с самого начала боя, Ричард абсолютно невредима. Её одежда и волосы даже не растрепались."
      - "Она лишь с улыбкой наблюдает за бушующей битвой, словно спокойно чего-то выжидая."
  - char: "commander"
    side: "left"
    text:
      - "Чего ты ждёшь?"
  - char: "bon_omm_richard1"
    side: "right"
    status: "is-yellow"
    text:
      - "Когда спадут мои ограничения, разумеется~"
      - "Да брось. Ты ведь не думал, что я сделаю так, чтобы не смочь освободиться самой, правда?"
  - char: "commander"
    side: "left"
    text:
      - "Я знаю это. Поэтому..."
  - char: "bon_omm_richard1"
    side: "right"
    status: "is-yellow"
    text:
      - "Вы слишком слабы~ Прости, Профессор, но ты проиграл!"

chapter3:
  rows:
  - char: "bon_omm_richard"
    side: "right"
    status: "is-gray"
    text:
      - "Хи-хи-хи-хи-хи!"
      - "Позвольте представиться заново! Я — Бон Омм Ричард, и вы полностью окружены... мной!"
  - char: "commander"
    side: "left"
    text:
      - "Чёрт!"
  - text:
      - "Магический круг разбивается вдребезги, и все мы начинаем падать."
  - char: "miss_d"
    side: "left"
    text:
      - "А-А-А-А-А-АХ!"

chapter4:
  rows:
  - text:
      - "Когда Мисс D удерживает меня от падения, я наконец могу разглядеть, что происходит вокруг."

chapter5:
  rows:
  - char: "soobrazitelny_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Продвижение «Кометы» ускоряется..."
  - text:
      - "Сообразительный пытается стабилизировать своё положение в воздухе с помощью меха."
  - char: "bon_omm_richard"
    side: "right"
    status: "is-gray"
    text:
      - "Ты опоздала, гениальный механик!"
      - "Бах!"
  - text:
      - "Ричард складывает пальцы правой руки в виде пистолета. Внезапно Сообразительный и вся её армия роботов обращаются в пепел."
  - char: "commander"
    side: "left"
    text:
      - "Что?!"

chapter6:
  rows:
  - char: "saratoga_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Ричард, ты..."
  - text:
      - "Саратога отпускает контроль над своими самолётами и молча смотрит на приближающегося врага."
  - char: "bon_omm_richard"
    side: "right"
    status: "is-gray"
    text:
      - "Спокойной ночи, Сара."
      - "Бах!"
  - text:
      - "Она тоже обращается в пепел вместе со своими самолётами."
  - char: "commander"
    side: "left"
    text:
      - "Я должен что-то с этим сделать..."

chapter7:
  rows:
  - char: "bon_omm_richard"
    side: "right"
    status: "is-gray"
    text:
      - "Подглядывать со стороны не очень-то честно, легендарный следователь!"
  - text:
      - "Чёрный ветер проносится сквозь светящихся мотыльков, очерчивая силуэт скрывающейся фигуры."
  - char: "bristol_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Х-ха-ха-ха... Похоже, ты нашла меня."
  - char: "bon_omm_richard"
    side: "right"
    status: "is-gray"
    text:
      - "Никто не любит незваных гостей, знаешь ли."
  - char: "bristol_meta"
    side: "left"
    text:
      - "Тогда мне лучше откланяться..."
  - char: "bon_omm_richard"
    side: "right"
    status: "is-gray"
    text:
      - "Бах!"
  - text:
      - "Бристоль обращается в рой мотыльков, но они тут же превращаются в пепел. Лишь немногим из них удаётся скрыться в далёком тумане."

chapter8:
  rows:
  - char: "bon_omm_richard"
    side: "right"
    status: "is-gray"
    text:
      - "Ты следующая, мисс детектив."
  - text:
      - "Ричард возникает рядом с Эссекс, словно призрак."
  - char: "essex_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Что ты вообще пытаешься здесь сделать?"
      - "Это мой сон? Или..."
  - char: "bon_omm_richard"
    side: "right"
    status: "is-gray"
    text:
      - "Бах!"
  - char: "essex_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Не бывать этому!"
  - text:
      - "Две тёмные силы сталкиваются. После короткой борьбы Эссекс с силой впечатывается в лежащие внизу руины."

chapter9:
  rows:
  - char: "bon_omm_richard"
    side: "right"
    status: "is-gray"
    text:
      - "Хе-хе, а дальше у нас..."
  - text:
      - "Ричард переводит взгляд на флот Беннингтон."
  - char: "commander"
    side: "left"
    text:
      - "Им не выдержать её атак!"
      - "Ох... Точно!"

chapter10:
  rows:
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Поняла. D, помоги нам приблизиться к цели. Дальше мы сами."
  - char: "miss_d"
    side: "right"
    text:
      - "Сколько раз мне повторять?! Без кита ничего не выйдет! Даже не надейся!"
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Ладно. Тогда я сделаю это за тебя."
      - "Перенаправление ресурсов, режим передачи данных."

chapter11:
  rows:
  - char: "rodney_meta_1"
    side: "left"
    status: "is-lightgray"
    text:
      - "?.."
  - char: "miss_d"
    side: "right"
    text:
      - "А-а? Что происходит? Воу, воу, воу!"

chapter12:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Мисс D! Тогда в Мартириуме ты говорила, что не сможешь подобраться к Родни без своего кита."
      - "Теперь, когда кит у тебя, ты сможешь использовать его, чтобы спасти всех?!"
  - char: "miss_d"
    side: "right"
    text:
      - "Хм-м... Я попробую!"
      - "Но держи Ричард подальше, иначе она поймает меня!"
  - char: "commander"
    side: "left"
    text:
      - "Значит, мне нужно её отвлечь?"
      - "(Другого выхода нет, раз уж к ней вернулась её сила.)"
      - "(Надеюсь, этого всё ещё хватит, чтобы приманить её...)"
      - "Подбрось это в воздух изо всех сил!"
  - text:
      - "Мисс D подбрасывает диск с мастер-записью высоко в небо. Как и ожидалось, Ричард устремляется за ним."
  - char: "commander"
    side: "left"
    text:
      - "Сейчас! Давай спасём их!"
