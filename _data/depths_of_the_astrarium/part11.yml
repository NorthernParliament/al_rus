chapter1:
  rows:
  - text:
      - "За столиком у окна мы официально знакомимся с фан-клубом Виксберг."
  - char: "vicksburg"
    side: "left"
    text:
      - "Девочки, представьтесь, пожалуйста, глубокоуважаемому Профессору-детективу и его ассистентке!"
  - char: "john_rodgers"
    side: "right"
    text:
      - "Я Джон Роджерс, глава этого фан-клуба!"
      - "Для нас большая честь познакомиться с вами, Рич... то есть с Профессором-детективом и его ассистенткой!"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Можешь называть меня просто по имени. Всё равно тайное уже стало явным..."
  - text:
      - "Наконец-то она сдаётся."
  - char: "harrison"
    side: "left"
    text:
      - "Хе-хе. Я Харрисон, старшая сестра Роджерс и вице-председатель фан-клуба. Спасибо за заботу о моей младшей сестре."
  - char: "john_rodgers"
    side: "right"
    text:
      - "Да ладно тебе, мы ведь едва познакомились..."
  - char: "harrison"
    side: "left"
    text:
      - "Роджерс очень хорошая девочка. Просто временами ей трудно быть честной с самой собой."
  - char: "john_rodgers"
    side: "right"
    text:
      - "А-а-аргх, сестрёнка! Ты можешь не говорить такие вещи людям, которых мы только что встретили?!"
  - char: "harrison"
    side: "left"
    text:
      - "Ой, ну ладно."
  - char: "bennington"
    side: "right"
    text:
      - "Ха-ха-ха! Забавные они, правда?"
      - "Приветик, я Беннингтон! Фанатка влогов и пиарщица фан-клуба!"
      - "Я как раз снимала видео в соседнем здании и сегодня утром видела вас двоих издалека."
      - "Так что для них это первая встреча с вами, а для меня формально уже вторая."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Я заметила. Рада новой встрече, мисс видеоблогер!"
  - char: "bennington"
    side: "right"
    text:
      - "Ого... Какая потрясающая наблюдательность!"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Хе-хе, спасибо!"
  - text:
      - "Как и ожидалось, группа Виксберг захотела получить от неё больше наставлений и с радостью согласилась помочь нам в поисках вора, похитившего мастер-запись."
      - "Ричард достала контракт буквально из ниоткуда и выложила на стол, где документ тут же был подписан."

chapter2:
  rows:
  - text:
      - "Аромат жареного мяса витал по ресторану, оформленному в стиле Железной Крови."
      - "В отличие от Виксберг, тщательно следившей за фигурой, Ричард ничуть не стеснялась плотно и с аппетитом поесть."
  - char: "bennington"
    side: "left"
    text:
      - "Ты такая милая, когда кушаешь... Можно я немного поснимаю тебя?"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Конечно! Но сначала я хочу взглянуть на видео, прежде чем ты его выложишь, договорились?"
  - text:
      - "Казалось, Ричард совершенно не заботило то, что могло повлиять на её публичный образ, и, что поразительно, никого это не удивляло."
  - char: "vicksburg"
    side: "left"
    text:
      - "Значит, вот какие они — ассистентки детективов... Беззаботные, но втайне способные на всё?"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Хе-хе, звучит очень похоже на правду!"

chapter3:
  rows:
  - char: "essex_detective"
    side: "left"
    text:
      - "Говорят, лучше никогда не встречаться со своими кумирами..."
      - "Но этот случай, похоже, скорее исключение."
  - text:
      - "Появилась неожиданная гостья."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Добрый вечер, мисс детектив! Считать это за комплимент? Да знаю я, что милашка!"
  - char: "commander"
    side: "right"
    text:
      - "Мы как раз собирались пойти искать тебя после ужина. Какая удача."
  - char: "essex_detective"
    side: "left"
    text:
      - "Я постоянная посетительница этого ресторана, так что это скорее мне повезло."
      - "Что вам нужно? Появились новые аномалии?"

chapter4:
  rows:
  - char: "essex_detective"
    side: "left"
    text:
      - "Поддельная личность и убежище... Ладно. Я знаю кое-кого, кто может с этим помочь."
      - "К тому же она обожает местную еду. Уверена, она появится здесь ещё до того, как..."
      - "О, легка на помине."
  - text:
      - "В ресторан въезжает сферический робот с кошачьими ушками, подхватывает упакованный заказ и, покачиваясь, увозит его за собой."
  - char: "commander"
    side: "left"
    text:
      - "Эм... Это она?"
  - char: "essex_detective"
    side: "right"
    text:
      - "Точнее, это её дрон. Она специалист по безопасности в Нижнем городе."
      - "Я работала с ней пару раз и могу поручиться за её надёжность и широкий спектр навыков."
      - "Единственная загвоздка — её услуги могут влететь в копеечку..."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Хе-хе! Знаешь ли, я как бы очень обеспеченная особа!"
