chapter1:
  rows:
  - text:
      - "Утро наступило без происшествий."
      - "Все мы проснулись примерно в одно и то же время."
      - "Часовая стрелка уверенно указывала на семь."
      - "Быстро позавтракав, мы спросили у Эссекс кратчайший путь до отеля, в котором пропала мастер-запись."
      - "Мы с Ричард решили вернуться в отель и поискать в номере следы преступника."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Так, посмотрим... «Завтрак: черствый хлеб, сыр и вяленое мясо»."
      - "Дополнение: «Получив вчера зацепку, я повела Профессора в переулок, где мы разделились. Профессор НЕ забыл осмотреть место происшествия!»"
      - "Вот теперь сойдёт..."

chapter2:
  rows:
  - text:
      - "Из-за нависающего Верхнего города в Нижний почти не проникает естественный свет."
      - "Освещение здесь в основном зависит от установленной наверху системы ламп, чья яркость меняется в течение дня."
      - "Заросший парк передо мной окрашен в блекло-золотые тона, отчего вокруг веет запустением."

chapter3:
  rows:
  - char: "vicksburg???"
    side: "left"
    text:
      - "Это моя жизнь ♪"
      - "С каких пор я гонюсь за финалом ♪"
      - "Словно огненные искры, пляшущие в небесах ♪"
      - "Ярко сияющая судьба ♪"
  - text:
      - "Откуда то из-за деревьев доносится пение."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Ого, кто-то распевается..."
      - "Она поёт так здорово, что запросто могла бы стать профи!"
      - "Подожди здесь, Профессор. Я мигом!"
  - text:
      - "Ричард убегает вглубь деревьев, и мне ничего не остаётся, кроме как поспешить за ней."

chapter4:
  rows:
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Приветик! У тебя потрясающий голос! Расскажи о себе."
  - text:
      - "Она подходит к поющей девушке и завязывает с ней разговор."
  - char: "vicksburg"
    side: "right"
    text:
      - "А... Чего?! Мисс Ричард!"
      - "Я что, сплю?"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Ой."
  - text:
      - "Наше прикрытие снова сорвано."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Начинаю подозревать, что от этой маскировки толку мало."
  - char: "vicksburg"
    side: "right"
    text:
      - "Мисс Ричард, я твоя самая преданная фанатка! Я всегда буду поддерживать тебя!"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Ого, спасибочки!"
  - char: "vicksburg"
    side: "right"
    text:
      - "Эм... Прости, если это прозвучит нескромно, но кто это рядом с тобой?"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Это Профессор-детектив! А я сейчас его ассистентка, так что запомни хорошенько!"
      - "Так как тебя зовут?"
  - char: "vicksburg"
    side: "right"
    text:
      - "«Виксберг эффектно появляется на сцене!»"
      - "Шучу. Хе-хе. Меня зовут Виксберг, и я изо всех сил стараюсь стать айдолом!"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Понятно... Неудивительно, что ты так классно поёшь."
  - char: "vicksburg"
    side: "right"
    text:
      - "Ты слышала? Хе-хе... Ничего особенного в этом не было. Прости, что тебе пришлось это слушать."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Ну, совершенствоваться ещё есть куда."
      - "Но я знаю стиль, который подошёл бы тебе куда лучше. Хочешь попробовать?"
  - text:
      - "Судя по всему, одним приветствием она ограничиваться не собиралась — и уже вовсю принялась давать уроки по вокалу."
      - "Мне кажется, будто я открыл в Ричард новую сторону."
  - char: "commander"
    side: "left"
    text:
      - "(А? Разве я не должен был знать об этом раньше?)"

chapter5:
  rows:
  - char: "bennington"
    side: "left"
    text:
      - "Хе-хе~ На сегодня съёмки влога о Нижнем городе окончены! Пора проведать Виксберг."
      - "А? Кто это там с ней..."
