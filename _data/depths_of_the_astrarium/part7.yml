chapter1:
  rows:
  - text:
      - "Спустя некоторое время..."
  - char: "vicksburg"
    side: "left"
    text:
      - "Преодолевая все преграды до самого конца ♪"
      - "Воспоминания о том, как я выкладывалась на полную ♪"
      - "Нет таких ран, в которых не было бы смысла ♪"
      - "И тогда я увидела свет ♪"

chapter2:
  rows:
  - text:
      - "Когда песня смолкает, среди собравшихся на лужайке раздаются аплодисменты."
  - char: "harrison"
    side: "left"
    text:
      - "Это было потрясающе. Я аж прослезилась!"
  - char: "john_rodgers"
    side: "right"
    text:
      - "Виксберг, ты что-то изменила в своём пении?"
      - "Кто бы мог подумать, что такая мелочь полностью преобразит настроение всей песни?"
      - "На вчерашней репетиции ты эту технику не использовала..."
      - "Только не говори мне... Ты нашла крутого наставника?"
  - char: "bennington"
    side: "left"
    text:
      - "Это был кто-то из тех двоих, с кем ты недавно болтала?"
      - "Я мельком видела их, когда возвращалась со съёмок влога."
  - char: "john_rodgers"
    side: "right"
    text:
      - "А? К ней кто-то приходил, пока нас не было?"
      - "Неужели фан-клуб Виксберг наконец-то вырос?!"
  - char: "vicksburg"
    side: "left"
    text:
      - "А-а-а! Да вовсе нет! Это были никакие не фанаты..."

chapter3:
  rows:
  - char: "john_rodgers"
    side: "left"
    text:
      - "Хм... Погоди, что?"
      - "Ты встретила ТУ САМУЮ суперзвезду Бон Омм Ричард? И она даже провела для тебя урок?!"
  - char: "harrison"
    side: "right"
    text:
      - "Ого... Вот это да!"
  - char: "bennington"
    side: "left"
    text:
      - "А? Хочешь сказать, та девушка была Ричард?!"
      - "Надо было побежать за ней и сфоткаться вместе..."
      - "А-а-аргх, этот влог набрал бы бешеные просмотры!"
  - char: "john_rodgers"
    side: "right"
    text:
      - "Нет-нет! Забудьте о том, как это круто или сколько бы набрал твой влог!"
      - "Это же Ричард! САМА Бон Омм Ричард!"
      - "Виксберг готовится к дебюту. Ей нужны связи в индустрии!"
      - "акая невероятная удача — встретить Ричард и получить от неё урок... Слушай, она говорила что-нибудь ещё? Ты взяла её номер или контакты?"
  - char: "vicksburg"
    side: "left"
    text:
      - "Да! Она дала мне свои контакты и сказала, что я могу обращаться к ней, если понадобится помощь с репетициями!"
  - char: "harrison"
    side: "right"
    text:
      - "Ого... Какой редкий шанс."
  - char: "john_rodgers"
    side: "left"
    text:
      - "Да не просто редкий! Это ИСТОРИЧЕСКИЙ шанс!"
      - "Если наладишь отношения с Ричард, будущее твоей карьеры айдола и нашего фан-клуба обеспечено!"
      - "Ух, почему меня там не было, чтобы увидеть всё своими глазами?"
      - "Нет... Может, ещё не поздно. Твои репетиции приносят плоды, так что давайте вместе купим подарок и лично встретимся с Ричард!"
  - char: "vicksburg"
    side: "right"
    text:
      - "Вам не кажется, что это немного рановато?"
  - char: "bennington"
    side: "left"
    text:
      - "Я за!"
  - char: "harrison"
    side: "right"
    text:
      - "Если Роджерс считает, что это хорошая идея, то и я тоже."
  - char: "john_rodgers"
    side: "left"
    text:
      - "Большинство «за»! Пойдёмте выбирать подарок!"
