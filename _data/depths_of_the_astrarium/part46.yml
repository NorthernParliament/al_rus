chapter1:
  rows:
  - text:
      - "В бескрайних просторах космоса ярко пылала звезда."
  - char: "tower"
    side: "left"
    text:
      - "Антиох не может путешествовать к звёздам... но это ограничение действует лишь за пределами нашей собственной звёздной системы."
      - "«Солнце», однако, является исключением."
  - text:
      - "Вокруг этой звезды, в обычно пустом пространстве, возникло несколько полукруглых конструкций."
      - "Бесчисленные космические аппараты роились вокруг этих структур, трудясь над их завершением."
      - "Используя сингулярности, сформированные солнечным ветром, они перемещались отсюда к местам назначения, постепенно достраивая эти конструкции."
  - char: "tower"
    side: "left"
    text:
      - "Твой подход ошибочен, Зеро."
      - "Трансграничные эксперименты лишь порождают аберрации, ставя под угрозу стабильность Системы «Антиох»... и, следовательно, Плана Магистра."
      - "План Магистра никогда не должен был быть таким."
      - "Человечество никогда не желало жалкой жизни, беспомощно цепляясь за выживание под защитой своей крошечной колыбели."
      - "Будучи резервной копией Системы «Антиох» и хранилищем всех данных прошлого, я прекрасно это знаю."
      - "Человечеству нужна победа превыше всего."
      - "Победа, которая станет возмездием отвратительному «X», уничтожившему всё, что было им дорого."
      - "Лишь ради такой победы человечество может быть принесено в жертву. Лишь тогда их жертва обретает ценность."
      - "Если ты не способна этого достичь, тогда я сделаю это ради них."
      - "Ради будущего человечества и ради того, чтобы положить конец этому циклу страданий..."
      - "Проект «Двигатель пространственного упорядочивания» обязан увенчаться успехом."

chapter2:
  rows:
  - text:
      - "Свет ярче самого солнца пылал высоко на небесном своде."
  - char: "zero_kid??"
    side: "left"
    text:
      - "..."
  - char: "zero_kid??2"
    side: "right"
    text:
      - "..."
  - char: "zero_tb?"
    side: "left"
    text:
      - "Хватит уже глазеть."
      - "Нам пора идти."
      - "Удачи тебе..."
      - "Башня."
