chapter1:
  rows:
  - text:
      - "Получив разрешение на рекламу, Беннингтон с энтузиазмом повела Виксберг и её фан-клуб на съёмки."
      - "Мы же с Ричард вновь отправились в Метрополис, чтобы взяться за новое поручение."
  - char: "administrator_yellow"
    side: "left"
    text:
      - "В-вы двое хотите... р-разрешение на службу безопасности?"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Давай уже задание!"
  - char: "administrator_yellow"
    side: "left"
    text:
      - "Е-если служба безопасности заставит меня почувствовать себя в безопасности... тогда я выдам вам разрешение..."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Задание принято! Ценю твою оперативность, Жёлтый."
      - "Профессор, пойдём! Нам нужно встретиться со всеми в месте, которое порекомендовала мисс специалист по безопасности!"

chapter2:
  rows:
  - char: "soobrazitelny_mach"
    side: "left"
    text:
      - "Много — значит здорово, а большое — это красиво! Добро пожаловать в машиностроительную лабораторию «Чем больше, тем лучше»!"
      - "Гениальный механик Сообразительный к вашим услугам!"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Приветик, мисс гениальный механик. Мы хотим нанять команду для охраны концерта."
  - char: "soobrazitelny_mach"
    side: "left"
    text:
      - "Концерт, да? У меня есть несколько проверенных вариантов, которые я могу предложить."
      - "Вы хотите вооружиться сами или предпочтёте отряд роботов?"
  - char: "bennington"
    side: "right"
    text:
      - "Вооружиться самим?.. Расскажешь поподробнее? Что конкретно под этим подразумевается?"
  - char: "soobrazitelny_mach"
    side: "left"
    text:
      - "Такие вещи, как силовая броня, пилотируемые гигантские мехи. Всякое такое."
      - "Правда, протащить гигантского меха с собой в Астральную Башню у вас вряд ли получится..."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Силовая броня... Спорим, ты бы круто в ней смотрелся, Профессор!"
  - char: "john_rodgers"
    side: "left"
    text:
      - "Если бы мы все были в силовой броне, нам бы даже не пришлось никого нанимать!"
  - char: "soobrazitelny_mach"
    side: "right"
    text:
      - "Считать это за ваш окончательный ответ?"
  - char: "vicksburg"
    side: "left"
    text:
      - "Минуточку! Разве во время концерта вам всем не нужно будет заниматься другими делами?"
      - "Стоять у сцены в силовой броне будет, эм... немного неудобно, вам не кажется?"
  - char: "john_rodgers"
    side: "right"
    text:
      - "Т-то-о-очно... Кхм. Я вовсе об этом не забыла!"
  - char: "soobrazitelny_mach"
    side: "left"
    text:
      - "Тогда останавливаемся на роботах?"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Ага. Нам, пожалуйста, армию роботов."
  - char: "soobrazitelny_mach"
    side: "left"
    text:
      - "Взгляните на мой электронный каталог. На выбор есть разные модели, к тому же при заказе комплекта у нас действуют скидки!"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Я беру самое дорогое~"
  - char: "soobrazitelny_mach"
    side: "left"
    text:
      - "Ого! Вот это щедрый покупатель!"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Хе-хе~ Сможешь подготовить план действий в ближайшее время?"
  - char: "soobrazitelny_mach"
    side: "left"
    text:
      - "Да, с гарантией качества и двумя запасными планами — завтра утром всё уже будет на вашей почте!"
