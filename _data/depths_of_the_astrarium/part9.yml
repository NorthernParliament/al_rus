chapter1:
  rows:
  - text:
      - "Как оказалось, медово-горчичное мороженое ДЕЙСТВИТЕЛЬНО существует."
  - char: "commander"
    side: "left"
    text:
      - "В Астрариуме и правда есть всё, да? Даже мороженое с самыми сомнительными вкусами."
  - text:
      - "Разумеется, настоящая аномалия здесь — это сама Ричард, которая умудряется с удовольствием уплетать столь аномальный вкус."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Фух~ Теперь мне намного лучше!"
      - "Не хочешь тоже взять себе порцию, Профессор?"

chapter2:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Нам стоит сосредоточиться на расследовании."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Э-э-х... Ну ладно."

chapter3:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Я возьму обычное."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Попробуй шоколадное с орехами!"

chapter4:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Одно медово-горчичное, пожалуйста!"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Вот это разговор! Я знала, что ты оценишь, Профессор!"

chapter5:
  rows:
  - text:
      - "Стоило нам войти в президентский люкс, как нашим глазам открылся полнейший хаос."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Вчера я как следует не рассмотрела, но ого, тут настоящий погром!"
      - "О-о-у... Моя бедная одежда и комиксы..."
  - text:
      - "Словно здесь пронёсся торнадо. Всё перевёрнуто вверх дном, даже массивная мебель вроде письменного стола и шкафов."
      - "Три гигантских чемодана взгромождены друг на друга, напоминая причудливый арт-объект."
  - char: "commander"
    side: "left"
    text:
      - "Хм?"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Профессор-детектив, что-то не так с чемоданами?"
  - char: "commander"
    side: "left"
    text:
      - "Нет... Просто удивляюсь, зачем тебе столько ручной клади. Разве в поездках обычно не оставляют вещи в грузовом..."
      - "(В грузовом... чём? О чём это я?)"
  - text:
      - "Я не могу вспомнить мысль, которую пытался выразить."
      - "Странно. Совершенно нормально иметь больше чемоданов, если везёшь кучу вещей. Почему мгновение назад это показалось мне странным?"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "М-м?"
  - char: "commander"
    side: "right"
    text:
      - "Прости, ничего особенного. Давай поищем другие улики."

chapter6:
  rows:
  - text:
      - "Посреди этого разгрома стоит открытый сейф."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Внутри лежал зашифрованный диск с моей мастер-записью."
      - "Какой вообще смысл в сейфе, если его всё равно можно взломать и всё украсть? Угх..."
  - char: "commander"
    side: "right"
    text:
      - "Похоже, замок просто разломали."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Ой, Профессор, посмотри на это!"
  - text:
      - "Ричард, кажется, что-то нашла под сломанной дверцей сейфа."
  - char: "commander"
    side: "left"
    text:
      - "Карточка?.."
  - text:
      - "Она показывает белую карточку размером примерно с визитку. На неё наклеены вырезанные из газеты буквы, складывающиеся во фразу: «Желание принято»."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Это ведь наверняка оставил вор, да?"
  - char: "commander"
    side: "right"
    text:
      - "Скорее всего. Но..."
      - "(Если уж оставляешь визитную карточку, разве не стоит приложить к ней хоть какую-то угрозу или требование?)"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Ну как, Профессор-детектив? Ты уже понял, кто преступник?!"
  - char: "commander"
    side: "right"
    text:
      - "Хм-м..."
  - text:
      - "Возможно, настоящий сыщик и смог бы установить личность и мотивы вора, изучив материал карточки, качество газетной бумаги или типографской краски."
      - "Но я обычный человек современной эпохи, поэтому и решение выберу современное."
  - char: "commander"
    side: "right"
    text:
      - "Давай проверим записи с камер наблюдения."

chapter7:
  rows:
  - text:
      - "На посту охраны отеля дежурит всего один человек — или, если взглянуть под другим углом, один маленький огонёк."
      - "Маленькое золотистое пламя слегка дрожит."
  - text:
      - "<img src='../../img/bg/r/1.webp' class='inline-img' alt=''>"
  - char: "eyewitness_yellow"
    side: "left"
    text:
      - "З-записи с камер? Они сломались, так что ничего не сохранилось!"
  - char: "commander"
    side: "right"
    text:
      - "Сломались? Именно сейчас?"
  - char: "eyewitness_yellow"
    side: "left"
    text:
      - "Мне было слишком страшно! Этот вор был просто ужасен! До смерти пугающим, говорю тебе!"
      - "Оставь я хоть какую-то улику... и меня бы стёрли навсегда!"
  - char: "commander"
    side: "right"
    text:
      - "То есть ты сама удалила запись."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Хе-хе, а значит, ты её уже ВИДЕЛА! Выходит, ты разглядела лицо преступника?"
      - "Подумай сама. Неужели ты веришь, что этот жуткий преступник оставит тебя в покое только потому, что ты стёрла запись?"
      - "Самое время выложить всё начистоту."
  - char: "eyewitness_yellow"
    side: "right"
    text:
      - "И-и-ик... Н-нееет! Мне конец!"
  - text:
      - "Золотистое пламя падает в обморок."
      - "Хоть и странно говорить такое об огне, но огонёк буквально отключился — поблёк и безжизненно опустился на пол."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Прости, Профессор... Кажется, я перегнула палку."
      - "Я всего лишь хотела немного припугнуть её."
      - "Хи-хи!"
  - text:
      - "Ричард неловко смеётся и высовывает кончик языка."
  - char: "commander"
    side: "left"
    text:
      - "Никто из нас не мог такого предвидеть... Давай отнесём её в номер и подождём, пока она очнётся."
