chapter1:
  rows:
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Так, давайте займёмся планированием наших последующих действий!"
  - text:
      - "После ужина мы, как обычно, собрались в убежище Эссекс."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Дальше нам нужно разобраться с разрешением на костюмы и разрешением на сценическое оборудование."
      - "Тут придётся иметь дело и с поставщиками, И с предпочтениями нашего начинающего айдола."
      - "Предлагаю разделиться на две команды!"
      - "Одна займётся переговорами с теми занудными администраторами, а вторая вместе с Виксберг свяжется с поставщиками!"
      - "Мисс специалист по безопасности, не могла бы ты познакомить нас с ответственными лицами и поставщиками?"
  - char: "collett_rad"
    side: "right"
    text:
      - "Оба администратора находятся в Метрополисе, и я уверена, к этому моменту вы уже прекрасно знаете, как найти к ним подход."
      - "Первый поставщик — дизайнер костюмов Память Меркурия. «PM Плаза» в Верхнем городе названа в её честь."
      - "Она известна своими деловыми махинациями и хваткой, так что будьте осторожны, чтобы вас не провели на переговорах."
      - "Что касается сценического оборудования, нужный вам поставщик держит старый магазинчик под названием «Сияние☆Навсегда» в Нижнем городе."
      - "Её зовут Саратога, и вы можете знать её как бывшую суперзвезду-айдола."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Ещё бы!"
  - char: "vicksburg"
    side: "right"
    text:
      - "А? Ты имеешь в виду ТУ САМУЮ Саратогу?!"
      - "Понятия не имела, что после ухода со сцены она открыла магазин в Астрариуме... да ещё и в Нижнем городе!"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Вот как мы распределим обязанности!"
      - "Мы с мисс детективом и Профессором-детективом найдём администраторов и выслушаем их просьбы. А Виксберг со своим фан-клубом свяжется с поставщиками!"
      - "Держим связь, договорились? Встретимся снова в убежище сегодня вечером!"
  - char: "john_rodgers"
    side: "right"
    text:
      - "Так точно!"
  - char: "essex_detective"
    side: "left"
    text:
      - "Прошу прощения. У меня на завтра запланировано расследование одной аномалии."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Без проблем~ Сосредоточься на своей работе! Мы с Профессором справимся и сами."
