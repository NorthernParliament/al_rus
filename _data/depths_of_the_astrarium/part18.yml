chapter1:
  rows:
  - text:
      - "Мы вернулись в Метрополис и рассказали синему огоньку о квартире. Она ответила, что скоро перенесёт туда весь офис."
      - "С её исполненным желанием мы успешно заполучили разрешение на выступление."
  - char: "administrator_blue"
    side: "left"
    text:
      - "Спасибо за исполнение моего желания! Раз уж вы совершили невозможное, я поделюсь с вами важной информацией..."
      - "Если хотите попасть в Астральную Башню, одного лишь разрешения на выступление будет недостаточно."
  - char: "john_rodgers"
    side: "right"
    text:
      - "Я думала, оно разрешает нам выступить. Ну, судя по названию, разве нет?.."
  - char: "administrator_blue"
    side: "left"
    text:
      - "*вздыхает*... Оно разрешает только само выступление. Публичным номерам требуется организация и подготовка, верно? Для каждого из этих пунктов нужно отдельное разрешение..."
  - char: "vicksburg"
    side: "right"
    text:
      - "Что конкретно нам понадобится?"
  - char: "administrator_blue"
    side: "left"
    text:
      - "Разрешение на костюмы, разрешение на сценическое оборудование, разрешение на использование площадки..."
      - "Разрешение на службу безопасности, разрешение на рекламу... Соберите все пять, и тогда всё будет в порядке."
  - char: "john_rodgers"
    side: "right"
    text:
      - "Да их же слишком много!"
  - char: "bennington"
    side: "left"
    text:
      - "Есть ли способ оформить все пять сразу через тебя?"
  - char: "administrator_blue"
    side: "right"
    text:
      - "*вздыхает*... Невозможно. Какая тоска... У меня нет полномочий оформлять подобные документы..."
      - "И как их получить, я тоже не знаю. Удачи. Пойду лучше вернусь к работе, а то совсем упаду духом..."
  - text:
      - "Синий огонёк уплывает прочь, оставляя за собой гнетущую атмосферу."
  - char: "bennington"
    side: "left"
    text:
      - "Так вот она какая — тёмная сторона Астрариума... Надо обязательно всё это заснять!"
  - char: "essex_detective"
    side: "right"
    text:
      - "Что думаешь, специалист по безопасности?"
  - char: "collett_rad"
    side: "left"
    text:
      - "...Даже если бы я смогла взломать систему, подделать пять разрешений — задача не из лёгких."
      - "Но, думаю, мне удастся выяснить, кто отвечает за каждое из них."
      - "Придётся повозиться, но если двигаться шаг за шагом... Уверена, всё получится."
  - char: "john_rodgers"
    side: "right"
    text:
      - "Раз это наш единственный вариант, то так тому и быть. Сделаем всё возможное, чтобы шоу Виксберг прошло с блеском!"
  - char: "harrison"
    side: "left"
    text:
      - "Помни, наша настоящая цель — найти мастер-запись Ричард..."
  - char: "john_rodgers"
    side: "right"
    text:
      - "Кхм... Конечно, я помню! Я бы ни за что не забыла о чём-то настолько важном!"
  - char: "harrison"
    side: "left"
    text:
      - "Да-да."
  - char: "vicksburg"
    side: "right"
    text:
      - "Целых пять разрешений..."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Не вешайте нос, девочки!"
      - "Как-никак, мы продвинулись вперёд! Это дело надо отпраздновать!"
      - "Пойдём сегодня вкусно поедим — я угощаю~"
      - "Разумеется, я отложу порцию и для тебя, мисс специалист по безопасности! С нетерпением буду ждать сведений о пяти разрешениях~"
