chapter1:
  rows:
  - text:
      - "Спасательная операция прошла гладко."
      - "Поймав диск, Ричард на мгновение зависла в воздухе, словно осматривая его."
      - "Тем временем, пережив пять телепортаций благодаря Мисс D, мы объединились с флотом Беннингтон в море за пределами Астрариума."
  - char: "bennington"
    side: "left"
    text:
      - "Что? Ты использовал мастер-запись как приманку?!"
  - char: "vicksburg"
    side: "right"
    text:
      - "И всё ради нас... Прости, что мы оказались такой обузой."
  - char: "commander"
    side: "left"
    text:
      - "Вовсе нет. К Ричард в любом случае уже вернулась её сила."
      - "В этом нет ничьей вины. Наш враг попросту слишком силён... Она не та, с кем вам следовало бы сражаться."
  - char: "john_rodgers"
    side: "right"
    text:
      - "НАМ? Нет, она не та, с кем ТЕБЕ стоит сражаться!"
      - "Мы — девушки-корабли. А ты — нет!"
  - char: "miss_d"
    side: "left"
    text:
      - "Но мой ассистент — член Совета. А это делает моего ассистента сильным!"
  - char: "harrison"
    side: "right"
    text:
      - "Совет?.."
  - char: "essex_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Если мы собираемся весь день болтать о пустяках, то я ухожу."
  - char: "commander"
    side: "right"
    text:
      - "Погоди. У тебя есть способ выбраться отсюда?"
  - char: "essex_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Ну, нет. Но если я погибну, значит, погибну."
  - char: "commander"
    side: "right"
    text:
      - "Ну вот опять... Вы все из «Пепла» твердите одно и то же."
      - "......"

chapter2:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Нужно успокоиться и всё обдумать.)"
      - "(Ричард появилась в одном из экспериментов Зеро.)"
      - "(Сейчас ситуация выходит из-под контроля, но не могла же она прийти совершенно неподготовленной.)"
      - "(Но что она МОЖЕТ сделать? На что она готова пойти?)"
      - "(Единственное, что связывает Астрариум с Антиох — это сама Мисс D.)"
      - "(Хелена осознавала важность Мисс D — именно поэтому она поручила Бристоль защищать её.)"
      - "(Ричард явно тоже остерегается её... Почему?)"
      - "(Дело в ките? Или в самой Косе Смерти?)"
      - "(Не все мотыльки Бристоль были уничтожены. Нескольким удалось улететь в туман.)"
      - "(Туман, окутывающий Астрариум... Судя по углу той эстакады, она должна вести за пределы города.)"
      - "(Сможет ли Коса Смерти... рассечь этот туман?)"
  - text:
      - "Учитывая ситуацию, это может быть нашим единственным шансом на спасение."
  - char: "bon_omm_richard"
    side: "right"
    status: "is-gray"
    text:
      - "Хе-хе~ Запись проверена. Ты достаточно отдохнул, Профессор?"
      - "Давай вернёмся к нашей резне ♪"
  - char: "commander"
    side: "left"
    text:
      - "Разве ты не обещала отпустить нас домой целыми и невредимыми, как только получишь диск?"
  - text:
      - "Выигрывая время, я пытаюсь вспомнить пароль, необходимый для активации Косы Смерти."
  - char: "commander"
    side: "left"
    text:
      - "(Зная д-ра Аосте, пароль точно должен быть. Каким же он может быть?)"
  - char: "bon_omm_richard"
    side: "right"
    status: "is-gray"
    text:
      - "Я передумала. В любом случае, ты никак не контролируешь эту ситуацию."
  - char: "commander"
    side: "left"
    text:
      - "Ричард, ты видишь туман за пределами города?"
  - char: "bon_omm_richard"
    side: "right"
    status: "is-gray"
    text:
      - "И что с того?"
  - char: "commander"
    side: "left"
    text:
      - "Это наш путь к отступлению."
      - "Мисс D, активируй Косу Смерти!"

chapter3:
  rows:
  - text:
      - "Колоссальный кит взмывает в небо, пробивая брешь в далёком тумане."
      - "Это лишь тонкая щель, настолько малая, что её и не заметишь, если не приглядываться."
      - "Извивающееся белое вещество просачивается сквозь разлом, сливается с туманом и постепенно поглощает его."
      - "Затем облака, море и даже сам Астрариум..."
