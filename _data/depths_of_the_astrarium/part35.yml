chapter1:
  rows:
  - text:
      - "Подготовка к концерту шла без проблем."
      - "«Мечта Звезды» было весьма подходящим названием для этой террасы, ведь совсем скоро под звёздным небом ей предстояло стать сценой для ослепительной грёзы."
  - char: "vicksburg"
    side: "left"
    text:
      - "Спасибо вам всем за усердную работу~ Отдохните немного, хорошо? О мелочах я позабочусь сама!"
  - char: "john_rodgers"
    side: "right"
    text:
      - "Ни в коем случае! Звезда должна сосредоточиться на своём выступлении. О мелочах позаботимся МЫ."
  - char: "harrison"
    side: "left"
    text:
      - "К началу шоу ты должна быть в идеальной форме~ Ты ведь так долго этого ждала."
  - char: "vicksburg"
    side: "right"
    text:
      - "Конечно. Ричард вложила столько сил в моё обучение. Обещаю, я покажу лучшее выступление, на какое только способна!"
      - "Не только ради её потерянной записи, но и ради моей мечты... Моей мечты стать айдолом."
  - char: "bennington"
    side: "left"
    text:
      - "Выложись на полную! Я буду снимать твой сольный концерт со всех мыслимых ракурсов!"
  - char: "vicksburg"
    side: "right"
    text:
      - "Большое спасибо! А теперь мне лучше пойти готовиться!"
  - text:
      - "Начинающий айдол вернулась к репетиции."
      - "Роджерс и Харрисон возобновили работу, а Беннингтон вернулась в коридор, чтобы проверить охрану здания."
      - "Как раз в этот момент она заметила одинокого мотылька, испускающего слабое синее свечение."
  - char: "bennington"
    side: "left"
    text:
      - "Что за?! И здесь ещё одна аномалия?"
      - "Дело плохо! Если она сорвёт шоу..."
      - "А, постой! Не улетай! Дай я сначала сниму тебя на камеру!"

chapter2:
  rows:
  - text:
      - "Она погналась за мотыльком. Завернув за угол, она обнаружила ожидавшую её хозяйку."
  - char: "bristol_tales?"
    side: "left"
    text:
      - "Давненько не виделись, Беннингтон."
  - char: "bennington"
    side: "right"
    text:
      - "Приветик, эм..."
  - char: "bristol_tales?"
    side: "left"
    text:
      - "Можешь называть меня Легендарным следователем Бристоль."
  - char: "bennington"
    side: "right"
    text:
      - "Приятно познакомиться... Бристоль? Эм, мы встречались раньше?"
  - char: "bristol_tales?"
    side: "left"
    text:
      - "Вполне понятно, почему ты меня не помнишь. Твой разум затуманен, скрывая твоё истинное «я»."
  - char: "bennington"
    side: "right"
    text:
      - "Моё... истинное «я»?"
  - char: "bristol_tales?"
    side: "left"
    text:
      - "«Ведомая мерцанием, явленная в тени лампы»."
      - "Ты — Беннингтон, авианосец типа «Эссекс». Очнись от этого ложного сна и взгляни в лицо правде!"
  - text:
      - "Синий свет ударил в Беннингтон. Она сильно пошатнулась, словно от резкого пробуждения."
  - char: "bennington"
    side: "left"
    text:
      - "Я... Ты... А? Где я? И... чем я вообще занималась всё это время?"
  - char: "bristol_tales?"
    side: "right"
    text:
      - "Словно мотылёк, попавший в паутину и отравленный сладким ядом: даже если ты очнёшься в свои последние мгновения, ты всё равно в ловушке."
      - "Но ты можешь выбраться."
  - char: "bennington"
    side: "left"
    text:
      - "Теперь я вспомнила... Когда я только прибыла в этот город, мы встретились... Но я всё ещё ни капли тебя не понимаю!"
      - "Извини, но я не одна из твоих пропавших подруг!"
  - char: "bristol_tales?"
    side: "right"
    text:
      - "Скажем так, я неверно оценила ситуацию."
      - "Сейчас каждая секунда на счету. Опасный ритуал близится к завершению."
      - "Вы должны объединить усилия, чтобы помешать ему свершиться... однако концерт должен пройти по плану."
      - "Возьми этих мотыльков, чтобы вывести остальных из транса."
  - char: "bennington"
    side: "left"
    text:
      - "Виксберг... Харрисон... Джон Роджерс!"
  - text:
      - "Беннингтон принимает трёх мотыльков и спешит обратно к сцене."
  - char: "bristol_tales?"
    side: "left"
    text:
      - "Слушайтесь мотыльков, если хотите жить. Мотыльки! Танцуйте перед пламенем!"

chapter3:
  rows:
  - text:
      - "Когда Беннингтон ушла, Бристоль осталась стоять на месте."
      - "Спустя некоторое время все её мотыльки вернулись, сменив синие оттенки на чистое белое сияние и радужную ауру."
  - char: "bristol_tales?"
    side: "left"
    text:
      - "Информация о Командире получена... вместе с моей наградой."
      - "Спасибо, что выбрала меня в качестве временной союзницы."
      - "Согласно твоим указаниям, шоу Виксберг состоится."
      - "Остальные трое отправятся на поиски Саратоги, Сообразительный и Памяти Меркурия. То есть, если последняя вообще соизволит найтись."
      - "Эссекс ищет Мисс D по приказу Командира. У неё есть надёжная зацепка, так что всё должно пройти как надо."
      - "Что же до Бристоль... Что ж, похоже, мне снова пора прощаться."
      - "Прощайте, бьющиеся мотыльки."
      - "Если вы вспомнили, что вы — кансен, то, надеюсь, вы осознаете, что беготня на своих двоих — уже далеко не единственный способ вести разведку."
  - text:
      - "С этими словами легендарный следователь отвесила медленный поклон пустой аудитории и растворилась во внезапной вспышке пламени."
