chapter1:
  rows:
  - text:
      - "После произошедшего в парке мы с Ричард сели на старый вагончик и доехали до прохода наверх, отмеченного как действующий сегодня."
      - "Как и вчера, мы поднялись на грузовом лифте. А после нам оставалось лишь подняться по лестнице."
      - "В конце концов, преодолев заваленный обломками коридор, мы снова оказались в Верхнем городе Астрариума."

chapter2:
  rows:
  - text:
      - "Небоскрёбы возвышались над ухоженными газонами и ярко-синей искусственной рекой."
      - "Таинственная пелена ночи спала, уступив место гармонии и процветанию дневного света."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Фух... Как же приятно снова увидеть небо."
      - "В Нижнем городе так душно и неудобно... Верхний город — вот где настоящая жизнь!"
      - "Погоди секундочку, Профессор. Дай я сверюсь с картой Верхнего города."
      - "Отлично! Похоже, мы совсем рядом с отелем!"
      - "Ой, но тут неподалёку есть целый квартал с ресторанами..."
      - "Я так проголодалась, Профессор! А ты? Может, перекусим там перед тем, как идти в отель?"
      - "Постой... А вдруг мы ещё успеем на роскошный шведский стол в отеле?"
  - text:
      - "Пока она спорит сама с собой насчёт еды, моё внимание привлекает кое-что другое."
      - "В толпе я замечаю вспышку... чего-то непонятного."
      - "Приглядевшись я вижу..."

chapter3:
  rows:
  - text:
      - "В толпе таится пламя. Или, вернее сказать, будто вся толпа состоит из множества разноцветных огоньков."
      - "Приглядываясь, я вижу, как сами люди превращаются в огонь... но стоит мне расслабить взгляд, как они снова принимают человеческий облик."
      - "Больше никто ничего странного не замечает, включая саму Ричард."
  - char: "commander"
    side: "left"
    text:
      - "(С этим городом определённо что-то не так.)"

chapter4:
  rows:
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Ну так что думаешь? Где поедим, Профессор?"
  - text:
      - "Ричард оставляет попытки решить самой и перекладывает выбор на меня."
  - char: "commander"
    side: "left"
    text:
      - "Я считаю, сначала нужно осмотреть отель, а о еде подумаем позже."
      - "Не хотелось бы, чтобы горничные уничтожили улики в номере до того, как мы туда доберёмся."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "О-о-о! А у тебя прямо боевой детективный настрой, да?"
      - "Тогда и мне пора переключиться в режим ассистентки."
      - "Непревзойдённый детективный дуэт раскроет всю правду♪"
  - text:
      - "Когда мы трогаемся в путь, она начинает напевать какую-то странную мелодию."

chapter5:
  rows:
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Ой! Профессор, смотри, мороженое! Давай купим!"
      - "Это ведь совсем ненадолго. Ну пожа-а-алуйста!"
  - text:
      - "Не в силах устоять перед её уговорами, я соглашаюсь купить ей рожок."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Ура-а! Я хочу один шарик шоколадного с орехами, а второй — медово-горчичный!"
  - char: "commander"
    side: "right"
    text:
      - "...Медово-горчичный?"
      - "Разве бывает медово-горчичное мороженое?"
