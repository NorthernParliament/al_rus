chapter1:
  rows:
  - text:
      - "После бесконечных дней приготовлений день выступления наконец настал строго по расписанию."
      - "Из-за правил безопасности Астральной Башни мы могли войти внутрь только в день мероприятия, чтобы подготовить площадку."
      - "Поэтому мы зашли ровно в 6:00 утра, как только открылись двери, чтобы выжать максимум из того малого времени, что у нас было."
      - "Виксберг, Харрисон и Роджерс прямиком направились на открытую террасу на 170-м этаже, чтобы начать обустройство сцены."
      - "Беннингтон повела роботов охраны, чтобы перекрыть входы в здание и ключевые стратегические точки."
      - "Мы с Ричард фиксировали внутреннее устройство башни, сужая круг мест, где могла быть спрятана запись. Эссекс занималась тем же самым, но отдельно от нас."
      - "Коллетт обеспечивала постоянную удалённую поддержку, контролируя зашифрованную связь, анализ и синхронизацию информации, а также взлом систем в режиме реального времени."
      - "Нашими главными задачами были: закончить подготовку сцены и разведать башню до начала шоу, а затем, пока все будут отвлечены выступлением, обыскать подозрительные зоны в поисках записи."
      - "Если всё пройдёт гладко, мы сможем дождаться окончания шоу и уйти вместе с командой Виксберг. Если нет — роботам-охранникам придётся прикрывать нас во время отхода по пути эвакуации."
  - char: "bennington"
    side: "left"
    text:
      - "Потрясающе! Наконец-то настал этот решающий день! Я нервничаю, но в то же время невероятно взволнована!"
  - char: "vicksburg"
    side: "right"
    text:
      - "Надеюсь, всё пройдёт удачно..."
  - char: "john_rodgers"
    side: "left"
    text:
      - "Мы потратили столько времени на подготовку, вызубрили план от начала и до конца... Уверена, всё будет в порядке!"
  - char: "harrison"
    side: "right"
    text:
      - "Да! Мы отлично справимся!"
  - char: "saratoga_morning_rad"
    side: "left"
    text:
      - "Удачи~ Я буду наблюдать за вами издалека."
  - char: "soobrazitelny_mach_rad"
    side: "right"
    text:
      - "Берегите мою армию роботов! Если сломаете их, клянусь..."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Я выплачу компенсацию в двойном размере~"
  - char: "soobrazitelny_mach_rad"
    side: "right"
    text:
      - "Вот это я понимаю разговор!"
  - char: "collett_rad"
    side: "left"
    text:
      - "Не забудьте развернуть ботов-взломщиков как можно скорее. Мне не терпится пошарить по башне и раскрыть её секреты..."
  - char: "essex_detective"
    side: "right"
    text:
      - "Будучи внутри, тоже обязательно оставайтесь на связи. Моя детективная интуиция подсказывает, что легко не будет."
  - char: "commander"
    side: "left"
    text:
      - "Верно. Будьте осторожны. У нас полно времени до начала шоу в 20:00."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Ага! Я верю в твой план, Профессор! Мы совершенно точно вернём запись!"
  - char: "commander"
    side: "left"
    text:
      - "Всё готово. Вперёд!"

chapter2:
  rows:
  - text:
      - "В одной из комнат Нижнего города были задернуты шторы, а кондиционер работал на полную мощность."
      - "Обитательница комнаты сидела в компьютерном кресле в форме робокота и лениво стучала по клавишам."
      - "Как только команда и оборудование проникли в Астральную Башню, десятки мониторов на её стенах разом зажглись."
  - char: "collett"
    side: "left"
    text:
      - "Хе-хе... Мои боты-взломщики развёртываются. Поиск узла физического доступа..."
      - "Нашла... Начинаю физическое подключение."
      - "Отлично. Проще простого."
      - "Хе-хе, это куда проще, чем удалённый взлом..."
      - "Даже самая неприступная крепость не устоит перед атакой изнутри."
      - "Сначала найду чертежи здания, чтобы избавить их от лишней беготни."
  - text:
      - "Работа шла как по маслу. Сама того не замечая, она принялась напевать под нос."
  - char: "collett"
    side: "left"
    text:
      - "Чёрная птица окликает по имени ♪"
      - "Паря над крышами, задевая грёзы ♪"
  - text:
      - "В мгновение ока Коллетт отыскала чертежи здания, включая даже расположение серверной и секретного хранилища."
  - char: "collett"
    side: "left"
    text:
      - "Серверная, секретное хранилище... Ага, это подозрительно. Лучше синхронизировать карту с ребятами и отметить эти места как ключевые точки."
      - "Дальше... записи с камер наблюдения..."
      - "Если удастся найти записи за ночь ограбления, выяснить личность вора и местонахождение украденного не составит труда."
      - "Этот смрад — всего лишь дым очага ♪"
      - "Падающие слёзы — всего лишь дождь на улице ♪"
  - text:
      - "Не переставая напевать, она пробивала один фаервол за другим, сохраняя бесчисленные секреты башни на своё локальное устройство."
      - "Казалось, будто она проделывала это уже бессчётное количество раз."
  - char: "collett"
    side: "left"
    text:
      - "Погодите... Откуда это чувство дежавю?"
      - "Я ведь никогда раньше не взламывала башню, так почему мне кажется, будто я уже делала всё это..."
      - "Хм-м... Пока приторможу и отправлю данные, которые успела проанализировать."

chapter3:
  rows:
  - text:
      - "Мы с Ричард осмотрели каждый этаж с 1-го по 66-й. К этому моменту уже наступило время обеда."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Я без задних ног... Профессор, давай сделаем небольшой перерыв."
  - char: "commander"
    side: "right"
    text:
      - "В башне 210 этажей, так что мы прошли только треть пути. Нам пока некогда отдыхать..."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Но перерывы очень важны! Ты ведь толком не спал последние дни из-за всей этой работы над планом, разве нет?"
      - "Мисс детектив и мисс специалист по безопасности изо всех сил стараются помочь. Уверена, скоро мы совершим прорыв."
      - "Странно... Они просили оставаться на связи, но сигнал то и дело пропадает."
  - char: "commander"
    side: "right"
    text:
      - "Возможно, внутри башни помехи... По крайней мере, связь всё ещё частично работает. К тому же мы учитывали подобные перебои в плане."
  - char: "communicator"
    side: "left"
    text:
      - "ПИК-ПИК!"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Легка на помине! Мне как раз пришло сообщение. Похоже, мисс специалист по безопасности трудится не покладая рук."
  - char: "commander"
    side: "left"
    text:
      - "Чертежи башни, да? Боже мой, сколько же тут страниц."
      - "Хм-м... Похоже, она сузила круг всего до 18 мест, заслуживающих внимания?"
      - "Отличные новости."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Она также упомянула, что просматривает записи с камер, чтобы сузить его ещё сильнее."
      - "Теперь нам не придётся так спешить! Пойдём уже пообедаем! Сытый желудок сделает из нас куда более умелых детективов~"
      - "Кхм... Может, ТЫ и не страдаешь от голода, Профессор-детектив, но вот я — ещё как!"
  - text:
      - "По какой-то причине она кажется этим весьма гордой."
  - char: "commander"
    side: "left"
    text:
      - "Справедливо. Давай сделаем небольшой перерыв на этом этаже."

chapter4:
  rows:
  - text:
      - "Пока Ричард ведёт меня к зоне отдыха, краем глаза я замечаю легчайшую синюю вспышку."
  - char: "commander"
    side: "left"
    text:
      - "(Синий... мотылёк?)"
  - text:
      - "Это одинокий мотылёк, обладающий странно элегантной аурой и таинственным синим свечением."
      - "Он приковывает мой взгляд, наполняя непреодолимым желанием поймать его в ладонь."
  - char: "commander"
    side: "left"
    text:
      - "Ричард..."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Что такое, Профессор?"
  - text:
      - "Несмотря на то, насколько он бросается в глаза, она совершенно его не замечает."
  - char: "commander"
    side: "left"
    text:
      - "(Неужели только я его вижу?)"
  - text:
      - "Туман в голове никуда не делся, но по какой-то причине меня непреодолимо тянет пойти за ним."
  - char: "commander"
    side: "left"
    text:
      - "Иди закажи что-нибудь, хорошо? Я отойду в уборную. Скоро вернусь."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Хорошо. Хе-хе~ Интересно, что бы такого заказать!"
  - text:
      - "Как только она уходит, я заворачиваю за угол и спешу вслед за мотыльком."
