chapter1:
  rows:
  - text:
      - "Покинув переулок вместе с детективом Эссекс, мы увидели, как она открыла старый атлас."
      - "Из страниц вылетели тускло светящиеся мотыльки. Они повели нас сквозь стальной лабиринт, пока мы не добрались до входа в подземный переход, заваленного грудами обломков."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Эм... Мисс детектив, это ведь... не то самое «убежище», о котором ты говорила?"
      - "Ты спишь здесь?"
  - text:
      - "Ричард нервно дёргает меня за рукав."
  - char: "essex_detective"
    side: "left"
    text:
      - "Кончено нет."
      - "Это безопасный проход в Нижний город, который открывается только в это время суток."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "В... Нижний город?"
  - char: "essex_detective"
    side: "left"
    text:
      - "Боже мой. Вы и впрямь совсем ничего не разузнали об Астрариуме?"
  - text:
      - "Эссекс отодвигает обломки и ступает в проход."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Профессор, может, сбежим, пока она не смотрит в нашу сторону?"
  - char: "commander"
    side: "right"
    text:
      - "Разве тебе не любопытно взглянуть на Нижний город?"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Судя по одному только названию, там убого и противно..."
      - "Но... подземное убежище сыщика звучит довольно интригующе."
  - char: "commander"
    side: "right"
    text:
      - "Раз уж зашли так далеко, давай останемся на ночь и посмотрим, что будет."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Ладно. Как скажешь, Профессор!"

chapter2:
  rows:
  - text:
      - "Спустившись где-то на десяток этажей вниз, Эссекс нашла грузовой лифт."
      - "Спустя пять минут поездки нашему взору предстало зрелище, совершенно не похожее на остальной Астрариум."
  - char: "essex_detective"
    side: "left"
    text:
      - "Это Нижний город — Старый город Астрариума."
      - "Не бойтесь. Он хоть и выглядит обветшалым, но здесь куда безопаснее, чем в Верхнем городе."
      - "К тому же здесь меньше правил и ограничений... Ох, полагаю, о них вы тоже ничего не знаете. Что ж, обсудим это в убежище."
      - "Как бы то ни было, освоившись на этих улицах, вы сможете перемещаться по ним в обход аномалий Верхнего города."

chapter3:
  rows:
  - text:
      - "Светящиеся мотыльки провели нас ещё по нескольким тропам, пока мы не вышли к просторному помещению."
      - "Я замечаю со вкусом подобранные обои, тёплый камин, книжные полки, шкафы, письменный стол и доску, сплошь увешанную записками."
  - char: "essex_detective"
    side: "left"
    text:
      - "Ну как вам? Неплохо, правда?"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Ага! Даже лучше, чем я представляла! Настоящий детективный шик!"
      - "Профессор, давай переночуем здесь!"
      - "Кстати, мисс детектив, все эти стикеры на доске — это разные аномалии города?"
      - "Можно я на них взгляну? И на записи на твоём столе тоже?"
  - text:
      - "Ричард мгновенно осваивается и, чтобы утолить своё любопытство, принимается исследовать убежище."
      - "Я позволяю себе немного расслабиться и разложить по полочкам имеющуюся информацию."
  - char: "commander"
    side: "left"
    text:
      - "Мы вместе прибыли в Астрариум и встретили детектива Эссекс..."
      - "Но неужели это всё?"
  - text:
      - "Туман, всё ещё висящий в голове, словно подсказывает, что в моих рассуждениях не хватает чего-то жизненно важного."
  - char: "commander"
    side: "left"
    text:
      - "Но я просто ничего не могу вспомнить..."
      - "Похоже, это ещё одна тайна, которую мне предстоит раскрыть."
