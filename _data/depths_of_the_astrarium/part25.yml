chapter1:
  rows:
  - char: "administrator_red"
    side: "left"
    text:
      - "Что? Вам нужно разрешение на костюмы?!"
      - "Я не раздаю разрешения кому попало, знаете ли!"

chapter2:
  rows:
  - char: "commander"
    side: "right"
    text:
      - "Мы это понимаем. Чего ты хочешь?"
  - char: "administrator_red"
    side: "left"
    text:
      - "Хех. И с чего ты взял, что я раздаю задания кому попало?"

chapter3:
  rows:
  - char: "commander"
    side: "right"
    text:
      - "(Ткнуть её пальцем, чтобы проверить, пропустит ли это диалог.)"
  - char: "administrator_red"
    side: "left"
    text:
      - "Эй! Хватит меня трогать!"

chapter4:
  rows:
  - char: "administrator_red"
    side: "left"
    text:
      - "Наш генеральный директор очень придирчив к сценическим костюмам!"
      - "Как администратор, я обязана поддерживать строжайший контроль качества!"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Ого... С этой будет сплошная морока."
  - char: "administrator_red"
    side: "left"
    text:
      - "Это называется профессионализмом! В общем, если хотите получить разрешение, вам лучше выбрать костюм, который удовлетворит МЕНЯ!"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Разве мы не генерального директора должны удовлетворить?.."
  - char: "administrator_red"
    side: "left"
    text:
      - "Генеральный директор ни за что не останется доволен костюмом, который не понравится мне!"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "То есть... Тебе просто нужно увидеть наряд? Человеку в нём не обязательно присутствовать лично, лишь бы было фото подходящего костюма?"
  - char: "administrator_red"
    side: "left"
    text:
      - "Именно! Но если попытаетесь смухлевать, разрешения вам вовек НЕ видать!"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Ладно-ладно."
      - "Уверена, у нашего айдола отличный вкус!"
      - "Она как раз сейчас должна быть в магазине, так что я просто попрошу её скинуть фотку."

chapter5:
  rows:
  - text:
      - "Немногим ранее..."
  - char: "pamiat_merkuria_cherry"
    side: "left"
    text:
      - "Фан-клуб Виксберг, добро пожаловать в «PM Плазу»!"
      - "Оглядитесь вокруг! Выбирайте всё, что душе угодно: костюмы, светящиеся палочки, сценический реквизит — всё, что пожелаете!"
  - char: "vicksburg"
    side: "right"
    text:
      - "Спасибо за помощь, Память!"
  - char: "pamiat_merkuria_cherry"
    side: "left"
    text:
      - "Ой, а что это за маленький робокот? Можно подержать?"
  - char: "collett_rad"
    side: "right"
    text:
      - "Да на здоровье..."
  - char: "bennington"
    side: "left"
    text:
      - "Прошу прощения, эм, Память? Ничего, если я поснимаю здесь влог?"
  - char: "pamiat_merkuria_cherry"
    side: "right"
    text:
      - "О, ты видеоблогер? Конечно можно! Только сними меня с лучшего ракурса~"
  - char: "bennington"
    side: "left"
    text:
      - "С радостью!"
  - char: "harrison"
    side: "right"
    text:
      - "Роджерс, тут продаётся сценический реквизит. Не хочешь прикупить кое-что вместе?"
  - char: "john_rodgers"
    side: "left"
    text:
      - "Ещё бы! Виксберг впервые выступает в Астральной Башне, так что мы должны украсить сцену по высшему разряду!"
      - "Удачи с выбором костюма, Виксберг!"

chapter6:
  rows:
  - text:
      - "Вскоре после этого Виксберг прислала фотографию сценического наряда."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "О-о-о~ Какая милота!"
      - "Как тебе такое? Проходит с блеском, я ведь права?"
  - char: "administrator_red"
    side: "right"
    text:
      - "Нет! Слишком мило! Это совершенно не вписывается в пышную атмосферу фестиваля! Такое ни за что не пройдёт!"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Чего?.."

chapter7:
  rows:
  - char: "pamiat_merkuria_cherry"
    side: "left"
    text:
      - "А? Этот костюм не подходит?"
  - char: "vicksburg"
    side: "right"
    text:
      - "Администратор, отвечающая за согласование, сказала, что он слишком милый и недостаточно «пышный»..."
  - char: "pamiat_merkuria_cherry"
    side: "left"
    text:
      - "Понятненько... Хочешь попробовать подобрать что-нибудь другое из этого отдела?"

chapter8:
  rows:
  - text:
      - "Спустя некоторое время мы получаем второе фото от Виксберг."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Этот тоже отличный... Он прямо подчёркивает ауру того, кто его носит!"
      - "Ну этот-то тебе точно понравится!"
  - char: "administrator_red"
    side: "right"
    text:
      - "Нет! Слишком броско! Вы затмите нашего генерального директора!"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Я... не согласна?"

chapter9:
  rows:
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "А как насчёт этого? По-моему, в самый раз."
  - char: "administrator_red"
    side: "right"
    text:
      - "Нет. Генеральный директор таким доволен не останется!"

chapter10:
  rows:
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Ну от этого генеральный директор ТОЧНО будет без ума!"
  - char: "administrator_red"
    side: "right"
    text:
      - "Нет, нет и ещё раз нет! Этот даже хуже предыдущего!"

chapter11:
  rows:
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Слушай... Может, мы уже сойдёмся на этом, пожалуйста?.."
  - char: "administrator_red"
    side: "right"
    text:
      - "Нет! Отбор должен быть строгим! Всегда нужно стремиться к совершенству!"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "......"

chapter12:
  rows:
  - char: "pamiat_merkuria_pick"
    side: "left"
    text:
      - "А-а-аргх! Мы перепробовали уже двадцать вариантов!"
  - char: "bennington"
    side: "right"
    text:
      - "Как думаете, может, нам всё-таки подумать о подделке разрешения?.."
  - char: "john_rodgers"
    side: "left"
    text:
      - "Или мы можем просто «поговорить» с этой администраторшей! Пусть объяснит, что вообще не так ХОТЬ С ОДНИМ из этих нарядов!"
  - char: "vicksburg"
    side: "right"
    text:
      - "Память... Прости, пожалуйста, за доставленные хлопоты."
  - char: "pamiat_merkuria_pick"
    side: "left"
    text:
      - "Нет, вы тут ни при чём. Проблема в этой администраторше!"
      - "Это зашло уже слишком далеко!"
      - "Я ЛИЧНО отбирала каждый из этих нарядов! Сама! И ей всё ещё что-то не нравится?"
      - "Это же оскорбление моего бутика... оскорбление моего вкуса!"
      - "У меня не остаётся выбора, придётся применить крайние меры..."
      - "На сегодня хватит. Возвращайтесь завтра!"
      - "Приведите их всех сюда!"
      - "К тому моменту всё разрешится! Хе-хе-хе-хе..."
