chapter1:
  rows:
  - char: "bennington"
    side: "left"
    text:
      - "Всем доброго утра, дня и вечера~"
      - "С вами Беннингтон, подающий надежды видеоблогер! И сегодня мы отправимся в подробнейший тур по Метрополису Астрариума!"
      - "Если вы следите за моими выпусками, то знаете, что этот город называют городом грёз. Но у него есть и скрытая сторона, полная странных аномалий и тёмных тайн!"
      - "Метрополис — самое сердце Астрариума, обитель абсолютной роскоши! Попасть сюда могут только VIP-гости со специальными приглашениями..."
      - "Но меня, разумеется, это не остановит! Хе-хе, зацените!"
      - "У меня есть собственное персональное приглашение для нас. ♪"
      - "Так что же собой представляет настоящий Метрополис?"
      - "Исследуйте его вместе со мной! Не моргайте, а то пропустите самое интересное!"

chapter2:
  rows:
  - text:
      - "Мы издалека заметили увлечённо работающую Беннингтон."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Настоящий профи, а? Куда бы ни пошла — везде снимает. Неудивительно, что её ролики становятся вирусными!"
  - char: "commander"
    side: "right"
    text:
      - "Вирусными?.. Но разве она сама не назвала себя новичком?"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Хе-хе~ Тебе ещё многому предстоит научиться, Профессор. Это же просто имидж!"
      - "Называя себя новичком, ты показываешь, что не забываешь свои корни~"
  - char: "commander"
    side: "right"
    text:
      - "Выходит, ты тогда тоже начинающий айдол?"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Ой, ну не обязательно нас сравнивать... Но вообще-то я начинающая ассистентка детектива!"
      - "А теперь... Ах, Профессор-детектив, я умираю с голоду~ Я так хочу попробовать тот блинчик..."
  - text:
      - "Ричард жалобно смотрит на меня так, будто я лишил её самой вкусной еды на свете, и не сводит глаз с моего блинчика."
      - "При этом в руке она уже держит половину своего собственного блинчика. Если бы я сам не видел, как она всю дорогу уплетает любую еду, попадающуюся на глаза, мне, возможно, стало бы её жаль."

chapter3:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Не получишь."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Какой же ты вредина... Тогда я угощусь сама. Ам!"
  - char: "commander"
    side: "left"
    text:
      - "Чего?!"

chapter4:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Держи."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Ам... М-м! Какая вкуснотища!"
      - "Спасибо, Профессор! Я так тебя люблю!"

chapter5:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Поменяемся блинчиками?"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Конечно~ Заодно попробуй и меня на вкус!"
  - char: "commander"
    side: "left"
    text:
      - "Эм?.."

chapter6:
  rows:
  - char: "bennington"
    side: "left"
    text:
      - "Кхм... Доброе у-утречко!"
      - "Погода сегодня прекрасная. Просто идеальная для съёмок!"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Доброе утро, мисс видеоблогер! Ты всё ещё снимаешь?"
  - char: "bennington"
    side: "left"
    text:
      - "Пока поставила на паузу. Парочки кадров соло по дороге должно хватить, чтобы закончить выпуск... Ой! Не переживайте, вас двоих я не снимала!"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Мы знаем! Впрочем, мы бы и не злились, даже если бы ты нас сняла."
  - char: "bennington"
    side: "left"
    text:
      - "Правда?! Влог с вами двумя запросто набрал бы сотню миллионов просмотров..."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Я серьёзно~ Запечатлевать прекрасные моменты жизни — это ведь твоя работа, разве не так?"
      - "Просто покажи нам перед тем, как выкладывать."
  - char: "commander"
    side: "left"
    text:
      - "(Хм?)"
  - text:
      - "Мне трудно объяснить это словами, но Ричард сейчас ведёт себя как-то очень странно."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "О чём задумался, Профессор? Думаешь, я странно себя веду, да?"
  - char: "commander"
    side: "right"
    text:
      - "Для айдола, отдыхающего от публичности, ты привлекаешь слишком много внимания."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Хм-м... Мне хочется, чтобы она нас поснимала, но вот публиковать это я, пожалуй, не горю желанием..."
  - char: "bennington"
    side: "right"
    text:
      - "Я так и знала!"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Хе-хе~ Не обижайся. Тебе просто нельзя выкладывать то, где мы с Профессором вместе... а вот видео, где только мы вдвоём с тобой, вполне подойдёт!"
  - char: "bennington"
    side: "right"
    text:
      - "О! Тогда я с радостью воспользуюсь этой возможностью! Эх, это и вправду идеальный день для влога!"

chapter7:
  rows:
  - text:
      - "То, что замышлялось как серьёзное расследование, благодаря им превратилось в экскурсионную прогулку."
      - "Естественно, никаких полезных результатов это не принесло."
      - "В итоге нам пришлось обратиться к круглосуточной службе поддержки Коллетт, чтобы отследить перемещения вора в ночь преступления."
  - char: "collett_rad"
    side: "left"
    text:
      - "Большая часть записей с камер по её маршруту была удалена... за исключением одной, которую мне удалось восстановить."
      - "Взгляните сюда. Видите ту тёмную фигуру в небе? Она исчезла прямо над Астральной Башней."
      - "Астральная Башня — центральная достопримечательность Астрариума, и именно там расположен офис генерального директора."
      - "К сожалению, эту систему мне не взломать. Подделать пропуск туда я тоже не могу."
      - "Если преступник действительно скрывается в Астральной Башне, вам придётся придумать другой способ."
  - char: "bennington"
    side: "right"
    text:
      - "Ого... Это дело становится всё более запутанным."
      - "В такие моменты требуется совместное стратегическое совещание!"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Согласна! Мисс видеоблогер, можешь позвонить остальным участникам фан-клуба? Встретимся в убежище мисс детектива."
      - "И пусть наш начинающий айдол тоже готовится!"
      - "Как её наставница, я должна проверить её успехи. Хе-хе~"
