chapter1:
  rows:
  - text:
      - "После того, что позже назовут Инцидентом в Астрариуме, я тяжело заболел."
      - "Это был первый раз, когда я так сильно слёг с тех пор, как занял свой пост в порту PH (Перл Харбор)."
      - "Ради моей безопасности и выздоровления я прислушался к совету Элизабет и врачей и взял отпуск на несколько недель у Врат Авалона."
      - "Это вынудило меня сократить рабочую нагрузку и пересмотреть приоритеты среди множества задач, требовавших моего внимания."
      - "После того как я насладился несколькими днями отдыха и покоя, прибыл совместный экспедиционный флот Северного Парламента и Железной Крови."
      - "Вскоре после нашего возвращения из Священной Империи Юнитас Северный Парламент получил сигнал бедствия от Киров META, которая отправилась в одиночную экспедицию."
      - "К сообщению прилагались точные координаты тестового полигона и краткий отчёт о ситуации."
      - "После исчезновения Киров к Северному Парламенту присоединилась Железная Кровь, всегда стремившаяся исследовать другие тестовые полигоны, сформировав тем самым совместные экспедиционные силы."
      - "Империя Дракона также прислала персонал, надеясь воспользоваться этой возможностью для сбора данных."
      - "Экспедиционные силы, действующие между тестовыми полигонами, находились под юрисдикцией Лазурного пути."
      - "Северный Парламент уже прислал мне приглашение, и я подумывал лично возглавить флот, чтобы понаблюдать за тестовым полигоном."
      - "Однако в моём нынешнем состоянии от этой затеи пришлось отказаться."

chapter2:
  rows:
  - text:
      - "Поскольку флот отправляется в плавание из Камелота, я присутствую на смотре перед их отбытием."
  - char: "bismarck_z"
    side: "left"
    text:
      - "Мы выступаем лишь в качестве авангарда для разведки. Как только ситуация там прояснится, мы решим, каков будет наш следующий шаг."
  - text:
      - "Флот Железной Крови под предводительством Бисмарк включает в себя Тирпиц, Петер Штрассер, Один, их соответствующие флотилии и отдельную флотилию подводных лодок."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Сосредоточься на своём выздоровлении, товарищ Командир. Мы обещаем вернуться целыми и невредимыми."
  - text:
      - "Флот Северного Парламента под командованием Советского Союза состоит из Кронштадт, Куйбышев, Курск, Чкалов и Волги, а также двух флотилий сопровождения из крейсеров и эсминцев."
  - char: "an_shan"
    side: "left"
    text:
      - "Просто предоставь это нам, Командир."
  - text:
      - "Наконец, Ань Шань возглавляет флот Империи Дракона. Её сопровождают Фу Шунь, Чан Чунь и Тай Юань. К этим четырём ракетным эсминцам присоединилась группа кораблей-арсеналов «Дунъюй»."
  - char: "commander"
    side: "left"
    text:
      - "Вы все прекрасно знаете о рисках экспедиций на другие тестовые полигоны, так что я избавлю вас от скучных нравоучений."
      - "Действуйте осторожно и разберитесь в обстановке, как только представится возможность."
      - "Королевский Флот окажет полную поддержку. Если вам что-нибудь понадобится, сразу дайте им знать."
      - "В случае необходимости я лично возглавлю флот подкрепления."
      - "Желаю вам лёгкого пути и успешной миссии... а главное — безопасного возвращения."