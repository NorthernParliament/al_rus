chapter1:
  rows:
  - char: "administrator_black"
    side: "left"
    text:
      - "*шмыгает носом*... *всхлипывает*..."
  - text:
      - "На следующий день мы пригласили Чёрного администратора в «Сияние☆Навсегда», чтобы она оценила результаты наших стараний."
  - char: "administrator_black"
    side: "left"
    text:
      - "Какая прекрасная музыка... *всхлипывает*... Кажется, будто моя душа очистилась."
      - "*шмыгает носом*... Я так растрогана..."
      - "Вы справились! Вот ваше разрешение на сценическое оборудование! Забирайте!"

chapter2:
  rows:
  - text:
      - "Вручив нам разрешение, Чёрный администратор удалилась, не переставая плакать всю дорогу."
  - char: "john_rodgers"
    side: "left"
    text:
      - "Э-э... Я знаю, что мы сыграли неплохо, но это какая-то слишком бурная реакция."
  - char: "bennington"
    side: "right"
    text:
      - "Судя по тому, как она рыдала, я удивлюсь, если ХОТЬ КАКАЯ-ТО песня не доведёт её до слёз."
  - char: "john_rodgers"
    side: "left"
    text:
      - "А?! Так мы вообще хорошо сыграли или как?!"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Отлично сыграли! Я уж точно одобряю."
  - char: "john_rodgers"
    side: "left"
    text:
      - "Фух... Какое облегчение. Хе-хе, давайте зажжём весь город нашей музыкой!"
  - char: "collett_rad"
    side: "right"
    text:
      - "А разве на самом выступлении вы не собираетесь использовать фонограмму?"
  - char: "vicksburg"
    side: "left"
    text:
      - "Да, по плану именно так..."
  - char: "john_rodgers"
    side: "right"
    text:
      - "Почему?!"
  - char: "harrison"
    side: "left"
    text:
      - "Не забывай, что наша главная цель — помочь Ричард раскрыть тайну украденной записи."
  - char: "john_rodgers"
    side: "right"
    text:
      - "О-о-ох, точно!"
  - char: "bennington"
    side: "left"
    text:
      - "Кажется, у нас этот диалог повторяется уже во второй раз..."
  - char: "john_rodgers"
    side: "right"
    text:
      - "Ничего я не забывала дважды!"
      - "В смысле... Нет, я оба раза прекрасно всё помнила! Ни разу не забывала!"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Простите! Это всё-таки особый случай."
      - "Если нам когда-нибудь представится возможность, я бы с радостью выступила на сцене вместе со всеми вами!"
  - char: "john_rodgers"
    side: "right"
    text:
      - "Правда?! Обещаешь?!"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Ага, обещаю~"
      - "Как бы то ни было, это задание выполнено, так что следующее теперь должно быть доступно."
      - "Снова разделимся?"
  - char: "bennington"
    side: "right"
    text:
      - "Дальше у нас разрешение на костюмы, верно?"
      - "Значит, мы сможем пойти и выбрать наряд в магазине, да? Давайте быстренько разберёмся с этим, проще простого!"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Пойдём, Профессор."
