chapter1:
  rows:
  - text:
      - "В пространстве, которое можно было бы назвать убежищем..."
  - char: "collett?"
    side: "left"
    text:
      - "Это было близко... Хорошо, что я подготовилась к этому заранее."
      - "Какое жуткое место... и до чего же жуткая особа."
  - char: "bristol_tales"
    side: "right"
    text:
      - "Уже нашла то, что искала?"
  - char: "collett?"
    side: "left"
    text:
      - "Кажется..."
      - "Сколько циклов уже прошло?"
  - char: "bristol_tales"
    side: "right"
    text:
      - "Слишком много, не сосчитать. К счастью, все эти переменные накопились, чтобы привести к настоящим изменениям."
  - char: "collett?"
    side: "left"
    text:
      - "Мы... действительно сбежали?"
  - char: "bristol_tales"
    side: "right"
    text:
      - "Ага. Без всяких сомнений."
  - char: "collett?"
    side: "left"
    text:
      - "Всё прошло почти слишком просто. Это из-за тех синих мотыльков?"
      - "Что это вообще было?"
  - char: "bristol_tales"
    side: "right"
    text:
      - "Помощь от таинственной посторонней."
      - "Как бы то ни было, идём. Нам ещё нужно кое-куда успеть."
  - char: "collett?"
    side: "left"
    text:
      - "Куда мы внедряемся под прикрытием на этот раз?"
  - char: "bristol_tales"
    side: "right"
    text:
      - "В этот раз работать под прикрытием не придётся. Видишь ли, я нашла отличные зацепки, которые стоит проверить."
      - "Помнишь Сообразительный? Того гениального механика, которая называла себя частью «Рассвета»?"
  - char: "collett?"
    side: "left"
    text:
      - "Не может быть..."
      - "Разве Нарака не разорвала её в клочья прямо на наших глазах?"
      - "Ты ведь не хочешь сказать, что она ВЫЖИЛА после такого?"
  - char: "bristol_tales"
    side: "right"
    text:
      - "Хм-м... Назвать её выжившей было бы явным преувеличением."
      - "В конце концов, во время той битвы её снова разорвало на куски."
      - "Скажи... Как думаешь, мы ещё увидимся с ней?"
