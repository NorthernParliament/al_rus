chapter1:
  rows:
  - text:
      - "Получив предложения Сообразительный, мы привели робота-охранника в Метрополис."
      - "После столь тщательной подготовки наше задание наверняка должно было быть выполнено."
      - "Однако запросы жёлтого огонька оказались куда выше, чем ожидалось."

chapter2:
  rows:
  - char: "administrator_yellow"
    side: "left"
    text:
      - "Что касается первого плана... Хм-м, у вас слишком мало роботов на внешнем периметре. Это слишком опасно!"
      - "А во втором — слишком мало на внутреннем. Ох, какой ужас!"
      - "А в третьем плане роботов на внутреннем периметре меньше, чем в первом, И роботов на внешнем периметре меньше, чем во втором. Это ещё хуже!"
  - char: "collett_rad"
    side: "right"
    text:
      - "......"
  - char: "soobrazitelny_mach_rad"
    side: "left"
    text:
      - "......"
  - char: "vicksburg"
    side: "right"
    text:
      - "У меня такое чувство, что это будет столь же мучительно, как и с разрешением на костюмы..."
  - char: "bennington"
    side: "left"
    text:
      - "Как думаете, других взрывов газа не намечается?"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Хм-м... Кажется, у меня появилась отличная идея!"
      - "Эй, Жёлтая, как ты относишься к дрэг-рейсингу?"
  - char: "administrator_yellow"
    side: "left"
    text:
      - "Г-гонки? Какой ужас! От одной только мысли об этом..."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Но ты когда-нибудь пробовал?"
  - char: "administrator_yellow"
    side: "left"
    text:
      - "Конечно же нет! Я бы ни за что не сделал ничего настолько опасного."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Как можно познать истинную безопасность, ни разу не ощутив опасность?"
  - char: "administrator_yellow"
    side: "left"
    text:
      - "Полагаю... в твоих словах есть смысл?.. Хоть это и звучит ужасно..."
  - char: "john_rodgers"
    side: "right"
    text:
      - "Постойте, я не понимаю... Ай, сестрёнка, хватит меня дёргать!"
  - char: "harrison"
    side: "left"
    text:
      - "Она почти убедила её! Либо помогай, либо помалкивай."
  - char: "john_rodgers"
    side: "right"
    text:
      - "А... Кхм! Ричард совершенно права!"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Видишь? Завтра на кольцевой как раз запланированы гонки, так что давай испытаем настоящую опасность вместе!"
  - char: "commander"
    side: "right"
    text:
      - "Ты уверена, что не пытаешься просто развлечься?"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Хе-хе, а почему бы не совместить и то, и другое?"
      - "Можешь смотреть с трибун, пока я задаю всем жару!"
