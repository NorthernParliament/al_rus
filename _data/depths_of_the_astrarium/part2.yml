chapter1:
  rows:
  - text:
      - "Мы всё идём и идём, но даже спустя довольно продолжительное время кажется, что мы по-прежнему не дошли до конца переулка."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Хм... Да, это суперстранно. Вроде бы этот переулок не был таким длинным, верно?"
  - text:
      - "Я смотрю вперёд. Пейзаж вдалеке кажется знакомым, но в то же время чем-то отличается."
      - "Я проверяю телефон — время совсем не изменилось. Оно всё так же застыло на полуночи."
  - char: "commander"
    side: "left"
    text:
      - "Ричард, сколько времени на твоём телефоне? Кажется, мой барахлит..."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Время? ...А? Мой тоже застрял на полуночи..."
      - "У тебя то же самое?"
  - char: "commander"
    side: "left"
    text:
      - "Да. Ни на секунду не сдвинулось."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Хм... Когда я звонила тебе, было 23:55, да?"
      - "Значит ли это, что время остановилось, как только мы попытались выбраться из переулка?"
      - "Неудивительно, что мы никак не можем выйти из него."
      - "Вот оно что... Профессор-детектив, кажется, я всё поняла!"
  - text:
      - "Ричард с гордым видом выпячивает грудь, всем своим видом показывая, что разгадала тайну."
  - char: "commander"
    side: "left"
    text:
      - "Поняла... что именно?"
  - text:
      - "Если кто-то из нас двоих и детектив, то явно она. Я вообще без понятия, что происходит."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Мы наткнулись на городскую легенду, Профессор!"
      - "Хм... Должно быть, мы забрели в переулок, который замораживает время, пока ты не найдёшь выход!"
  - char: "commander"
    side: "left"
    text:
      - "Серьёзно? Разве подобные городские легенды реальны?"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Хе-хе, Астрариум — это место, где сбываются все мечты, но жутких легенд здесь ничуть не меньше, чем счастливых сказок!"
      - "Часто говорят, что за каждым сладким сном скрывается тёмная сторона..."
      - "Может быть, эта поговорка — вовсе не пустые суеверия. Возможно, и за слухом, который завлёк нас сюда, кроется доля правды."
      - "Пусть мы и не нашли никаких зацепок о воре, зато нам удалось заглянуть в этот жуткий уголок города. Я бы назвала это маленьким успехом!"
      - "Ой, и насчёт этого переулка... Не переживай так сильно о том, что мы здесь застряли. Я знаю, как всё это устроено!"
      - "Когда ты теряешься в подобном переулке..."
      - "Главное — не паниковать! Сохраняй спокойствие и внимательно смотри по сторонам."
  - char: "commander"
    side: "left"
    text:
      - "...И что же я должен увидеть?"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "По сути, мы играем в «найди отличия»!"
      - "Мы идём вперёд, пока точно не поймём, где начинается следующий виток петли."
      - "А затем каждый раз, заходя на новый круг, ищем любые изменения. Если ничего не изменилось — идём дальше. Если появилось отличие — разворачиваемся назад."
      - "Если сделаем всё правильно, то запросто выберемся!"
  - char: "commander"
    side: "left"
    text:
      - "Искать отличия, значит... В таком случае мы прошли уже немало таких кругов. Нам продолжать идти вперёд или развернуться?"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Конечно же вперёд! Верь мне, Профессор!"
  - text:
      - "Она снова непринуждённо берёт меня за рукав и уверенно шагает дальше."
  - char: "commander"
    side: "left"
    text:
      - "Понял. Полагаюсь на тебя."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Хе-хе-хе~ Погнали-и-и!"
