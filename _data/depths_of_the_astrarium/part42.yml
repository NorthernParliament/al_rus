chapter1:
  rows:
  - text:
      - "Накатила волна напряжения. Я тяжело опустился на сиденье, чувствуя, как сердце готово выпрыгнуть из груди."
      - "Мисс D сидела, свернувшись калачиком в углу, и непривычно тихо рисовала пальцем круги на полу."
  - char: "commander"
    side: "left"
    text:
      - "Мы вернули его... забрали у Бон Омм Ричард..."
  - text:
      - "Обстановка внутри вагона поезда менялась."
      - "Беннингтон, Виксберг, Харрисон, Джон Роджерс и Эссекс META постепенно становились прозрачными."
      - "По словам Йорктаун META, они просто просыпались от сна и возвращались туда, откуда начали, так что беспокоиться было не о чем."
      - "Что же до неё самой, она тоже постепенно растворялась в воздухе."
  - char: "vicksburg_rad"
    side: "left"
    text:
      - "Все зовут тебя Командиром, так что, думаю, я последую их примеру."
      - "Прощай, Командир. Надеюсь, однажды увидимся на одном из моих концертов."
  - char: "harrison_rad"
    side: "right"
    text:
      - "Спасибо, что выручал нас всё это время. В следующий раз угощение снова за нами~"
  - char: "john_rodgers_rad"
    side: "left"
    text:
      - "Поверить не могу, что ты, оказывается, такая важная шишка. Знай я раньше, наладила бы связи получше..."
      - "У меня есть вполне взрослые планы... так что обсудим их при следующей встрече! Не забудь, договорились?"
  - char: "bennington_rad"
    side: "right"
    text:
      - "Все отснятые мной кадры пропали... Полагаю, это и впрямь было похоже на сон."
      - "Но я никогда не забуду это приключение!"
      - "Когда вернёмся, я напишу по нему короткую пьесу. Не терпится услышать твоё мнение!"
  - char: "essex_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "До новой встречи, Командир."

chapter2:
  rows:
  - text:
      - "После того как все они исчезли, Йорктаун тихо присела рядом со мной."
      - "Хоть я и понимал, что их исчезновение безвредно... тот факт, что она избегала смотреть мне в глаза, тревожил."
  - char: "commander"
    side: "left"
    text:
      - "Ты уверена, что в порядке? Ричард здорово по тебе попала."
  - char: "yorktown_meta_rad"
    side: "right"
    status: "is-purple"
    text:
      - "Ты про тот жест пальцами в виде пистолета? Не волнуйся, со мной всё в полном порядке."
  - text:
      - "Она берёт мою руку, разжимает дрожащий кулак и забирает то, что в нём лежало."
      - "Диск с записью покрыт кровью."
  - char: "commander"
    side: "left"
    text:
      - "Неужели я сжимал его так сильно? Я даже не заметил."
  - char: "yorktown_meta_rad"
    side: "right"
    status: "is-purple"
    text:
      - "Твоя храбрость достойна похвалы, и я поражена тем, чего тебе удалось достичь... но тебе не следовало подвергать себя такой опасности."
      - "За такое безрассудство тебе вообще-то полагается выговор..."
  - text:
      - "Ладонь обдаёт прохладой. Когда Йорктаун убирает руки, я вижу, что моя окровавленная кисть возвращается в норму."
  - char: "yorktown_meta_rad"
    side: "right"
    status: "is-purple"
    text:
      - "Я заберу диск. Пообещай мне, что больше не будешь так рисковать."
  - char: "commander"
    side: "left"
    text:
      - "На мне лежит ответственность как на Командире. Если ситуация требует... я не могу колебаться."
      - "Прямо как сегодня."
  - char: "yorktown_meta_rad"
    side: "right"
    status: "is-purple"
    text:
      - "Понятно... Что ж, мне пора идти."
      - "Я проанализирую этот диск. Если что-нибудь выяснится, свяжись с Мемфис."
  - text:
      - "Не дожидаясь моего ответа, Йорктаун исчезает из вагона поезда."
      - "Мир погружается в тишину. Элизабет молча ведёт поезд, а Мисс D всё так же продолжает рисовать круги на полу."

chapter3:
  rows:
  - text:
      - "Та озарённая звёздами грёза подошла к концу."
      - "Её финал был столь же пустынен, как и её начало."
      - "Если и была какая-то разница, то лишь в том, что в этот раз домой вернётся только один человек."
      - "Девушка по имени Пандора уже никогда не вернётся."
      - "Или... всё-таки вернётся?"
