chapter1:
  rows:
  - text:
      - "Мы вернулись в обитель Ошибки XIII с остатками еды. Как оказалось, Коллетт уже выполнила свою задачу."
      - "Робот-кот, точь-в-точь как тот, из ресторана, принял у нас еду, а рядом возникла проекция Коллетт."
  - char: "collett_rad"
    side: "left"
    text:
      - "Я нашла всех пятерых администраторов, отвечающих за разрешения."
      - "Но... если вы действительно хотите устроить концерт, одного их поиска будет явно недостаточно."
  - char: "john_rodgers"
    side: "right"
    text:
      - "Угх... Точно, нам ведь нужно самим организовать оборудование, костюмы и охрану!"
      - "Я совсем забыла..."
  - char: "collett_rad"
    side: "left"
    text:
      - "Хех... Не переживай. У меня есть надёжные контакты по всем этим пунктам, и я с радостью вас познакомлю."
      - "Однако подготовку площадки и рекламу вам придётся взять на себя."
      - "Но если вам понадобится кто-то, кто взломает все рекламные щиты в Верхнем и Нижнем городах ради вашей рекламы, что ж..."
  - char: "vicksburg"
    side: "right"
    text:
      - "Ни в коем случае!"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Профессор, давай расставим приоритеты в нашем списке задач."
      - "Думаю, получение разрешения на использование площадки — наш главный приоритет. Это совершенно точно первое, чем нам стоит заняться."
      - "Дальше идут костюмы и сценическое оборудование. Нужно подготовить их, прежде чем делать промоматериалы."
  - char: "bennington"
    side: "right"
    text:
      - "Я могу помочь снять проморолик!"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Спасибо за инициативу! Впрочем, я бы всё равно выбрала тебя."
      - "И только когда со всем этим будет покончено, мы сможем заняться охраной."
      - "Я в этом не особо разбираюсь, так что... мисс специалист по безопасности, мы правда можем доверять твоим знакомым?"
  - char: "collett_rad"
    side: "right"
    text:
      - "На все сто процентов. К тому же они обойдутся по выгодной цене."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Тогда я не против. Что думаешь, Профессор?"
  - text:
      - "План дальнейших действий, предложенный Ричард, идеален."
  - char: "commander"
    side: "left"
    text:
      - "Я тоже не против. Поступим по твоему плану."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Хе-хе, супер!"
