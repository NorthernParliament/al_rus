chapter1:
  rows:
  - char: "error_xiii"
    side: "left"
    text:
      - "Добро пожаловать в обитель Ошибки XIII. Чем могу помочь?"
  - text:
      - "Следуя за Эссекс по улицам-лабиринтам, мы добрались до конспиративной точки её специалиста по безопасности."
      - "Дверь была распахнута настежь. Стены и потолок покрывали бесчисленные мониторы, среди которых лениво плавал единственный электронный осьминог."
      - "В центре комнаты возвышался гигантский сферический робот-кот. Механическое приветствие, судя по всему, доносилось именно из его динамиков."
  - char: "essex_detective"
    side: "left"
    text:
      - "Она всё-таки специалист по безопасности. Такие люди обычно излишне щепетильны во всём, что касается их личной неприкосновенности."
      - "Давно не виделись, Ошибка XIII. Сегодня я здесь лишь как посредница — эти сыщики хотят сделать заказ."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Мы с Профессором-детективом расследуем кражу мастер-записи моей новой песни!"
  - char: "error_xiii"
    side: "left"
    text:
      - "Понятно. Нужна моя помощь в поиске улик?"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Нет, зацепка у нас уже есть. Но тот, кто готов её предоставить, взамен требует новую личность и надёжное убежище."
  - char: "error_xiii"
    side: "left"
    text:
      - "Принято. Прежде чем я озвучу расценки, есть ли какие-то конкретные пожелания к личности или расположению убежища?"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Хм... Да вроде никаких особых? Всё на твоё усмотрение."
  - char: "error_xiii"
    side: "left"
    text:
      - "Прекрасно. Формирую расчёт..."
      - "Сперва новая личность. Как тебе такая сумма?"
  - text:
      - "Электронный осьминог взмахивает щупальцем, и на экране появляется семизначное число."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Ага! Меня устраивает."
  - text:
      - "Ричард без малейших колебаний соглашается."
      - "Робот на мгновение замирает. Затем чуть более сдержанным тоном продолжает..."
  - char: "error_xiii"
    side: "left"
    text:
      - "Хорошо. А как насчёт такой суммы за убежище?"
  - text:
      - "Ещё один взмах щупальца — и на экране загорается восьмизначная сумма."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Ага! Меня устраивает."
  - text:
      - "Она снова с лёгкостью даёт добро."
  - char: "bennington"
    side: "left"
    text:
      - "Ого... Вот это я понимаю — суперзвезда..."
  - char: "john_rodgers"
    side: "right"
    text:
      - "Хмф! Когда-нибудь и Виксберг сможет вот так же сорить деньгами!"
  - char: "vicksburg"
    side: "left"
    text:
      - "Угх... Я буду стараться изо всех сил!"
  - text:
      - "Робот умолкает. Спустя некоторое время прямо в воздухе возникает трёхмерная проекция."
  - char: "collett_rad"
    side: "left"
    text:
      - "Вот она, Ричард во всей красе... Для меня честь вести с тобой дела."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Взаимно, мисс специалист по безопасности!"
  - char: "commander"
    side: "left"
    text:
      - "Я удивлён, что ты решила показаться лично."
  - char: "collett_rad"
    side: "right"
    text:
      - "Такие клиенты попадаются мне не каждый день."
      - "Чтобы расследовать преступление, вам понадобится свобода передвижения. В таком случае вам могут пригодиться и другие мои услуги..."
      - "К примеру, разрешения на перемещение, разрешения на ночное пребывание, разрешения на покупки, разрешения на ночной перекус... Всякая подобная занудная бюрократия."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Давай! Не против посчитать стоимость за всё разом?"
  - char: "bennington"
    side: "right"
    text:
      - "Эм-м... Что это ещё за странные разрешения?"
  - char: "harrison"
    side: "left"
    text:
      - "Неужели даже для похода по магазинам нужно разрешение?"
  - char: "essex_detective"
    side: "right"
    text:
      - "Насчёт этого..."

chapter2:
  rows:
  - char: "vicksburg"
    side: "left"
    text:
      - "Значит, всё это время они влияли и на нас... А я даже не замечала."
  - char: "bennington"
    side: "right"
    text:
      - "Потрясающая тема для ролика! Я знала, что не зря приехала в этот город!"
  - char: "collett_rad"
    side: "left"
    text:
      - "Для всех вас вместе... как вам такая цена?"
      - "Круглосуточную поддержку по вызову накину бонусом."
      - "Разумеется, исключительно в онлайн-режиме."
  - text:
      - "Осьминог взмахивает щупальцем, и на этот раз на экране загорается девятизначное число."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Ага! Меня устраивает."
  - text:
      - "Ричард снова повергает всех нас в шок."
  - char: "collett_rad"
    side: "left"
    text:
      - "Э-э..."
      - "Обычно в этот момент люди начинают жаловаться на расценки..."
  - text:
      - "Даже сама исполнительница, назвавшая сумму, от неожиданности теряет дар речи."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Дело срочное, каждая секунда на счету! Сделай нам всё по ускоренной программе, пожалуйста!"
  - char: "collett_rad"
    side: "right"
    text:
      - "Впервые за долгое время у меня даже проснулась мотивация к работе."
      - "Ладно. Теперь вы мой главный приоритет... Предоставьте остальное мне!"
