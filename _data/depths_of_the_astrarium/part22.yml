chapter1:
  rows:
  - text:
      - "Следуя вчерашнему распределению обязанностей, мы с Ричард отправились к администратору, отвечающей за разрешения на сценическое оборудование."
  - char: "administrator_black"
    side: "left"
    text:
      - "*всхлипывает*... Мне так грустно..."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Приветик!"
  - char: "administrator_black"
    side: "left"
    text:
      - "Так невыносимо грустно..."
  - char: "commander"
    side: "right"
    text:
      - "Давай ближе к делу, пожалуйста."
  - char: "administrator_black"
    side: "left"
    text:
      - "*всхлипывает*... Разрешение на сценическое оборудование, да..."
      - "*всхлипывает*... Я хочу услышать музыку, которая тронет моё сердце..."
      - "Если вы сможете сыграть для меня трогательную музыку, разрешение ваше..."
  - char: "commander"
    side: "right"
    text:
      - "Музыку, трогающую сердце, значит? Вроде проникновенной песни?"
  - char: "administrator_black"
    side: "left"
    text:
      - "*всхлипывает*... Если вы хотите устроить шоу, у вас должна быть группа... Я хочу услышать вашу музыку вживую!"
  - char: "commander"
    side: "right"
    text:
      - "А это значит..."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Профессор, давай соберём свою группу!"
  - char: "commander"
    side: "right"
    text:
      - "ЧТО?!"

chapter2:
  rows:
  - text:
      - "После этого мы направились в кабинет администратора, отвечающего за разрешение на костюмы, но на месте никого не оказалось."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Может, одно из правил этого города — брать только по одному заданию за раз?.."
  - char: "commander"
    side: "right"
    text:
      - "Если так, то ничего не поделаешь."
      - "Насчёт этой идеи с группой..."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Соглашайся, Профессор! В конце концов, мы ведь вместе взялись за эту просьбу!"
      - "Не переживай — я всему тебя научу. Будет весело~"

chapter3:
  rows:
  - text:
      - "Когда мы вернулись в убежище, группа Виксберг пришла в то же самое время."
      - "Как и мы с Ричард встретили только одного администратора, они тоже успели повидаться лишь с одним поставщиком."
  - char: "harrison"
    side: "left"
    text:
      - "Должно быть, это такое правило города..."
  - char: "john_rodgers"
    side: "right"
    text:
      - "Тц! Этот город всеми силами пытается сорвать наше шоу. Какая морока!"
  - char: "bennington"
    side: "left"
    text:
      - "Без паники, народ. Будем просто двигаться шаг за шагом! Переговоры с Саратогой ведь прошли на ура, помните?"
  - char: "commander"
    side: "right"
    text:
      - "Значит, договор на аренду сценического оборудования готов?"
  - char: "vicksburg"
    side: "left"
    text:
      - "Всё верно. Она полностью оправдывает свою репутацию — у неё там целый склад, битком набитый инструментами и аппаратурой!"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Тогда остался лишь вопрос с нашей группой."
  - char: "commander"
    side: "left"
    text:
      - "(До сих пор не могу поверить, что мы реально это делаем...)"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Кто-нибудь из вас играл раньше на музыкальных инструментах?"
  - char: "john_rodgers"
    side: "left"
    text:
      - "Конечно! Для капитана фан-клуба это в порядке вещей!"
  - char: "harrison"
    side: "right"
    text:
      - "Роджерс втайне усердно репетировала, чтобы однажды сыграть вместе с Беннингтон~"
  - char: "john_rodgers"
    side: "left"
    text:
      - "Не втайне! В смысле... Н-нет, я вообще не репетировала!"
      - "Ай... Всё не так. Эм-м... В смысле, не так уж и усердно я репетировала!"
  - char: "bennington"
    side: "right"
    text:
      - "Ха-ха-ха... Я немного репетировала с ними, но в основном ради влогов."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Что ж, время объявить наш состав!"
      - "Новичок — на вокале, видеоблогер — за барабанами, капитан фан-клуба — на бас-гитаре, вице-капитан — на гитаре, а мы с Профессором вдвоём сядем за клавишные~"
      - "Не хочешь присоединиться к нам, мисс специалист по безопасности? Нам бы пригодился синтезатор."
  - char: "collett_rad"
    side: "right"
    text:
      - "Звучит как лишняя морока. Я пас."
  - char: "commander"
    side: "left"
    text:
      - "Ладно, а можно я тоже..."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "ЕЙ можно отказаться, а тебе — нет!"
      - "Репетировать будем в магазинчике Сары!"
      - "Репетиции начинаются завтра. Договорились? Договорились!"
