chapter1:
  rows:
  - text:
      - "Низкие карнизы, узкие улицы."
      - "Тусклые уличные фонари, мерцающие стальные джунгли."
      - "Похоже, я стою в переулке в тени какого-то города."
  - char: "commander"
    side: "left"
    text:
      - "(Но где именно?)"

chapter2:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Теперь я вспоминаю... Это Астрариум."
      - "(А я...)"

chapter3:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Странник... сбившийся с пути? ...Звучит как-то не так."
      - "(Зачем я здесь?)"

chapter4:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Если я странник... значит, я пришёл сюда, чтобы кого-то найти?"

chapter5:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Или... чтобы исполнить мечту? Нет, вряд ли дело в этом..."

chapter6:
  rows:
  - char: "bon_omm_richard2_rad"
    side: "right"
    text:
      - "Профессор, ты в порядке? Ты вдруг замолчал."
      - "...Профессор?"
  - text:
      - "Пока я блуждаю в тумане собственных мыслей, до меня доносится обеспокоенный девичий голос."
  - char: "commander"
    side: "left"
    text:
      - "Ричард?"
  - text:
      - "Туман в голове немного рассеивается, позволяя вспомнить её имя и то, кто она такая."
  - char: "commander"
    side: "left"
    text:
      - "(Она официальный представитель ВМС Океанической Федерации и всемирно известный айдол...)"
      - "(Но почему она звонит мне?)"
      - "(И называет меня «Профессором»... Я её наставник?)"
      - "(В таком случае она должна знать, зачем я прибыл в Астрариум.)"
      - "...Ричард? Где ты?"
  - char: "bon_omm_richard2_rad"
    side: "right"
    text:
      - "А? Ты же только что спрашивал об этом, Профессор!"
      - "Я так и знала, что с этим переулком что-то нечисто... Зацепка наверняка оказалась ложной. Нам лучше поскорее убраться отсюда!"
      - "Жди меня там, Профессор. Я сейчас подойду к тебе!"

chapter7:
  rows:
  - text:
      - "Спустя несколько минут появляется девушка с длинными серебристыми волосами и подходит ко мне."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Фух... После того как мы разделились, мне показалось, что пришлось сделать приличный крюк, но на деле я нашла тебя довольно быстро."
      - "С этим переулком определённо творится какая-то чертовщина!"
      - "Вот что бывает, когда решаешь проверить глупые слухи..."
      - "Пойдём, Профессор-детектив! Надо поскорее убираться отсюда!"
  - char: "commander"
    side: "left"
    text:
      - "...Профессор-детектив?"
  - text:
      - "Внезапно мне кажется, что обращение ко мне стало уж слишком длинным."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Ты ведь здесь, чтобы помочь расследовать кражу мастер-записи моей новой песни, верно? На тебе наряд детектива, так что всё сходится!"
  - text:
      - "Она права: на мне тренч в стиле Королевского Флота и даже охотничья шляпа с двумя козырьками."
  - char: "commander"
    side: "left"
    text:
      - "Ладно... Значит, я Командир-детектив, прибывший в Астрариум расследовать кражу твоей мастер-записи..."
  - text:
      - "Наконец-то мысли в голове окончательно проясняются."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Ты — детектив, а я — ассистентка. Мы работаем под прикрытием и вершим великие дела здесь, в Астрариуме... по крайней мере, так было написано в первоначальном сценарии!"
      - "Но нас сбила с толку ложная зацепка, и в итоге мы заблудились в этом странном переулке..."
      - "Подсовывать нам дезинформацию — это было совсем не круто!"
      - "Пойдём скорее, Профессор! Мне уже становится не по себе... Не хочу больше здесь оставаться!"
  - text:
      - "Ричард как ни в чём не бывало берёт меня за рукав и ведёт к выходу из переулка."
  - char: "commander"
    side: "left"
    text:
      - "Да... Так и поступим."
