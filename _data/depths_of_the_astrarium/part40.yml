chapter1:
  rows:
  - text:
      - "Посреди вздымающегося белого простора девушка на троне машет мне рукой."
  - char: "hierophant"
    side: "left"
    status: "is-lightgray"
    text:
      - "Какое облегчение видеть, что ты в порядке."
      - "Хоть прошло всего несколько дней, ты вновь оказываешься в опасности."
  - text:
      - "Иерофант, которая, без сомнения, выжидала снаружи идеального момента для вторжения в Астрариум, восседает на троне."
  - char: "commander"
    side: "left"
    text:
      - "Ты теперь можешь говорить?!"
  - char: "hierophant"
    side: "right"
    status: "is-lightgray"
    text:
      - "........."
      - "*вздыхает*... Послушай."
      - "Ты хоть представляешь, что на самом деле происходит в этом городе?"
      - "Впрочем. Полагаю, ты всё равно не поймёшь."
  - char: "commander"
    side: "left"
    text:
      - "Эм?.."
  - char: "bon_omm_richard"
    side: "right"
    status: "is-gray"
    text:
      - "Э-э-эй! Ты пришла подраться с нами или как?"
  - char: "hierophant"
    side: "left"
    status: "is-lightgray"
    text:
      - "Какая морока... Дай мне разобраться с этим, а затем мы сможем обсудить твою эвакуацию."
      - "Ах да. Надень это, оно защитит тебя."
  - text:
      - "Она выдёргивает белые нити из белой массы, сплетает из них корону и надевает мне на голову."
  - char: "hierophant"
    side: "left"
    status: "is-lightgray"
    text:
      - "О-о. Весьма недурно."
  - text:
      - "Затем она сплетает ещё несколько."
  - char: "hierophant"
    side: "left"
    status: "is-lightgray"
    text:
      - "Это для Смерти и остальных девочек. Мы ведь не хотим, чтобы они пострадали, правда?"
  - char: "bon_omm_richard"
    side: "right"
    status: "is-gray"
    text:
      - "Ау-у-у? Ты идёшь или нет?"
      - "Ты готова-а-а?"
      - "А вот и я-я-я!"
  - char: "hierophant_x"
    side: "left"
    status: "is-gray"
    text:
      - "ПО■ЖРА ТЬ▇█ВСЁ▇▇█"

chapter2:
  rows:
  - text:
      - "БАБАХ!!!"
      - "Армии Иерофант и Бон Омм Ричард сталкиваются."
      - "Кажется, само пространство разрывается надвое от ударов, сотрясающих всё от моря до небес."
      - "Мисс D, флот Беннингтон и я держимся у берега, ожидая исхода противостояния."
  - char: "bennington"
    side: "left"
    text:
      - "Послушай, эм... Эти белые... «штуковины» твои друзья?"
  - char: "commander"
    side: "right"
    text:
      - "Они союзники. По крайней мере, пока что."
  - char: "harrison"
    side: "left"
    text:
      - "Пока что?.."
  - char: "commander"
    side: "right"
    text:
      - "Вы когда-нибудь слышали об Антиохе?"
  - char: "bennington"
    side: "left"
    text:
      - "Антиох... Не-а, никогда о них не слышала!"
  - char: "commander"
    side: "right"
    text:
      - "А о Сиренах?"
  - char: "vicksburg"
    side: "left"
    text:
      - "О Сиренах мы знаем."
      - "Пока мы не оказались в этом городе, мы вели с ними непрекращающуюся войну."
  - char: "john_rodgers"
    side: "right"
    text:
      - "Это те жуткие машины, похожие на морских чудищ!"
      - "Мы уже целую вечность с ними сражаемся!"
  - char: "commander"
    side: "left"
    text:
      - "Тогда всё просто. Сирены и Антиох — а следовательно, и армия Иерофант — это одно и то же."
  - char: "bennington"
    side: "right"
    text:
      - "А?"
  - char: "commander"
    side: "left"
    text:
      - "Антиох эволюционировал из своей первоначальной формы в то, что мы видим сегодня, а мы даже этого не заметили."

chapter3:
  rows:
  - text:
      - "ГРОХОТ..."
  - char: "bon_omm_richard"
    side: "right"
    status: "is-gray"
    text:
      - "Неплохо... Очень даже неплохо! Иерофант, ты умеешь развлечь девушку!"
      - "Не думала, что ты сможешь подобраться ко мне настолько близко!"
      - "Так вот какой путь выбрал Антиох, раз уж вы не способны пройти через METAморфоз!"
  - char: "hierophant"
    side: "left"
    status: "is-lightgray"
    text:
      - "......"
      - "Из уважения к нашим прошлым отношениям я дарую тебе покой, Бон Омм Ричард."
  - char: "bon_omm_richard"
    side: "right"
    status: "is-gray"
    text:
      - "Что ж, ты всё так же высокомерна, как и всегда. Посмотрим, хватит ли у тебя сил подтвердить эти слова делом!"
  - char: "hierophant"
    side: "left"
    status: "is-lightgray"
    text:
      - "..."
      - "Мы привлекли внимание, Командир. Кое-кто хочет присоединиться к бою."
      - "И, похоже, это твои друзья. Мне впустить их?"
  - char: "commander"
    side: "right"
    text:
      - "(Хотят присоединиться к бою? Неужели?!..)"
      - "Да, пожалуйста!"
  - char: "hierophant"
    side: "left"
    status: "is-lightgray"
    text:
      - "Что ж, хорошо."
  - text:
      - "Не похоже, чтобы она сделала что-то особенное, но коммуникатор Мисс D внезапно начинает пищать."
  - char: "queen_elizabeth_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "Фух... Мы НАКОНЕЦ-ТО нашли тебя!"
      - "У тебя ещё остались силы продолжать?"
  - char: "memphis_meta_rad"
    side: "right"
    status: "is-purple"
    text:
      - "Командир! Прости, что мы опоздали!"
  - char: "commander"
    side: "left"
    text:
      - "(Элизабет META и Компилирующее Поле...)"
      - "(Понятно. Если Хелена действительно захотела бы прийти сюда, то даже Иерофант вряд ли смогла бы её удержать.)"
      - "Пока что всё в порядке. Иерофант встала на нашу сторону, но нам всё ещё противостоит Бон Омм Ричард. Будьте осторожны."
  - char: "queen_elizabeth_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "О? Как бы Нам хотелось быстро с этим покончить, пока ты поёшь Нам дифирамбы... Пожалуй, нам всё же стоит подготовить поезд."
  - char: "memphis_meta_rad"
    side: "left"
    status: "is-purple"
    text:
      - "Компилирующее Поле фиксирует твои координаты. Подкрепление скоро прибудет!"
  - char: "bon_omm_richard"
    side: "right"
    status: "is-gray"
    text:
      - "Хи-хи-хи! Чем больше, тем веселее! Зовите всех, кого хотите!"
