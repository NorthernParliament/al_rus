chapter1:
  rows:
  - text:
      - "Пока мы ждали, когда огонёк придёт в себя, Ричард сходила на фудкорт и принесла нам обед."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Фух... Вот это я понимаю — блаженство..."
      - "Никаких выступлений, никаких репетиций, вообще никакой работы."
      - "Можно просто уплетать вкуснятину и весь день проводить время с моим дорогим, любимым Профессором..."
  - text:
      - "Она лениво растягивается на диване, не проявляя ни малейшего намёка на свой привычный образ айдола."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Я хотела, чтобы ты увидел меня настоящую."
      - "К тому же, что плохого в капельке гэп-моэ время от времени?"
      - "Не зря ведь людям это так нравится."
      - "Ну вот... Она всё ещё не проснулась. Меня от этого тоже в сон клонит... Хр-р-р..."
  - text:
      - "После столь яркого всплеска энергии Ричард внезапно снова размякает."
  - char: "commander"
    side: "left"
    text:
      - "Она прямо как ураган."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Хе-хе. Спасибо, Профессор!"

chapter2:
  rows:
  - char: "eyewitness_yellow"
    side: "left"
    text:
      - "Угх... Где я?"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Ой, Профессор, она очнулась!"
  - char: "eyewitness_yellow"
    side: "left"
    text:
      - "И-ик! П-почему вы двое всё ещё здесь?!"
  - char: "commander"
    side: "right"
    text:
      - "Давайте все успокоимся. Я детектив и нахожусь здесь, чтобы найти вора."
      - "Если ты расскажешь нам, кто это сделал, я гарантирую твою безопасность."
  - char: "eyewitness_yellow"
    side: "left"
    text:
      - "П-правда?"
  - text:
      - "Маленький огонёк слегка мерцает, словно борясь с внутренними сомнениями."
  - char: "eyewitness_yellow"
    side: "left"
    text:
      - "Хорошо... Согласно правилам Астрариума..."
      - "Если ты гарантируешь мою безопасность, тогда я выложу всё, что знаю."
  - char: "commander"
    side: "right"
    text:
      - "Правилам Астрариума?"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Я знаю, я знаю!"
      - "В Астрариуме желания должны обмениваться на желания равной ценности."
      - "Чтобы исполнилось наше желание, сначала мы должны исполнить её... Разве не так?"
  - char: "eyewitness_yellow"
    side: "right"
    text:
      - "Да! Я хочу новую личность и надёжное убежище, чтобы спрятаться, пожалуйста!"
      - "Иначе, если вы двое всё испортите, мне крышка... О господи..."
  - char: "commander"
    side: "left"
    text:
      - "Новая личность и убежище, значит? Для чужаков вроде нас это может оказаться непростой задачей."
      - "Но... один знакомый детектив с собственным убежищем вполне может знать способ."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Она И ВПРЯМЬ похожа на ту, у кого есть тёмная, скрытная сторона, да?"
  - text:
      - "БИП-БИП!"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Хм? Это от того начинающего айдола?"
      - "Эм-м, она и её фан-клуб пишут, что хотят поблагодарить меня лично."
  - char: "commander"
    side: "left"
    text:
      - "Сейчас, возможно, не самое подходящее время."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Нам не хватает людей, Профессор. Что если попросить их помочь?"
  - char: "commander"
    side: "left"
    text:
      - "Не хотелось бы втягивать в это посторонних..."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Не переживай ты так! Уверена, ей ещё не раз понадобится помощь, так пусть отработает. Таковы правила, в конце концов!"
      - "Они говорят, что сейчас в Нижнем городе. Мы как раз собираемся туда, так что встретимся на месте!"
      - "Не возражаешь, если я так ей и напишу?"
  - char: "commander"
    side: "left"
    text:
      - "Ладно, поступим по-твоему."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Хе-хе... Ты лучший, Профессор!"
