chapter1:
  rows:
  - text:
      - "ГРОХОТ..."
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Dieu et mon droit. («Бог и моё право»)"
  - text:
      - "«Свет Королевы» мчался высоко в небе, оставляя за собой золотой след, подобно падающей звезде. Он прочертил тонкую, но чёткую границу между сражающимися белым и чёрным."
  - char: "bon_omm_richard"
    side: "right"
    status: "is-gray"
    text:
      - "Ва-а-ау, какой красивый поезд!"
      - "Ты козырь тестового полигона бета?"
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "......"
      - "Honi soit qui mal y pense. («Пусть стыдится подумавший плохо об этом»)"
  - text:
      - "Золотой свет хлынул от поезда, рассеивая тьму и обращая её в гигантов в багровых доспехах."
  - char: "bon_omm_richard"
    side: "right"
    status: "is-gray"
    text:
      - "О-о, а это крутой приёмчик!"
      - "Потрясно! Ладненько, я готова! Покажите мне всё, на что способны!"

chapter2:
  rows:
  - text:
      - "ГРОХОТ..."
      - "Высоко в небе разразилась синяя буря. Сквозь неё смутно проглядывали очертания внутреннего дворика."
  - char: "yorktown_meta"
    side: "left"
    status: "is-purple"
    text:
      - "Не смей... даже пальцем тронуть Командира!"
  - text:
      - "Синяя фигура, объятая громом, в мгновение ока разбивает вдребезги парящий силуэт Ричард."
      - "Однако мгновение спустя та снова появляется из тумана."
  - char: "bon_omm_richard"
    side: "right"
    status: "is-gray"
    text:
      - "Давненько не виделись, Йорктаун."
      - "Тебе не следовало сюда приходить~ Прах к праху, тлен к тлену..."
      - "Бах!"
  - text:
      - "Йорктаун обращается в пепел, но тут же материализуется вновь во вспышке молнии."
  - char: "bon_omm_richard"
    side: "right"
    text:
      - "А?"
  - char: "yorktown_meta"
    side: "left"
    status: "is-purple"
    text:
      - "........."
  - text:
      - "Словно в ответ на атаку Ричард, удар молнии вновь разносит её на куски."
  - char: "bon_omm_richard"
    side: "right"
    status: "is-gray"
    text:
      - "Хех. Раз не хочешь поболтать о прошлом, тогда просто присоединяйся к веселью. Ну же! Драки хватит на всех!"

chapter3:
  rows:
  - text:
      - "ГРОХОТ..."
      - "Битва, не поддающаяся никакой логике, разворачивалась во всех уголках этого пространства."
      - "Молнии распускались цветами, чёрный туман обращался гигантами, а материя возникала из небытия лишь затем, чтобы мгновение спустя быть стёртой в порошок. Казалось, законы физики здесь жили своей собственной жизнью."
      - "Однако чёрный туман продолжал господствовать над доброй половиной пространства. Это не изменилось ни с прибытием Иерофант, ни с появлением Элизабет или Йорктаун."
  - char: "yorktown_meta"
    side: "left"
    status: "is-purple"
    text:
      - "Мы не можем и дальше затягивать этот бой... Командир, немедленно отступай!"
  - char: "hierophant"
    side: "right"
    status: "is-lightgray"
    text:
      - "Я полностью стабилизировала периметр подконтрольной зоны. Все, кто хочет эвакуироваться, готовьтесь прямо сейчас."
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Так вот она какая, легендарная Бон Омм Ричард. Она во много раз опаснее, чем гласили слухи!"
  - char: "commander"
    side: "right"
    text:
      - "Мы отступаем на поезде?"
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Все по вагонам. И тебя это тоже касается, Йорктаун."
  - char: "yorktown_meta"
    side: "right"
    status: "is-purple"
    text:
      - "...Хорошо."
  - char: "commander"
    side: "left"
    text:
      - "Иерофант, а что будешь делать ты?"
  - char: "hierophant"
    side: "right"
    status: "is-lightgray"
    text:
      - "Хе-хе. Неужели тебе стоит сейчас волноваться обо мне? Я последняя, о ком тебе нужно здесь беспокоиться... не считая Ричард."
      - "Как только вы все уйдёте, я тоже покину это место."
  - char: "commander"
    side: "left"
    text:
      - "В таком случае..."
      - "Беннингтон, забери остальных и ждите в поезде."
      - "Йорктаун, Элизабет, Иерофант. Надавите на Ричард чуть сильнее и отвлеките её внимание на какое-то время."
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Что ты задумал?"
  - char: "hierophant"
    side: "left"
    status: "is-lightgray"
    text:
      - "Любопытно..."
  - char: "yorktown_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Нет... Это не стоит такого риска!"
  - char: "commander"
    side: "left"
    text:
      - "Я не хочу оставлять за собой нерешённых вопросов. Хотя бы в этот раз позвольте мне рискнуть."
  - text:
      - "Огромный кит Мисс D готовится к удару."
      - "Все трое больше ничего не говорят и возвращаются к сражению с туманом."
  - char: "commander"
    side: "left"
    text:
      - "Мисс D, приготовь Косу Смерти. На этот раз наша цель — диск с мастер-записью Ричард."
      - "Давай вернём то, что потеряли!"
  - char: "miss_d"
    side: "right"
    text:
      - "Отлично!"

chapter4:
  rows:
  - text:
      - "ГРОХОТ..."
      - "Во время их совместной атаки наконец наступает момент, которого я так ждал."
  - char: "bon_omm_richard"
    side: "right"
    status: "is-gray"
    text:
      - "Ой-ой."
  - text:
      - "Улыбающееся лицо Бон Омм Ричард возникает всего в паре сантиметров от меня."
  - char: "commander"
    side: "left"
    text:
      - "Попалась!"
  - text:
      - "С помощью Мисс D мне удаётся отобрать у неё диск. В мгновение ока я оказываюсь у дверей поезда."
  - char: "commander"
    side: "left"
    text:
      - "Элизабет, уходим!"
  - char: "bon_omm_richard"
    side: "right"
    status: "is-gray"
    text:
      - "Уже уходишь, Профессор?"
      - "Я хотела сделать тебе подарок в благодарность за то, что составил мне компанию!"

chapter5:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "...Какой подарок?"
  - char: "bon_omm_richard"
    side: "right"
    status: "is-gray"
    text:
      - "Просто делюсь информацией из чистых побуждений~"

chapter6:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Могу я отказаться?"
  - char: "bon_omm_richard"
    side: "right"
    status: "is-gray"
    text:
      - "Ха-ха-ха! Не переживай, это просто информация."

chapter7:
  rows:
  - char: "bon_omm_richard"
    side: "right"
    status: "is-gray"
    text:
      - "Ты хочешь уничтожить меня, но не знаешь как, верно?"
      - "Способ до смешного прост, и я с радостью расскажу тебе о нём~"
  - char: "commander"
    side: "left"
    text:
      - "О чём ты вообще говоришь?"
  - char: "bon_omm_richard"
    side: "right"
    status: "is-gray"
    text:
      - "<span class=temp_red>Пандора — моё ядро. Уничтожишь её — уничтожишь и меня.</span>"
      - "<span class=temp_red>Иными словами, тот факт, что я всё ещё жива... должен означать, что Пандора всё ещё где-то там, пра-а-авда?</span>"
  - char: "yorktown_meta"
    side: "left"
    status: "is-purple"
    text:
      - "Пандора... Нет! Как такое возможно?"
  - char: "hierophant"
    side: "right"
    status: "is-lightgray"
    text:
      - "Но разве она не..."
  - char: "bon_omm_richard"
    side: "left"
    status: "is-gray"
    text:
      - "Застала вас врасплох!"
  - text:
      - "Чёрный вихрь внезапно меняет форму и устремляется к поезду, словно копьё."
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Приготовиться к отступлению!"
  - char: "bon_omm_richard"
    side: "right"
    status: "is-gray"
    text:
      - "Ха-ха-ха-ха! Пока-пока! До скорой встречи!"

chapter8:
  rows:
  - text:
      - "Озарённый золотым сиянием «Свет Королевы» оставляет позади Ричард и её коварную ловушку."
      - "Мгновенно мир за окнами обращается в бесконечную пустоту, убеждая нас в том, что мы наконец в безопасности."
