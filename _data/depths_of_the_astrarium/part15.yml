chapter1:
  rows:
  - text:
      - "После ужина мы встретились с Виксберг и её фан-клубом в убежище Эссекс."
  - char: "vicksburg"
    side: "left"
    text:
      - "Если вы ищете способ попасть в Астральную Башню, у меня как раз есть одна интересная мысль."
      - "Взгляните на эту новостную статью. Владелец Астральной Башни организует общегородской фестиваль и объявил открытый приём заявок на участие в программе..."
      - "Если номер пройдёт отбор, вся команда сможет выступить прямо внутри Астральной Башни!"
      - "Это может стать отличной возможностью проникнуть туда и провести расследование!"
  - text:
      - "Сведения Виксберг и впрямь заслуживают пристального внимания."
  - char: "john_rodgers"
    side: "left"
    text:
      - "Выступление, значит? Что ж... В такие сжатые сроки мы сможем подготовить только один номер, верно?"
  - char: "harrison"
    side: "right"
    text:
      - "Какой номер?"
  - char: "john_rodgers"
    side: "left"
    text:
      - "Да брось, Харрисон! Выступление АЙДОЛОВ! У нас ведь прямо здесь сразу два айдола, разве нет?!"
  - char: "harrison"
    side: "right"
    text:
      - "Ого-о-о, какая ты умная!"
  - char: "john_rodgers"
    side: "left"
    text:
      - "Ха! В отличие от тебя, я всё-таки взрослый капитан фан-клуба!"
      - "Они совершенно точно выберут дуэт Виксберг и Ричард, и тогда мы сможем беспрепятственно войти в башню!"
  - char: "bennington"
    side: "right"
    text:
      - "Да! И такое шоу будет настолько потрясающим, что зажжёт весь город!"
  - char: "vicksburg"
    side: "left"
    text:
      - "А? Концерт с самой Ричард?! А-ах, на меня вдруг свалилась такая ответственность... Я... я сделаю всё возможное, чтобы не отставать!"
  - char: "commander"
    side: "right"
    text:
      - "Значит, решено?"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Эй! Эй, Профессор, у меня вопрос!"
      - "Если вор как-то связан с башней, хорошая ли это идея — выставлять жертву преступления на сцену?"
  - char: "john_rodgers"
    side: "right"
    text:
      - "Угх..."
  - char: "commander"
    side: "left"
    text:
      - "Хм-м..."
  - char: "collett_rad"
    side: "right"
    text:
      - "Ты ДЕЙСТВИТЕЛЬНО привлечёшь слишком много внимания."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Идея с концертом отличная, но что если выступит только наш новичок?"
  - char: "vicksburg"
    side: "right"
    text:
      - "Я... я? Одна?!"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Разве не все айдолы мечтают о сольном концерте?"
  - char: "john_rodgers"
    side: "right"
    text:
      - "Ты слышала её, Виксберг! Это шанс всей твоей жизни!"
      - "Ричард, ты ведь поможешь ей подготовиться, правда?"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Конечно! Я всегда хотела попробовать себя в роли закулисного кукловода!"
  - char: "essex_detective"
    side: "right"
    text:
      - "Кукловода? Не уверена, что сейчас это самое удачное сравнение..."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Хе-хе, сойдёт и так!"
  - char: "vicksburg"
    side: "right"
    text:
      - "Хорошо... Я использую своё пение, чтобы провести всех вас в Астральную Башню."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Вот это настрой! Теперь ты рассуждаешь как истинный, сияющий айдол."
      - "Теперь вопрос в том, как нам подать заявку?"
  - char: "collett_rad"
    side: "right"
    text:
      - "Взгляните на это."
  - text:
      - "<img src='../../img/bg/r/2.webp' class='inline-img' alt=''>"
  - text:
      - "Коллетт проецирует модель кого-то. Судя по всему, это человек, но для меня она выглядит лишь как бледный синий огонёк."
  - char: "collett"
    side: "left"
    text:
      - "Это человек, отвечающий за регистрацию номеров в программе."
      - "Убедите её — и сможете пропустить долгий процесс отбора и согласования."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Хм. Значит, пришло время снова сыграть по правилам Астрариума."
  - char: "commander"
    side: "left"
    text:
      - "Равноценный обмен... Пора снова выполнить чьё-то поручение?"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "За дело, Профессор-детектив!"
