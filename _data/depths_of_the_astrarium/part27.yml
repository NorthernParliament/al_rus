chapter1:
  rows:
  - text:
      - "Заполучив разрешения на костюмы и сценическое оборудование, следующим нашим шагом стало разрешение на рекламу."
      - "Беннингтон вполне могла сама заняться промороликами, но чтобы официально запускать их, нам требовалось разрешение."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Профессор-детектив, давай примемся за следующее задание!"

chapter2:
  rows:
  - char: "administrator_green"
    side: "left"
    text:
      - "Вам нужно разрешение на рекламу?.."
      - "Разрешения на рекламу... Вечно эти разрешения на рекламу..."
  - char: "commander"
    side: "right"
    text:
      - "..."

chapter3:
  rows:
  - char: "commander"
    side: "right"
    text:
      - "Скажи нам, чего ты хочешь."

chapter4:
  rows:
  - char: "commander"
    side: "right"
    text:
      - "ПРОПУСТИТЬ"

chapter5:
  rows:
  - char: "administrator_green"
    side: "left"
    text:
      - "Кхм... Слышали ли вы о проклятых визитках?"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "О чём это ты? Очередная аномалия?"
  - char: "administrator_green"
    side: "left"
    text:
      - "В последнее время в западном промышленном районе Нижнего города стали появляться странные карточки."
      - "На всех них указано название компании, о которой никто никогда не слышал..."
      - "Это может звучать как шутка, но... если подобрать хотя бы одну такую карточку, очнёшься запертым на заброшенной фабрике!"
      - "И оттуда уже не выбраться, пока не соберёшь три одинаковые карточки."
      - "Несколько человек уже пропали без вести. Само по себе это обычное дело для аномалий."
      - "Но проблема в том, что люди теперь боятся даже смотреть на обычные рекламные листовки!"
      - "Эта аномалия наносит серьёзный урон рекламной индустрии города. С ней нужно разобраться немедленно!"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Отли-и-ично! Задание принято: разобраться с проклятыми визитками!"
      - "Профессор-детектив, собирай всех. Встретимся на въезде в промышленный район."
      - "Ой, и мисс детективу тоже позвони!"

chapter6:
  rows:
  - text:
      - "Промышленный район оказался куда больше, чем я предполагал. Впрочем, большинство фабрик были заброшены, так что прохожих здесь почти не встречалось."
      - "Сверху нависал густой туман. Хотя время едва перевалило за полдень, вокруг было темно, словно в сумерках."
  - char: "bennington"
    side: "left"
    text:
      - "От этого места прямо веет аномалией... Включаю запись!"
      - "Приветики! Давно не виделись, зрители. С вами ваша любимая начинающая видеоблогер Беннингтон!"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Не забудь: меня и Профессора в кадр не брать!"
  - char: "bennington"
    side: "left"
    text:
      - "Не переживай!"
  - char: "john_rodgers"
    side: "right"
    text:
      - "Так, вопросик!"
      - "Я знаю, что нам нельзя поднимать плохие карточки, но как вообще понять, какие из них плохие?"
  - char: "vicksburg"
    side: "left"
    text:
      - "Ориентируйся по тому, знакома ли тебе указанная на них компания~"
  - char: "john_rodgers"
    side: "right"
    text:
      - "Но я не знаю ни одной компании..."
  - char: "vicksburg"
    side: "left"
    text:
      - "О боже..."
  - char: "commander"
    side: "right"
    text:
      - "Вот идея: не трогайте вообще никакие карточки."
      - "Учитывая, насколько эта аномалия известна, сейчас всё равно никто не печатает новые визитки для раздачи."
  - char: "john_rodgers"
    side: "left"
    text:
      - "Ого... Гениально! Не зря ты всё-таки детектив."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Хе-хе. Давайте разделимся и выясним, откуда берутся эти карточки!"
      - "Вперёд, наш Блестящий-Профессор-детектив~"

chapter7:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Насколько длинным в итоге станет моё имя?"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Ой, мы только начали!"

chapter8:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Разве ты только что не сказала, что мы разделяемся?"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Ага! Мы с тобой отделимся от всех остальных. ♪"

chapter9:
  rows:
  - text:
      - "Мы некоторое время шли вдоль зелёных насаждений, пока не заметили несколько подозрительных карточек."

chapter10:
  rows:
  - text:
      - "«Сверхзвуковой пассажирский самолёт совершил триумфальное возвращение! Буквально сегодня «Супернова», сверхзвуковой пассажирский авиалайнер, разработанный Торговым альянсом OXS, успешно завершил свой первый полёт...»"

chapter11:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Карточки с названиями компаний, о которых я никогда не слышал..."
      - "И вокруг их ещё полно."

chapter12:
  rows:
  - text:
      - "«Выбирайте охранную группу «Ротвольф»! Позвольте нам обеспечить вам и вашим близким высочайший уровень безопасности!»"

chapter13:
  rows:
  - text:
      - "«Ожесточённые споры вокруг оснастки кансен нового поколения продолжают бушевать. В своём пресс-релизе группа «Кроухид» объявила, что официальным названием этого инновационного типа вооружения станет...»"

chapter14:
  rows:
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Профессор!"

chapter15:
  rows:
  - char: "commander"
    side: "right"
    text:
      - "Да?"

chapter16:
  rows:
  - char: "commander"
    side: "right"
    text:
      - "Что стряслось?!"

chapter17:
  rows:
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Ты ведь только что поднял визитку, да?"
  - char: "commander"
    side: "right"
    text:
      - "...Ой."
      - "Чёрт... Я так увлёкся чтением, что совсем забыл."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Ха-ха-ха... Не могу поверить, что ТЫ совершил ошибку!"
  - text:
      - "Ричард смеётся, пытаясь сгладить мою неловкость. Затем она непринуждённо выхватывает карточку у меня из рук."
  - char: "commander"
    side: "left"
    text:
      - "Что ты делаешь? Это опасно."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Не переживай~ Переходим к плану «Б»."
      - "Я сообщу остальным. Все поднимут по карточке, и тогда мы сможем сразу обследовать саму фабрику!"
