chapter1:
  rows:
  - text:
      - "Гипотеза Ричард оказалась верной — переулок действительно менялся."
      - "Порой внезапно возникали рекламные щиты. Порой боковые проходы оказывались завалены мусором."
      - "Мы продолжали идти вперёд, строго следуя установленным ею правилам."
      - "В конце концов наметился прогресс — время снова пошло своим чередом."
      - "С каждым верным шагом часы перескакивали на пять минут вперёд."
      - "Вскоре на часах было уже 0:55. Впереди показалась замкнутая площадь, а позади не осталось ничего, кроме только что пройденного пути. Неужели мы наконец-то сможем выбраться?"
      - "Однако стоило мне повернуться, как из-за статуи на площади показался силуэт и окликнул нас."

chapter2:
  rows:
  - char: "essex_detective"
    side: "left"
    text:
      - "Надо же, надо же. Не думала, что кому-то под силу выбраться из этого переулка."
  - text:
      - "Под тусклым уличным фонарём стоит девушка в тренче и охотничьей шляпе."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Ого, гляди! Ещё один детектив!"
      - "Привет, мисс детектив! Я ассистентка Ричард, а это наш Профессор-детектив!"
  - char: "commander"
    side: "left"
    text:
      - "(Она теперь и вправду меня так представляет, да?)"
  - char: "essex_detective"
    side: "right"
    text:
      - "Детектив, хм? Полагаю, аномалии в этом городе зашли так далеко, что одного сыщика уже недостаточно."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Эм... Мы с Профессором просто расследуем кражу моей мастер-записи."
  - char: "essex_detective"
    side: "right"
    text:
      - "Мастер-запись... Впервые слышу об этом. Нужна помощь?"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Нет, всё в порядке! Мы и вдвоём отлично справимся."
  - char: "essex_detective"
    side: "right"
    text:
      - "Что ж, ладно. Кстати... Вы случайно не знаете дорогу назад?"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Э-э... Разве нам не нужно просто развернуться и пойти тем же путём, каким мы пришли?"
  - char: "essex_detective"
    side: "right"
    text:
      - "Поступишь так — и будешь вечно блуждать в глубинах ночи Астрариума."
      - "Аномалии, скрывающиеся под гламурным фасадом города, заходят куда глубже, чем один переулок."
      - "Бесчисленное множество людей растворилось в ночи без следа... И к восходу солнца о них уже никто не помнит."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Жуть какая..."
      - "Мы только прибыли сюда и понятия не имели, что здесь настолько опасно!"
      - "Как хорошо, что мы тебя встретили. Ты, должно быть, первоклассный детектив!"
  - char: "essex_detective"
    side: "right"
    text:
      - "Эм... Ну, можно сказать и так."
  - char: "commander"
    side: "left"
    text:
      - "Ну что? У тебя есть какие-нибудь блестящие идеи, Великий детектив?"
  - char: "essex_detective"
    side: "right"
    text:
      - "Давайте объединим усилия. Если вы расскажете мне об обнаруженных вами аномалиях, я в долгу не останусь и отведу вас в своё убежище."
      - "Если ты и впрямь чего-то стоишь как детектив, то без труда отыщешь ещё одну аномалию."
  - char: "commander"
    side: "left"
    text:
      - "Без труда, говоришь?"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Э-э-э... Вообще-то всё, чего мы хотели, это вернуть мастер-запись."
      - "Кстати, можно задать ещё один вопрос? Ты знаешь, кто я такая, мисс детектив?"
  - char: "essex_detective"
    side: "left"
    text:
      - "Твоё лицо кажется знакомым..."
      - "Постой, ты случайно не..."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Нет-нет! Ты совершенно точно ошиблась!"
  - char: "essex_detective"
    side: "left"
    text:
      - "...та самая суперзвезда-айдол?"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Угх... Знала же, что не стоит спрашивать..."
  - char: "commander"
    side: "left"
    text:
      - "Она тоже детектив. Так или иначе, это был лишь вопрос времени."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Хм... Да уж, наверное..."
      - "Мы сейчас работаем под прикрытием, так что никому не рассказывай, договорились?"
  - char: "essex_detective"
    side: "left"
    text:
      - "Хе-хе, не волнуйся, Ричард. Я профессионал и умею хранить тайны."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Я потом заставлю тебя подписать официальный договор о неразглашении!"
  - char: "essex_detective"
    side: "left"
    text:
      - "Без проблем. Разберёмся с этим, когда доберёмся до убежища. А пока следуйте за мной."