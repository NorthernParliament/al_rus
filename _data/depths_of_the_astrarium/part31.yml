chapter1:
  rows:
  - text:
      - "Толпа ревела ещё до начала заезда, предвещая старт грандиозного события."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Эта трасса делает полный круг вокруг Астрариума!"
      - "Я мечтала погонять здесь с самого момента, как мы прибыли, и наконец это время настало!"
  - char: "commander"
    side: "right"
    text:
      - "Надеюсь, я не задаю глупый вопрос, но разве для участия в гонке тебе не нужна машина?"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Естественно, я её уже купила и зарегистрировалась на участие~"
  - char: "commander"
    side: "right"
    text:
      - "Когда ты вообще успела..."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Хе-хе, есть ещё так много вещей, которых ты обо мне не знаешь, Профессор."
      - "Итак, кто-нибудь ещё хочет погонять? Регистрация всё ещё идёт!"
  - char: "bennington"
    side: "right"
    text:
      - "Круто! Если у тебя найдётся запасная тачка, я бы С УДОВОЛЬСТВИЕМ прокатилась с ветерком!"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Конечно найдётся. Так, кто-нибудь ещё хочет поучаствовать?"
  - char: "vicksburg"
    side: "right"
    text:
      - "Я... пожалуй, откажусь."
  - char: "harrison"
    side: "left"
    text:
      - "Я тоже..."
  - char: "john_rodgers"
    side: "right"
    text:
      - "Водитель из меня так себе, но ведь нужно просто давить на газ, правда?"
  - char: "harrison"
    side: "left"
    text:
      - "В гонках всё устроено немного не так..."
  - char: "john_rodgers"
    side: "right"
    text:
      - "Правда?! В смысле... Я-я, конечно же, знала это! Это была просто шутка!"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Ладненько, значит новичок, капитан фан-клуба и вице-капитан пас. Жёлтый, а ты как?"
  - char: "administrator_yellow"
    side: "right"
    text:
      - "*всхлипывает*... Это слишком страшно, я ни за что не смогу! Не могу!"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Но это же весело! Профессор, каков твой ответ?"
  - char: "commander"
    side: "right"
    text:
      - "Я пас. Ты ведь понимаешь, что тут есть загвоздка?"
      - "Твоя цель — дать Жёлтому почувствовать опасность, но он не хочет участвовать. Каков план теперь?"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Она просто поедет со мной!"
  - char: "commander"
    side: "right"
    text:
      - "Разве правила не требуют, чтобы в машине находился исключительно водитель?"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Да, но они ведь не... Ой. Ладно, да, походу нельзя."
      - "Упси~ Хи-хи☆"
  - char: "commander"
    side: "right"
    text:
      - "Так значит, мы ВСЁ-ТАКИ здесь только потому, что тебе самой захотелось погонять."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Кхм! Вообще-то я только что придумала решение!"
      - "На этой гонке предусмотрен экскурсионный маршрут."
      - "Вы все можете сесть в экскурсионную машину вместе с Жёлтым. Так она сможет увидеть скорость и весь этот драйв прямо вблизи!"
  - char: "commander"
    side: "right"
    text:
      - "Полагаю, это вполне допустимый уровень опасности."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "По рукам!"
      - "Мисс специалист по безопасности, запиши мои лучшие моменты дроном, пожалуйста!"
  - char: "collett_rad"
    side: "right"
    text:
      - "Принято. Включаю запись."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Мисс видеоблогер, пойдём оформим твою регистрацию! Пора как следует оторваться!"
