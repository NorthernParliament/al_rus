chapter1:
  rows:
  - text:
      - "По пути обратно в убежище Ричард заглянула в ближайший магазинчик со сладостями и снова хорошенько раскошелилась."
      - "Казалось, у неё было ненасытное любопытство ко всем незнакомым брендам на полках."
  - char: "commander"
    side: "left"
    text:
      - "Что ж... Без закусок мы точно не останемся, это уж наверняка."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Хе-хе. Угощайся, не стесняйся!"

chapter2:
  rows:
  - text:
      - "Узнав о желании синего огонька, Эссекс принялась перерывать стопку блокнотов на своём столе."
  - char: "essex_detective"
    side: "left"
    text:
      - "«Дело о клерке, который не может уйти с работы»... Нашла!"
      - "В этих записях подробно описана аномалия, произошедшая в Верхнем городе полгода назад."
      - "Всё случилось в квартире под кодовым названием «Секция X». Впервые об этом сообщил служащий, спасшийся прыжком из окна третьего этажа."
      - "Стоило закончить дневную смену и попытаться отметиться об уходе, как сразу после этого человек оказывался в начале нового рабочего дня."
      - "Несмотря на всю свалившуюся работу, как ни странно, никакой усталости они не чувствовали."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Ой! Кажется, я видела такой сериал!"
      - "В общем, там разделили мозг одного парня на две части. Одна только и делает, что работает, пока бодрствует, а вторая в часы бодрствования всегда отдыхает от работы."
  - char: "essex_detective"
    side: "left"
    text:
      - "Ммм... Боюсь, я такого не знаю."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Хе-хе. Я смотрю много сериалов!"
      - "В любом случае, ты не договорила. Что стало с квартирой?"
  - char: "essex_detective"
    side: "left"
    text:
      - "Она осталась пустой и недавно была выставлена на аукцион."
  - char: "bennington"
    side: "right"
    text:
      - "Постойте, они просто выселили оттуда всех и выставили её на продажу? А как же расследование аномалии?"
  - char: "essex_detective"
    side: "left"
    text:
      - "Судя по записям, в качестве компромисса было решено запретить кому-либо там работать. Ведь никто не сможет перетрудиться, если работать попросту некому."
  - char: "collett_rad"
    side: "right"
    text:
      - "Ого... Безупречная логика."
  - char: "vicksburg"
    side: "left"
    text:
      - "Но ведь это на самом деле не решает проблему, правда?"
  - char: "essex_detective"
    side: "right"
    text:
      - "Согласна. Потому-то эту квартиру никто и не купил."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Я поняла! Если мы купим её и подарим этому администратору, разве это не зачтётся как исполнение её желания?"
  - char: "harrison"
    side: "right"
    text:
      - "Звучит опасно..."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Всё будет нормально, если мы заранее предупредим её о рисках."
  - char: "john_rodgers"
    side: "right"
    text:
      - "Я обеими руками «за»! Сестрёнка, ты вечно во всём сомневаешься!"
  - char: "essex_detective"
    side: "left"
    text:
      - "Ну что, детектив? Что думаешь?"
  - char: "commander"
    side: "right"
    text:
      - "В обычной ситуации я был бы против такого..."
      - "(Но эти огоньки, скорее всего, устроены иначе, чем обычные люди...)"
      - "Обычными способами её желание нам всё равно не исполнить. Давайте чётко объясним ей все риски и предоставим выбор ей самой."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Отли-и-ично! Вперёд!"
