chapter1:
  rows:
  - text:
      - "Нас окутал густой туман, и не успели мы опомниться, как уже стояли перед заброшенной фабрикой."
  - char: "bennington"
    side: "left"
    text:
      - "Невероятно! Стоило нам подобрать эти карточки, как нас и впрямь перенесло к фабрике!"
  - char: "essex_detective"
    side: "right"
    text:
      - "Что-то здесь не так..."
      - "По идее, подняв одну из карточек, ты оказываешься заперт внутри фабрики до тех пор, пока не найдёшь три одинаковые."
      - "Но мы стоим СНАРУЖИ перед воротами. Если мы просто не войдём внутрь, то не понимаю, как мы вообще можем оказаться запертыми."
  - char: "vicksburg"
    side: "left"
    text:
      - "Тогда зайдём внутрь?"
  - char: "john_rodgers"
    side: "right"
    text:
      - "Конечно же нет!"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Конечно же да!"
  - char: "john_rodgers"
    side: "right"
    text:
      - "Чего-о-о?! Зачем тебе туда идти?!"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Потому что это звучит весело! К тому же мы ведь взялись за задание разобраться с аномалией, помнишь?"
  - char: "collett_rad"
    side: "right"
    text:
      - "Похоже, возле ворот есть вывеска. Возможно, на ней найдутся зацепки."
  - char: "bennington"
    side: "left"
    text:
      - "Вывеска? Пойду взгляну."

chapter2:
  rows:
  - char: "bennington"
    side: "left"
    text:
      - "Нашла!"
  - char: "commander"
    side: "right"
    text:
      - "Что там написано?"
  - char: "bennington"
    side: "left"
    text:
      - "«У нас выходной. Приходите в другой раз»."
  - char: "essex_detective"
    side: "right"
    text:
      - "?.."
  - char: "vicksburg"
    side: "left"
    text:
      - "Ла-а-адно?.."
  - char: "commander"
    side: "right"
    text:
      - "У городских аномалий тоже бывают выходные?"
  - char: "john_rodgers"
    side: "left"
    text:
      - "На моей прошлой работе такого не было! Это нечестно!"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Э-э-эй! Есть кто внутри?"
  - text:
      - "Ричард спокойно подходит к воротам и уверенно стучит в них."

chapter3:
  rows:
  - text:
      - "После трёх ударов ворота с грохотом рушатся."
      - "Это вызывает цепную реакцию: стены и всё, что находится внутри, начинает осыпаться."
      - "Ровно за тридцать секунд заброшенная фабрика превращается в руины... и растворяется в воздухе."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Эм?"
  - char: "vicksburg"
    side: "right"
    text:
      - "Что вообще только что произошло?"
  - char: "bennington"
    side: "left"
    text:
      - "Фух... Как хорошо, что я не выключала камеру! Кадры получатся просто потрясающими!"
  - char: "essex_detective"
    side: "right"
    text:
      - "То, как она рухнула, напоминает удар колоссальной силы."
  - char: "commander"
    side: "left"
    text:
      - "Вот так просто всё и разрешилось."
  - char: "john_rodgers"
    side: "right"
    text:
      - "Вот это суперзвезда... Сила Бон Омм Ричард тоже мирового уровня!"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Э-э, я вообще-то просто слегка постучала в дверь."
      - "В-впрочем, не знаю, почему это помогло, но, похоже, наша проблема решена~"
      - "Пойдёмте доложим об успехе и заберём наше разрешение на рекламу!"
