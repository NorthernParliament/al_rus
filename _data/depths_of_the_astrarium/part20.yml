chapter1:
  rows:
  - char: "security_guard_red"
    side: "left"
    text:
      - "Что? Уже передумал? Давай уже, погнали!"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Задай ему жару, Профессор-детектив! Ты же чемпион по армрестлингу!"
  - char: "commander"
    side: "left"
    text:
      - "......"
  - text:
      - "Каким-то неведомым образом я оказался в странном месте, зачем-то состязаясь в армрестлинге с охранником."
      - "Как я вообще в это ввязался? Ну..."

chapter2:
  rows:
  - char: "vicksburg"
    side: "left"
    text:
      - "Вот такая у нас история. Не могла бы ты выдать разрешение на использование площадки для нашего выступления?"
  - char: "administrator_grey"
    side: "right"
    text:
      - "Какая тоска... Наш город грёз поглотила тьма..."
  - char: "vicksburg"
    side: "left"
    text:
      - "Эм... Чего-чего?.."
  - char: "administrator_grey"
    side: "right"
    text:
      - "В этом городе слишком много желаний, чтобы один человек мог их исполнить... вздыхает... Какая тоска."
  - char: "john_rodgers"
    side: "left"
    text:
      - "У тебя ведь тоже есть какое-то желание, да? Выкладывай уже!"
  - char: "administrator_grey"
    side: "right"
    text:
      - "Найдите квартал, где желания всё ещё остаются неисполненными, и исполните их..."
      - "Сделайте это — и получите разрешение..."
  - char: "harrison"
    side: "left"
    text:
      - "Вроде общественных работ?"
  - char: "commander"
    side: "right"
    text:
      - "Звучит не так уж и сложно. Давайте поскорее с этим покончим."

chapter3:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Твоё желание... побороться с кем-нибудь на руках?.."
  - char: "security_guard_red"
    side: "right"
    text:
      - "Хех. Молись, чтобы я тебе руку не оторвал!"

chapter4:
  rows:
  - char: "security_guard_red"
    side: "right"
    text:
      - "Не могу поверить, что проиграл..."
      - "Только настоящий мастер способен так скрывать свои навыки... Мне больше не о чем жалеть."
  - text:
      - "Красный охранник растворяется в частицах света."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Отличная работа, Профессор-детектив! Переходим к следующей просьбе!"

chapter5:
  rows:
  - char: "beggar_blue"
    side: "left"
    text:
      - "Неужели в этом мире совсем не осталось добрых душ?.."
  - char: "bennington"
    side: "right"
    text:
      - "Добрые души уже здесь!"
      - "Держи. Надеемся, это поможет~"
      - "*даёт ему золотые монеты*"

chapter6:
  rows:
  - char: "beggar_blue"
    side: "left"
    text:
      - "Наконец-то рука помощи... Огромное спасибо."
  - text:
      - "Синий нищий растворяется в частицах света."
  - char: "john_rodgers"
    side: "left"
    text:
      - "Следующи-и-ий!"

chapter7:
  rows:
  - char: "aristocrat_yellow"
    side: "left"
    text:
      - "К-кто там?! Помогите мне! НА ПОМО-О-ОЩЬ!"
  - char: "vicksburg"
    side: "right"
    text:
      - "Не бойся! Мы сейчас же развяжем тебя!"
      - "*разрезает верёвку*"

chapter8:
  rows:
  - char: "aristocrat_yellow"
    side: "left"
    text:
      - "Наконец-то я спасён... Слава небесам, что вы пришли."
  - text:
      - "Жёлтый аристократ растворяется в частицах света."
  - char: "harrison"
    side: "left"
    text:
      - "Пойдёмте посмотрим, кому ещё нужна наша помощь!"

chapter9:
  rows:
  - char: "juvenile_black"
    side: "left"
    text:
      - "Кто-нибудь, помоги-и-ите. Мой котёнок залез на крышу и не слезает..."
  - char: "collett_rad"
    side: "right"
    text:
      - "Можешь подняться на крышу верхом на Ошибке XIII."

chapter10:
  rows:
  - char: "juvenile_black"
    side: "left"
    text:
      - "Ого, спасибо! Теперь я могу быть счастлив..."
  - text:
      - "Чёрный подросток растворяется в частицах света."
  - char: "commander"
    side: "left"
    text:
      - "И долго нам ещё придётся этим заниматься?"
  - char: "essex_detective"
    side: "right"
    text:
      - "Боюсь, мы не закончим, пока не исполним все желания в этом квартале."
      - "Продолжаем."

chapter11:
  rows:
  - char: "tailor_green"
    side: "left"
    text:
      - "Больно смотреть... Может ли кто-нибудь помочь мне прочистить дымоход?"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "*пристально смотрит на Командира*..."
  - char: "commander"
    side: "left"
    text:
      - "Очень надеюсь, что это последнее."
      - "*берусь за прочистку*"

chapter12:
  rows:
  - char: "tailor_green"
    side: "left"
    text:
      - "Чистота до блеска... Спасибо."
  - text:
      - "Зелёный портной растворяется в частицах света. Внезапно появляется Серый администратор."
  - char: "administrator_grey"
    side: "left"
    text:
      - "Вы люди доброй души. Испытание окончено."
      - "Вот ваша награда — разрешение на использование площадки."
  - text:
      - "С этими словами Серый администратор тоже растворяется в частицах света."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Отличная работа, народ~ Ещё одно разрешение у нас в кармане!"
  - char: "commander"
    side: "right"
    text:
      - "Наконец-то всё закончилось..."
  - char: "essex_detective"
    side: "left"
    text:
      - "Что ж, эта аномалия определённо достойна отдельной записи."
      - "Пойду внесу запись о ней в заметки."
