chapter1:
  rows:
  - text:
      - "Зажглись огни, заиграла музыка. Начинающий айдол сделала глубокий вдох и шагнула на сцену."
  - char: "vicksburg"
    side: "left"
    text:
      - "Пусть я и очнулась от того сна, но есть кое-что, что я обязана сделать."
      - "Ричард... Я безупречно проведу это выступление, лишь бы остановить твои планы."

chapter2:
  rows:
  - text:
      - "Приятная песня зазвучала с озарённой звёздами сцены."
      - "Концерт Виксберг наконец начался."

chapter3:
  rows:
  - text:
      - "Тем временем..."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Зацени, Профессор! Из кабинета генерального директора видно И сцену концерта, И весь остальной город!"
  - char: "commander"
    side: "right"
    text:
      - "Отличный вид... Отсюда и впрямь видно абсолютно весь город."
  - text:
      - "Окружённый внешним кольцом, город походил на гигантский магический круг. С этой точки обзора отчётливо выделялись три небоскрёба в форме букв."

chapter4:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "B... H... R..."
  - text:
      - "Правительница этого города даже не пыталась скрыть свою личность. Любой, кто заглянул бы в этот кабинет, увидел бы всё как на ладони."

chapter5:
  rows:
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Профессор-детектив, мне было так весело все эти дни."
      - "Настолько весело..."
      - "Но любым каникулам рано или поздно приходит конец. Нам ведь ещё нужно выполнить нашу работу в роли детектива и его ассистентки."
      - "Ты нашёл запись, Профессор?"
  - text:
      - "Она непринуждённо садится на диван, прикрывает глаза и задаёт мне один простой вопрос."
      - "«Украденный» диск преспокойно лежит прямо на журнальном столике перед ней."
  - char: "commander"
    side: "left"
    text:
      - "Он просто лежит на самом видном месте, да?"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Ага. Какой беспечный вор. Даже не попытался его спрятать!"
  - text:
      - "Она открывает глаза. Несмотря на мелькнувшее секундное колебание, на её лицо быстро возвращается привычная улыбка."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Что ж, Профессор. Передай мне диск."
      - "Сделай это — и твоё задание будет выполнено."
  - text:
      - "Она поднимает руку, но вместо того, чтобы потянуться к диску, указывает прямо на меня."
  - char: "commander"
    side: "left"
    text:
      - "Я так и знал... Что-то произойдёт, только если я сам передам его тебе, верно?"
      - "Это ведь новая песня. Почему бы нам сначала не послушать её вместе?"
  - text:
      - "Лучшее, что я сейчас могу сделать — тянуть время."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Вступительный номер, который она сейчас поёт — и есть моя новая песня."
      - "Ты слышал её кучу раз во время репетиций."
      - "Название, которое они знают — всего лишь фальшивка, вот и всё."
      - "Её настоящее название — «Желание Пандоры»."
  - char: "commander"
    side: "left"
    text:
      - "Ты научила кого-то другого своей новой песне?!"
  - text:
      - "По какой-то причине это первая мысль, которая приходит мне в голову."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Я потеряла свою сцену и своих зрителей давным-давно... но она — другое дело."
  - char: "commander"
    side: "left"
    text:
      - "Ты хочешь сказать, что пора положить этому конец."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Хе-хе~ Может, ещё не сейчас. Давай немного подождём."
  - text:
      - "Ричард мило улыбается."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Мы вложили столько сил в этот концерт. Было бы глупо не насладиться им, правда?"
      - "Ты всё ещё не ответил на вопрос, который поставит точку в этом деле: как зовут виновника?"
      - "По крайней мере, пока что... мы всё ещё профессор и помощница, договорились? Так что давай смотреть вместе."
  - char: "commander"
    side: "left"
    text:
      - "...Хорошо."
  - text:
      - "Я сажусь напротив Ричард и прячу диск в карман."

chapter6:
  rows:
  - text:
      - "Спустя некоторое время концерт уже подходил к концу."
      - "Промолчав на протяжении всего шоу, Бон Омм Ричард наконец заговорила."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Профессор, я ждала окончания концерта, чтобы рассказать тебе правду..."
      - "Но чего ждёшь ты?"
  - char: "commander"
    side: "left"
    text:
      - "Переломного момента."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Ты о фан-клубе, который носится по городу?"
  - char: "commander"
    side: "left"
    text:
      - "Значит, ты и впрямь не знаешь."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Не знаю... чего?"
  - char: "commander"
    side: "left"
    text:
      - "Ты действуешь в условиях множества ограничений. Именно поэтому ты не можешь свободно использовать свою силу."
      - "Чёрная Ричард ни разу не показалась именно из-за этого ограничения. Разве я не прав?"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Хе-хе."
  - text:
      - "Она не отвечает."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Ты никогда не думал, что мы с ней можем быть двумя разными сущностями?"
  - char: "commander"
    side: "left"
    text:
      - "Скажи мне сама. Так ли это?"
  - text:
      - "Ричард по-прежнему не даёт чёткого ответа, вместо этого с тоской глядя на меня."
      - "Зная, что это лишь игра, я всё же решаю озвучить свою первоначальную теорию."
  - char: "commander"
    side: "left"
    text:
      - "Если честно... когда ты впервые появилась в том классе, я действительно думал, что ты отдельная сущность."
      - "Потому что само твоё присутствие там казалось гарантией твоей безопасности со стороны Антиох."
      - "Но... в конце концов, ты всё та же Ричард."
      - "Ты обманула и Антиох, и Обсервер Зеро."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Этим особо не похвастаешься. В конце концов, Зеро никогда не отличалась особым умом~"
  - char: "commander"
    side: "left"
    text:
      - "...«Зеро»?"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Ага. В итоге всё это было частью ЕЁ плана."
  - char: "commander"
    side: "left"
    text:
      - "Постой... Зеро... это не Обсервер Зеро?"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Какая разница между тобой и Командиром?"
  - char: "commander"
    side: "left"
    text:
      - "Я и есть Командир."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Тогда она — Обсервер Зеро."
  - char: "commander"
    side: "left"
    text:
      - "Это едва ли можно назвать ответом..."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Сам виноват, что пытаешься тянуть время пустой болтовнёй."
      - "Что это за профессор такой, который заставляет студентку отвечать на все вопросы?"

chapter7:
  rows:
  - text:
      - "Снова воцаряется тишина, пока концерт приближается к своей заключительной песне."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "«Голубой дух»."
      - "Она репетировала эту песню, когда мы только встретились... Посмотри, как далеко она продвинулась."
      - "Время летит, да? Концерт вот-вот закончится..."
      - "Ты ведь только недавно понял, кто я на самом деле, верно? Как ты догадался?"
  - char: "commander"
    side: "left"
    text:
      - "А как ТЫ поняла, что я знаю?"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Ага! Снова вопрос на вопрос. Неужели тебе так хочется скрытничать со мной?"
      - "Ну, на этот вопрос я ответить не против."
      - "После того как ты сходил в уборную, ты стал смотреть на меня по-другому."
      - "Я видела, что ты пытался это скрыть, но я всё же своего рода профессионал."
  - char: "commander"
    side: "left"
    text:
      - "Значит, есть вещи, которых ты тоже не знаешь."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Мне пришлось пойти на многие жертвы, чтобы обмануть Зеро."
      - "Включая те ограничения, о которых ты догадался... и многое другое."
      - "Но как только ты отдашь мне эту мастер-запись, всё закончится."
  - char: "commander"
    side: "left"
    text:
      - "Что произойдёт потом?"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Если после этого ты захочешь остаться со мной навсегда, я буду только рада~"
  - char: "commander"
    side: "left"
    text:
      - "..."

chapter8:
  rows:
  - text:
      - "После выхода артистов на поклон свет на сцене погас. Концерт подошёл к концу."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "рофессор-детектив, у твоей помощницы есть к тебе вопрос. Кто был виновником?"
  - char: "commander"
    side: "left"
    text:
      - "Это была ты, Бон Омм Ричард. Ты инсценировала кражу мастер-записи и подстроила всё это."

chapter9:
  rows:
  - char: "bon_omm_richard2"
    side: "right"
    status: "is-yellow"
    text:
      - "Бинго! Ты такой умный."
      - "А теперь я заберу эту запись."
  - char: "commander"
    side: "left"
    text:
      - "Если ты не можешь взять её сама, то я не вижу причин отдавать её тебе."
  - char: "bon_omm_richard2"
    side: "right"
    status: "is-yellow"
    text:
      - "Отличная дедукция, но ты кое-что упустил."
      - "Если ты вернул свои воспоминания, то должен помнить, что произошло под деревом в саду."
  - char: "commander"
    side: "left"
    text:
      - "Под деревом... в саду?"
  - char: "bon_omm_richard2"
    side: "right"
    status: "is-yellow"
    text:
      - "Отдай диск."
  - char: "commander"
    side: "left"
    text:
      - "(Чёрт... Я забыл!)"
      - "(Я не могу... контролировать себя!)"
  - text:
      - "Вопреки моей воле рука тянется в карман и медленно достаёт диск. Затем она протягивает его улыбающейся девушке."
      - "Как раз в тот момент, когда пальцы Ричард почти касаются диска, раздаётся оглушительный грохот — окно с треском разлетается на куски."

chapter10:
  rows:
  - char: "miss_d"
    side: "left"
    text:
      - "ПОСТОЙ, ПОСТОЙ, ПОСТО-О-ОЙ!"
      - "Ассистент! Ассистент, я пришла на помощь!"
  - char: "bon_omm_richard1"
    side: "right"
    status: "is-yellow"
    text:
      - "Тц..."
  - text:
      - "Стоило появиться Мисс D, как Ричард исчезает. Окружающий мир за окном стремительно преображается."
