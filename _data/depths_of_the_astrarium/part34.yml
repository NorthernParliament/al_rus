chapter1:
  rows:
  - text:
      - "Тем временем в убежище с задёрнутыми шторами..."
      - "После некоторых внутренних терзаний хозяйка комнаты отбросила сомнения и вернулась к взлому."
      - "Дело по-прежнему продвигалось с пугающей лёгкостью."
  - char: "collett"
    side: "left"
    text:
      - "Система наблюдения... взломана."
      - "Фильтрация ключевых зон... Настройка даты... Определение изменений в движении..."
      - "Кто же наш вор и куда он спрятал добычу? Пора бы мне на это взглянуть."
  - text:
      - "Поддержка Ошибки XIII позволяла ей обрабатывать колоссальные объёмы данных с камер с головокружительной скоростью."
      - "Вскоре она нашла ответ, который искала."
  - char: "collett"
    side: "left"
    text:
      - "Нашла... Спустя тридцать минут после кражи, в кабинете генерального директора."
      - "Расположенном на 200-м этаже Астральной Башни..."

chapter2:
  rows:
  - text:
      - "Она нажала кнопку воспроизведения, заставив застывшую картинку ожить."
      - "С наступлением ночи пустой кабинет генерального директора оставался единственным источником света."
      - "Порыв чёрного ветра ворвался в окно, заполнив комнату чёрным туманом."
      - "Спустя мгновение чёрный туман рассеялся, обнажив небольшой диск с данными. Затем появилась бледная белая рука, а следом — одинокий багровый глаз."

chapter3:
  rows:
  - text:
      - "Коллетт вскочила на ноги, отбросила всё в сторону, запрыгнула на робокота и вылетела на нём в окно."
  - char: "collett"
    side: "left"
    text:
      - "Чёрт-чёрт-чёрт... Почему именно ОНА? Как она могла оказаться той, кто украл запись..."
      - "Это всё с самого начала было ловушкой... Мне нужно спрятаться!"

chapter4:
  rows:
  - text:
      - "Робот-кот пробил стену, унося Коллетт дальше вперёд. Однако в то же мгновение она осознала, что снова сидит за своим компьютером, а багровый глаз неотрывно смотрит прямо на неё."
  - char: "bon_omm_richard_d_voice"
    side: "right"
    status: "is-red"
    text:
      - "Эй."
  - text:
      - "Голос прозвучал прямо у неё из-за спины."
  - char: "collett"
    side: "left"
    text:
      - "Прости, что сунула нос в твои секреты..."
  - text:
      - "Не смея обернуться или оказать сопротивление, она могла лишь сидеть на месте, пока чёрный туман подбирался к её плечам. Все мониторы погасли, а кондиционер в комнате затих."
      - "Возникло странное чувство, будто стены одновременно сжимались вокруг неё и бесконечно расширялись во все стороны."
  - char: "collett"
    side: "left"
    text:
      - "Уже... слишком поздно сдаваться?.."
  - char: "bon_omm_richard_d_voice"
    side: "right"
    status: "is-red"
    text:
      - "Кто знает... Хе-хе~"

chapter5:
  rows:
  - text:
      - "Когда я открываю дверь уборной, сверху на меня обрушивается синий поток."

chapter6:
  rows:
  - char: "bon_omm_richard2?"
    side: "left"
    text:
      - "Приветик~ Я так и знала, что это ты, Профессор!"
      - "Давненько не виделись! Не против, если я присяду куда-нибудь?"

chapter7:
  rows:
  - char: "bon_omm_richard2?"
    side: "left"
    text:
      - "Доброе утро, Профессор."
      - "Если ты начнёшь вздыхать с самого утра, вся твоя удача на день улетучится, знаешь ли~"

chapter8:
  rows:
  - char: "bristol_meta?"
    side: "left"
    status: "is-meta"
    text:
      - "«Словно мотыльки на пламя, привлечённые сиянием фонаря»."
  - char: "essex_detective"
    side: "right"
    text:
      - "Что... ты сделала?"
  - char: "bristol_meta?"
    side: "left"
    status: "is-meta"
    text:
      - "«О мотыльки, летящие в чистилище, проведите эту путницу обратно туда, откуда она пришла»."
  - char: "essex_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Гх... моя голова... только не снова..."
  - char: "essex_detective"
    side: "right"
    text:
      - "Быстрее..."
  - char: "essex_meta?"
    side: "right"
    status: "is-meta"
    text:
      - "«Стоп»."

chapter9:
  rows:
  - char: "bon_omm_richard2?"
    side: "left"
    text:
      - "А как же я? Мне нельзя с вами?"
      - "Это был риторический вопрос, если что. Я просто искала повод поболтать с тобой~♪"
  - char: "miss_d"
    side: "right"
    text:
      - "А? Ричард?!!"
  - char: "bon_omm_richard2?"
    side: "left"
    text:
      - "...А?"

chapter10:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "...Ричард? Где ты?.."
  - char: "bon_omm_richard2?_rad"
    side: "right"
    text:
      - "Без понятия! Я каким-то образом оказалась посреди тёмного переулка!"
  - char: "commander"
    side: "left"
    text:
      - "...Переулка?"

chapter11:
  rows:
  - char: "miss_d"
    side: "left"
    text:
      - "Я ЛЕЧУ-У-У!"
      - "Лечу над каким-то странным городом! Ого... Эй, ты вообще кто такая?"
  - char: "bristol_meta?"
    side: "right"
    status: "is-meta"
    text:
      - "Тсс! Мне поручили спрятать тебя."
  - char: "miss_d"
    side: "left"
    text:
      - "Хм-м-м... Сомнительно! С чего это я вообще должна ТЕБЯ слушать, а?"
  - char: "bristol_meta?"
    side: "right"
    status: "is-meta"
    text:
      - "«D, делай, как она говорит»."
  - char: "miss_d"
    side: "left"
    text:
      - "А?!"

chapter12:
  rows:
  - text:
      - "Туман в моей голове рассеялся. Я не просто всё вспомнил — вдобавок ко всему я узнал куда больше."
  - char: "commander"
    side: "left"
    text:
      - "Хелена... Спасибо."
  - text:
      - "Когда я восстанавливаю в памяти произошедшие события, по моей спине пробегает холодный пот."
      - "Кажется, будто мы были буквально в шаге от падения в бездну."
      - "Если бы я вовремя всё не вспомнил, последствия могли бы оказаться немыслимыми."
  - char: "commander"
    side: "left"
    text:
      - "Этот туман в голове был делом рук Ричард."
      - "Она заставила меня всё забыть, вынудила подыгрывать в срежиссированном ею сценарии и помогать ей искать эту мастер-запись..."
      - "Впрочем, это лишь то, как она её называет. Кто знает, что это на самом деле?"
      - "И ведь она была настолько близка к успеху..."
  - text:
      - "После стольких дней оцепенения мой разум наконец заработал на полную мощность."
  - char: "commander"
    side: "left"
    text:
      - "Похоже, Ричард действует в двух разных обличьях — я мог бы назвать их Белой Ричард и Чёрной Ричард."
      - "Чёрная Ричард — воплощение бедствия. Её попытка проникнуть на тестовый полигон бета была сорвана Антиохом."
      - "Затем передо мной предстала Белая Ричард — её привела девушка, выглядевшая точь-в-точь как Зеро."
      - "Если Зеро предвидела эту встречу, значит, это должно было быть частью её плана."
      - "Из-за этого я посчитал Белую Ричард безобидной... или, по крайней мере, не особо опасной."
      - "Я воспринимал Белую Ричард и Чёрную Ричард как двух разных личностей и даже начал верить, что Белая — настоящая Бон Омм Ричард."
      - "Но может ли она на самом деле так просто разделиться на две самостоятельные сущности?"
      - "Есть ли для неё хоть какой-то смысл в разделении на два существа?"
      - "Возможно... всё это время существовала лишь одна Бон Омм Ричард."
      - "Неужели Зеро просчиталась? Не потому ли Хелена выбрала именно такой способ, чтобы открыть мне правду?"
      - "Дело... плохо."

chapter13:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Беннингтон и остальные, должно быть, всё ещё пребывают в неведении. Они забыли, что они кансен, и растворились в ритме повседневной жизни."
      - "Я могу попытаться пробудить их... но наших сил будет недостаточно, чтобы противостоять Ричард."
      - "Хелена выбрала такой обходной путь, чтобы разбудить меня, потому что не может вмешаться напрямую."
      - "А Бристоль META... Мы не встречались, но именно она приютила Мисс D и выпустила того синего мотылька. Должно быть, она заодно с Хеленой."
      - "Я знаю... Она наверняка связана с Эссекс из «Пепла». Уверен, Эссекс сможет выследить Бристоль и Мисс D."
  - text:
      - "Сообщение отправляется в мгновение ока. Этого может быть недостаточно, чтобы разбудить спящего, но ни один первоклассный детектив не упустит подобный шанс."
  - char: "commander"
    side: "left"
    text:
      - "Но этого всё ещё мало."
      - "Коллетт — единственная, кто свободна в своих действиях, ведь все остальные находятся в башне."
      - "Может... мне стоит попросить её связаться с Саратогой и остальными?"
      - "Чёрт. Память Меркурия пропала без вести ещё со времён взрыва газа..."
      - "Но что, если они заодно? Пожалуй, не стоит связываться с ними безрассудно... Это слишком рискованная авантюра."
      - "У меня всё ещё есть варианты. Даже если наш противник — генеральный директор Астральной Башни, Коллетт — хакер высшего класса. Как минимум, это должно отвлечь Ричард."
  - text:
      - "Когда я отправляю сообщение Коллетт, статус подтверждает доставку — но ответа не следует."
  - char: "commander"
    side: "left"
    text:
      - "Она как раз просматривала записи с камер видеонаблюдения... Неужели она увидела то, чего не должна была видеть?"
      - "Мне катастрофически не хватает информации. Возможно, лучший выход — сбежать из этой башни..."
      - "Отменить концерт и немедленно отступить — забыть про мастер-запись. Каким-нибудь образом связаться с Мисс D и с помощью её кита совершить побег."
      - "Нет, не выйдет... Это будет равносильно прямому столкновению с Ричард."
      - "Похоже, Мисс D и кит — моя единственная надежда..."
      - "Пока что придётся вести себя с Ричард как обычно и тянуть время, чтобы помешать ей найти запись... А затем, когда представится возможность, я свяжусь с Мисс D, чтобы сбежать."

chapter14:
  rows:
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Профессор? Ты в порядке?"
  - text:
      - "Из-за спины раздаётся нежный голос. Внезапно её улыбка кажется больше похожей на коварный оскал хищника, любующегося своей добычей."
  - char: "commander"
    side: "left"
    text:
      - "(Ричард? Почему она здесь?!..)"
  - text:
      - "Изо всех сил пытаясь сохранять спокойствие, я поворачиваюсь к ней лицом."
  - char: "commander"
    side: "left"
    text:
      - "Что-то случилось? Я думал, ты пошла заказывать еду."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Я за тебя забеспокоилась... Ты так долго не выходил из уборной, знаешь ли?"
  - char: "commander"
    side: "left"
    text:
      - "И поэтому... ты пошла за мной?"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Хе-хе~ Знаю, знаю. Был бы такой скандал, если бы кто-то увидел, как популярный айдол вроде меня вытворяет подобное."
  - text:
      - "Несмотря на эти слова, она подходит ещё ближе."
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Сохрани это в секрете, договорились?"
  - text:
      - "Девушка привстаёт на цыпочки и шепчет мне на ухо, словно смакуя исходящий от меня страх."
  - char: "commander"
    side: "left"
    text:
      - "(Мне остаётся только подыгрывать и тянуть время.)"
      - "Да уж... Учитывая твою популярность, тебе действительно стоит получше заботиться о своей репутации."
      - "Как бы то ни было, пойдём поедим. Какая вкуснятина ждёт нас сегодня?"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Хе-хе, уверена, тебе понравится!"
      - "Скоро сам всё увидишь~"
  - char: "commander"
    side: "left"
    text:
      - "(Эссекс, Мисс D, Бристоль... Теперь вы моя единственная надежда!)"
