chapter1:
  rows:
  - text:
      - "К тому времени, как Коллетт закончила работу, была уже глубокая ночь."
      - "Мы с Ричард решили провести ещё одну ночь в убежище Эссекс."
      - "Прежде чем разойтись, Ричард дала Виксберг несколько домашних заданий."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Хм-м... На первое время этого должно хватить. Старайся изо всех сил, новичок."

chapter2:
  rows:
  - text:
      - "На следующий день мы с Ричард на первом же вагончике вернулись в наш отель в Верхнем городе."
      - "Получив новую личность и адрес своего убежища, трусливый огонёк наконец-то рассказала всё, что знала о преступнике."
  - char: "eyewitness_yellow"
    side: "left"
    text:
      - "Тёмной и ненастной ночью я коротала время, наблюдая за камерами видеонаблюдения..."
      - "В глубине коридора я заметила жуткий силуэт."
      - "Угольно-чёрное тело, ярко-красные глаза... и пара огромных крыльев!"
      - "Она была словно торнадо... Пронеслась по коридору, ворвалась в твой номер и вылетела прямо в окно!"
      - "Я видела... Она направлялась в сторону Метрополиса!"
      - "Но восстановить видеозапись я не могу... и это всё, что мне известно!"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Профессор, как думаешь, мы правда можем ей верить?"
  - char: "commander"
    side: "left"
    text:
      - "Мы предоставили ей новую личность и безопасное укрытие, так что не вижу причин, зачем ей лгать."
  - char: "eyewitness_yellow"
    side: "right"
    text:
      - "Да! Да! Т-так... я могу теперь уйти?"
      - "Я всё вам рассказала и больше не хочу здесь оставаться!"
  - text:
      - "Получив наше согласие, жёлтый огонёк тут же бросается наутёк."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Чёрное тело, красные глаза и огромные крылья... Похоже на вампира!"
  - char: "commander"
    side: "right"
    text:
      - "Вампир, значит? Учитывая, сколько в этом городе аномалий, это звучит не так уж и неправдоподобно."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Что ж, Профессор-детектив! Вор улетел в сторону Метрополиса, так что вперёд, в погоню!"
      - "Хм-м. Наша хорошая знакомая мисс детектив ушла расследовать другое дело, а почти весь фан-клуб занят помощью новичку..."
      - "Придумала! Давай попросим мисс видеоблогера помочь нам!"
