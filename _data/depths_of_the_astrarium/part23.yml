chapter1:
  rows:
  - char: "saratoga_morning"
    side: "left"
    text:
      - "Добро пожаловать в «Сияние☆Навсегда»!"
      - "Ричард мне всё рассказала. Можете свободно пользоваться любыми здешними инструментами и оборудованием!"
      - "Я буду болеть за вас!"
  - text:
      - "Стоило нам переступить порог, как хозяйка с энтузиазмом поприветствовала нас."
  - char: "commander"
    side: "left"
    text:
      - "(Саратога, завершившая карьеру айдола...)"
  - text:
      - "Кажется, туман в моей голове немного рассеивается, но больше никаких воспоминаний не всплывает."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Спасибо, Сара!"
      - "Пойдёмте все в студию, она расположена в подвале!"
  - char: "bennington"
    side: "right"
    text:
      - "Ого... Если бы не эта кража мастер-записи, ты бы, наверное, смогла провести нас в башню лишь благодаря своей известности, да?"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Может быть! Думаю, это вполне могло сработать."
      - "Когда всё закончится, я обязательно отведу вас всех в башню, чтобы мы как следует повеселились!"

chapter2:
  rows:
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Стой прямо так, Профессор. Я поправлю тебе осанку."
      - "А ещё бас нужно настроить получше. Дай-ка сюда, я сама всё сделаю."

chapter3:
  rows:
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Профессор, положи руку вот сюда и повторяй движения за мной~"
      - "Барабаны сбились с ритма. Давайте ещё разок!"

chapter4:
  rows:
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Отличная работа, Профессор. Так держать!"
      - "И ещё..."
  - char: "harrison"
    side: "right"
    text:
      - "Прости. Знаю, это была моя ошибка."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Погнали сначала!"

chapter5:
  rows:
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Ты отлично справился! Видишь? У тебя и правда начинает получаться."
      - "И Виксберг, твой вокал был безупречен... Да что там, вы все сыграли потрясающе!"
      - "Ещё десять прогонов — и на сегодня закончим."

chapter6:
  rows:
  - text:
      - "Лишь к сумеркам репетиция наконец подошла к концу."
  - char: "bennington"
    side: "left"
    text:
      - "Фух! После целого дня за барабанами прямо полегчало!"
  - char: "john_rodgers"
    side: "right"
    text:
      - "Я... так устала..."
      - "Внезапно мысль о работе за кулисами уже не кажется такой уж плохой..."
  - char: "harrison"
    side: "left"
    text:
      - "Отличная работа, девочки. И ты, Роджерс, держалась молодцом."
  - char: "vicksburg"
    side: "right"
    text:
      - "Спасибо за твои замечательные уроки сегодня, Ричард!"
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Не стоит благодарности. ♪"
      - "Вы все отлично потрудились. Последний прогон вышел просто шикарным!"
      - "И тебе тоже спасибо за работу, Профессор."
  - char: "commander"
    side: "right"
    text:
      - "Ну... ты ведь всё это время вела меня за собой. Наверное, больше всех из нас устала именно ты."
  - char: "bon_omm_richard2"
    side: "left"
    text:
      - "Со мной всё в полном порядке. Мне было весело!"
      - "А тебе разве нет, Профессор?"
