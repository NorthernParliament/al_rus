chapter1:
  rows:
  - text:
      - "На следующий день, двигаясь по карте, мы отыскали кабинет нашей цели."
  - char: "administrator_blue"
    side: "left"
    text:
      - "*вздыхает*... Какая тоска..."
      - "Вы хотите пропустить весь процесс отбора?.. До чего же это удручает..."
  - char: "john_rodgers"
    side: "right"
    text:
      - "Просто скажи нам, сможешь ты это устроить или нет!"
  - char: "administrator_blue"
    side: "left"
    text:
      - "Смогу ли? Конечно, но мне просто так тоскливо..."
  - char: "vicksburg"
    side: "right"
    text:
      - "Если проблема только в этом, почему бы тебе не рассказать, что стряслось? Может, мы сможем помочь!"
  - char: "administrator_blue"
    side: "left"
    text:
      - "Люди вроде вас постоянно приходят и только добавляют мне работы... Вы ведь такие не одни."
      - "В этом городе слишком много работы. вздыхает... Какая тоска."
  - char: "john_rodgers"
    side: "right"
    text:
      - "Угх! Хватит уже ныть и просто скажи, чего ты хочешь!"
  - char: "harrison"
    side: "left"
    text:
      - "Роджерс... Мы ведь те, кто просит об услуге, помнишь?"
  - char: "john_rodgers"
    side: "right"
    text:
      - "Знаю я!"
      - "Кхм... ПОЖАЛУЙСТА, хватит ныть и скажи, чего ты хочешь! Вот."
  - char: "administrator_blue"
    side: "left"
    text:
      - "Я бы хотела работать вечно и никогда не уходить со смены..."
      - "Вот чего я хочу. Если сможете решить эту удручающую проблему, я выдам вам разрешение на выступление."
  - char: "bennington"
    side: "right"
    text:
      - "П-постой, ты... ХОЧЕШЬ работать вечно?!"
  - char: "administrator_blue"
    side: "left"
    text:
      - "Именно!"
  - char: "commander"
    side: "right"
    text:
      - "Не могу сказать, что я её не понимаю."
  - char: "bennington"
    side: "left"
    text:
      - "Чего-чего?!"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Ого! А ты и впрямь бесконечно предан своей работе, Профессор."
      - "Хм-м... Столь безумное желание нам точно не исполнить обычными методами."
      - "Может, у нашего дорогого друга-детектива найдётся зацепка?"
  - char: "commander"
    side: "left"
    text:
      - "Ты клонишь к тому... что нам нужно найти аномалию, способную исполнить это желание?"
  - char: "bon_omm_richard2"
    side: "right"
    text:
      - "Хе-хе, вполне в духе этого города, разве нет?"
