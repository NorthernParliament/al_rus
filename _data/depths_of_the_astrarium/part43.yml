chapter1:
  rows:
  - text:
      - "Прошло некоторое время после того, как битва завершилась."
      - "Бури стихли, гиганты исчезли, а противоборствующие белая масса и чёрный туман рассеялись."
      - "Всё, что осталось — море обломков..."
      - "И одна девушка, которая продолжала петь посреди всего этого."

chapter2:
  rows:
  - char: "bon_omm_richard"
    side: "right"
    status: "is-gray"
    text:
      - "Какая жалость, Профессор... Боюсь, ты проиграл."
  - text:
      - "По взмаху её руки украденный диск вновь оказался на её ладони."
  - char: "bon_omm_richard"
    side: "right"
    status: "is-gray"
    text:
      - "Раз уж ты мне что-то отдал, забрать это назад не выйдет — это всё ещё моё."
      - "Похоже, твой план закончился провалом, а, Зеро?"
      - "Честно говоря, я даже не понимаю, ради чего ты вообще шла на такой риск."
      - "Впрочем, это больше не имеет значения."
  - text:
      - "Она звонко щёлкнула пальцами."

chapter3:
  rows:
  - text:
      - "С этим щелчком мир изменился."
  - char: "bon_omm_richard"
    side: "right"
    status: "is-gray"
    text:
      - "Э-хе-хе♪"
